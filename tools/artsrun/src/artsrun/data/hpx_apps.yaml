# The HPX-origin section of the catalog: programs whose original is an HPX
# program, mirrored in OCR.  A row here is one program on four runtimes.
# Its name ends in `_hpx` and is the binary stem; the runtime tag is the
# last token, as everywhere: the HPX program is `<name>_hpx` (built by the
# HPX app project into build/benchmarks/hpx/), the OCR mirrors are
# `<name>_arts_<variant>`, `<name>_xsocr`, `<name>_ocrvx` (built by the app
# factory into build/benchmarks/apps/).  One tier, no hint layer, no rewrite: the
# placement an HPX program states is carried by the mirror as hints, so
# there is nothing a hint layer could add.  Every other field means what it
# means in apps.yaml; a name here may not appear there.
#
# `kind` is the same classification: an app is cited by name outside this
# catalog, a toy is named after an operation.

apps:
  fib_hpx:
    binary: fib_hpx
    timing_metric: app_s
    timing_contract: hpx-origin/fib_hpx/source-interval-v1
    default_enabled: false
    class: task
    provenance: 'HPX quickstart example fibonacci_futures_distributed: distributed Fibonacci over futures and plain actions'
    kind: toy
    marker: 'fibonacci_future\(\d+\) == \d+'
    scalar_re: 'fibonacci_future\(\d+\) == (\d+)'
    scalar_kind: int
    # Every call above the serial threshold is a task; the n-1 branch is
    # spawned, the n-2 branch is recursed inline, and at the distribute-at
    # level the children go to the next localities of a per-locality
    # round-robin.  Width grows with n - threshold; distribute-at sets how
    # many subtrees leave locality 0.  Test 1 only (test 0 is the serial
    # reference the mirror does not carry).
    # The pin fires at every rung: this row's arguments do not vary with the
    # node count, so expect_args equals the cell's args at all four.
    expect: '4052739537881'
    expect_args: ['--n-value=62', '--threshold=44', '--distribute-at=57', '--n-runs=1', '--test=1']
    # Sizing: n - threshold = 18 holds the task count at the gate's relation
    # (about 21 900 tasks), distribute-at = n - 5; n is the size knob, the
    # serial work below the threshold growing as phi^n.  Sized to the one-node
    # window.
    args: ['--n-value=62', '--threshold=44', '--distribute-at=57', '--n-runs=1', '--test=1']
    unordered_writes: 'every spawned fib task takes its rank''s locality state block RW (fib_hpx.c:47)'

  stencil1d_hpx:
    binary: stencil1d_hpx
    timing_metric: app_s
    timing_contract: hpx-origin/stencil1d_hpx/source-interval-v1
    class: spmd
    provenance: 'HPX example 1d_stencil_8: distributed 1D heat equation, one stepper component per locality, partitions exchanged as components and boundary elements pulled by action'
    kind: app
    marker: 'CHECKSUM\s+[-0-9.eE+]+'
    scalar_re: 'CHECKSUM\s+([-0-9.eE+]+)'
    tolerance: 1e-09
    # No cross-geometry pin, and the reason is the origin's: a partition is
    # initialised to its LOCAL index (`partition(here, nx, double(i))` inside
    # do_work), so the initial grid -- and the final checksum with it -- is a
    # function of the locality count.  The oracle is the four runtimes
    # agreeing at each geometry, which is what consensus votes; a pinned
    # answer would have to be one per node count and the catalog carries one.
    # The scalar is the plain sum of the final state (the origin computes no
    # printable quantity of its own).  It is conserved by the periodic
    # update for any coefficient and so cannot distinguish a reversed ring
    # from the right one -- a property of the quantity, disclosed in the
    # appdoc, not something the program is changed to avoid.
    # The tolerance is also what covers the xsocr entry's PRINTF: that
    # runtime replaces printf with its own formatter, which renders a double
    # to about a part in 1e15 (and no `%g` precision at all), so its line can
    # read one ulp of the total below an answer that is bit-identical to
    # every other entry's.
    # Sizing: np is the parallel width, 4096 (a power of two above the widest
    # geometry's worker total, 128 per node at 32, aligned to neither runtime's
    # thread count; the origin divides it by the locality count); nt and nd
    # keep the origin's published values; nx, the points per partition, carries
    # the duration.  Both sides keep nd+2 generations of partition arrays alive
    # (the origin's free list never releases and its components retire two
    # steps late; the mirror keeps a ring of the same depth per partition), so
    # the one-node cell is held below its window by the resident set that the
    # registered pool's ladder maps over those generations: nx stops where the
    # measured resident set fits the one-node memory budget with margin.
    args: ['--nx=270000', '--nt=45', '--np=4096', '--nd=10']
    unordered_writes: 'the per-rank semaphore block is satisfied while held and signalled by unordered writers (stencil1d_hpx.c:251, :507-528)'

  network_storage_hpx:
    binary: network_storage_hpx
    timing_metric: app_s
    timing_contract: hpx-origin/network_storage_hpx/source-interval-v1
    class: spmd
    provenance: 'HPX performance test network_storage: bulk put/get of fixed-size transfers between per-locality storage arrays, block-cyclic or random targets at random offsets'
    kind: toy
    default_enabled: false
    marker: 'TRANSFERS_OK\s+\d+\s+\d+'
    scalar_re: 'TRANSFERS_OK\s+(\d+)'
    scalar_kind: int
    extra_scalars:
      reads: 'TRANSFERS_OK\s+\d+\s+(\d+)'
    # --globalMB=G gives each of the n localities G/n MB, cut into
    # (G/n)*1024/transferKB slots, and with --all-to-all every locality puts
    # (iterations + 1) passes of its slots -- the warm-up runs through the
    # same write continuation and is counted, on both sides -- and gets
    # `iterations` passes.  So the totals, (iterations + 1)*G*1024/transferKB
    # puts and iterations*G*1024/transferKB gets, are the same at every
    # geometry as long as --all-to-all is true, n divides G, and transferKB
    # divides (G/n)*1024: 768 and 512 at 1, 2, 4 and 8 nodes with the
    # arguments below (720 and 480 at 3).  The put count votes and is pinned;
    # the get count rides as an extra.  The payload is the one thing in this
    # section outside DB-WRF at block granularity: transfers that land on one
    # slot are not ordered, in the origin (its storage array has no lock) or
    # in the mirror, so nothing reads the bytes, here or there, and the counts
    # survive only because every completion runs on the counters' home rank --
    # an implementation accident, not program ordering; the row is outside
    # DB-WRF.
    expect: '393216'
    expect_args: ['--globalMB=4096', '--transferKB=64', '--iterations=5', '--semaphore=16', '--all-to-all=true', '--no-local=false', '--distribution=1']
    # Sizing: iterations and transferKB keep the origin's published values;
    # globalMB is the size knob and stops at the origin's 4096 MB store ceiling
    # (32-bit offsets), below the one-node window -- recorded, not sized past.
    # --semaphore is inert on both sides; the width is the slot count.
    args: ['--globalMB=4096', '--transferKB=64', '--iterations=5', '--semaphore=16', '--all-to-all=true', '--no-local=false', '--distribution=1']
    unordered_writes: 'every concurrent completion holds the counters and results blocks RW; slots collide at random (network_storage_hpx.c:204)'

  fft_hpx:
    binary: fft_hpx
    timing_metric: app_s
    timing_contract: hpx-origin/fft_hpx/source-interval-v1
    class: spmd
    provenance: 'hpx-fft (DaRUS doi:10.18419/darus-4520, Strack and Pflüger): distributed 2D real-to-complex FFT over row-blocked data, two scatter exchanges around the transpose'
    kind: app
    marker: 'CHECKSUM\s+[-0-9.eE+]+'
    scalar_re: 'CHECKSUM\s+([-0-9.eE+]+)'
    tolerance: 1e-09
    # --nx and --ny are the DIMENSIONS, not their logarithms: the paper's own
    # script passes --nx=16384 --ny=16384.  The row fixes --run=scatter, the
    # scheme the paper proposes; the origin's all_to_all is a different
    # collective with a different message pattern and would be a second row.
    #
    # The pair must divide the geometry exactly.  The program computes
    # n_x_local = nx / nl and n_y_local = (ny/2 + 1) / nl by truncating
    # division, so a non-dividing pair silently drops the trailing rows and
    # transforms a smaller array than the one asked for.  At --nx=256
    # --ny=254 the two counts are 256 and 128, which divide every node count
    # up to sixteen.
    #
    # No cross-geometry pin, and the reason is the origin's own arithmetic.
    # It is NOT the first transpose's nl*j + i column ordering, which cannot
    # move this program's answer: every row starts as the same ramp, so after
    # the real-to-complex pass every row is identical and the vector the
    # second transform sees is constant in x at every locality count --
    # permuting a constant vector changes nothing.  What moves it is the
    # SECOND transpose, which reads its chunk with the first phase's input
    # stride (dim_c_y_part) where that chunk was cut with dim_c_x_part: both
    # strides follow the locality count, so which chunk elements reach the
    # result does too.  The row's pinlessness is a symptom of that kept
    # kernel, not of the block distribution.  Measured on the HPX entry at
    # these arguments:
    # 28434214.354769, 26606318.203792, 24780157.170575 and 22952333.813996
    # at one, two, four and eight.  The oracle is the four runtimes agreeing
    # at each geometry, which is what consensus votes; a pinned answer would
    # have to be one per node count and the catalog carries one.
    #
    # The scalar is the plain sum of the final array -- the origin computes
    # no printable quantity of its own, only a phase-by-phase timing table.
    # The tolerance covers three things, none of them a difference in the
    # answer: the two sides reduce in different orders (an all_reduce against
    # the mirror's rank-order sum), the two sides link different compiled
    # FFTW binaries -- same source, same configuration, same planner and
    # selected plan (the ESTIMATE plan text at this pair is byte-identical
    # between the two builds), but the HPX program's FFTW is compiled by GCC
    # and the OCR mirror's is compiled and translated by clang, so the
    # codelet machine code differs in its last-bit rounding -- and the xsocr
    # entry's own printf replacement renders a double to about a part in
    # 1e15.  1e-09 is the sibling pinless row's tolerance and is as tight as
    # the printing allows: the entries agree to about 1e-16, and the widest
    # of the three causes is the %.14g/%.14e granularity at about 3.5e-14
    # relative.  It does not loosen as a calibrated checksum grows -- both
    # sides print a fixed number of significant digits.
    # Sizing: nx and ny move together (ny = nx - 2, the paper's own square;
    # ny/2+1 <= nx is the usage rule), nx FFTW-sized with nx and ny/2+1
    # divisible by every node count to 32 (2250 rows per node at 32, aligned to
    # neither runtime's thread count).  Sized to the one-node window through
    # each arm's measured two-point exponent under the memory budget with margin.
    args: ['--nx=72000', '--ny=71998', '--plan=estimate', '--run=scatter']
    unordered_writes: 'row-parallel loops hold one array RW from nxl/nyl siblings (fft_hpx.c:388, :379); see the appdoc''s DB-WRF paragraph'
