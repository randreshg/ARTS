# The coherence-configuration plane.
#
# Three axes, in the paper's order: the validity (how a copy stays valid after
# a write) is the row; the retention (who starts the ownership's return)
# groups the columns; the read source (where a reader's copy comes from)
# splits each group.  Only combinations a build accepts appear under `cells`;
# every other grid position is unbuildable and carries the reason the build
# itself gives, so the selection screen can explain the gap instead of hiding
# it.  OWNER needs RETAIN: a voluntary return hands back only the ownership
# while the bytes stay at the ex-owner, so the home could not serve a reader
# alone.  Under EXCL the retention fixes the read source: no copy outlives a
# write turn, so the payload rides the ownership and rests at the home under
# PURGE and with the last writer under RETAIN.
#
# Two cells are also implemented by an independent runtime.  Those cells offer
# a second entry, which is what makes a configuration comparable across
# engines at a fixed design point.

# Read combining is part of VAL's definition (every message class suppresses
# duplicate concurrent requests), so it is not a validity here.
validities: [EXCL, INV, VAL]
retentions: [PURGE, RETAIN]
read_sources: [HOME, OWNER]

validity_labels:
  EXCL: EXCL
  INV: INV
  VAL: VAL

# The validities are acronyms and stay upper-case; the retentions and read
# sources are ordinary words and read as such.
retention_labels:
  PURGE: Purge
  RETAIN: Retain

read_source_labels:
  HOME: Home
  OWNER: Owner

cells:
  - validity: EXCL
    retention: PURGE
    read_source: HOME
    variant: ocr_excl_purge_home
    reference: xsocr
    entries:
      - label: ARTS-CXL-STAGED
        variant: ocr_excl_purge_home_cxl_staged
      - label: ARTS-CXL-DIRECT
        variant: ocr_excl_purge_home_cxl_direct
  - validity: EXCL
    retention: RETAIN
    read_source: OWNER
    variant: ocr_excl_retain_owner
  - validity: INV
    retention: RETAIN
    read_source: HOME
    variant: ocr_inv_retain_home
  - validity: INV
    retention: RETAIN
    read_source: OWNER
    variant: ocr_inv_retain_owner
    reference: ocrvx
  - validity: INV
    retention: PURGE
    read_source: HOME
    variant: ocr_inv_purge_home
  - validity: VAL
    retention: RETAIN
    read_source: HOME
    variant: ocr_val_retain_home
  - validity: VAL
    retention: RETAIN
    read_source: OWNER
    variant: ocr_val_retain_owner
  - validity: VAL
    retention: PURGE
    read_source: HOME
    variant: ocr_val_purge_home

# Why a grid position carries no configuration.  Keyed by the rule that
# excludes it; the model picks the rule that applies.
unbuildable:
  excl_retention_sets_read_source: >-
    Under EXCL the retention fixes the read source — no copy outlives a write
    turn, so the payload rides the ownership: HOME with PURGE, OWNER with
    RETAIN.
  owner_needs_retain: >-
    OWNER requires RETAIN — a voluntary return hands back only the ownership
    while the bytes stay at the ex-owner, so the home still cannot serve a
    reader alone (shipping the bytes home too is the HOME read source).

# A runtime that implements no position on this plane: its comparison axis
# is the programming model, not a coherence design point, so it hangs off no
# cell, never multiplies by the plane, and runs the HPX-applications section
# of the catalog (`hpx_apps.yaml`) alone: each row is an HPX program and its
# OCR mirror, where its scalar joins the ordinary consensus vote.
external_references:
  hpx:
    label: HPX
    kind: hpx
    note: >-
      STE||AR HPX with the MPI parcelport; cross-programming-model
      reference — runs the HPX-applications section of the catalog
      (`hpx_apps.yaml`) alone: each row is an HPX program and its OCR mirror

references:
  xsocr:
    label: XSOCR
    kind: xsocr
    note: home-based purging lock; the same design point as EXCL·PURGE·HOME
  ocrvx:
    # OCR-vx is the project; it ships three runtime families (v1, vsm, vdm).
    # The one built here is the distributed-memory family, so the label names
    # that rather than the project.
    label: OCR-Vdm
    kind: ocrvx
    note: owner-resident write-invalidate; the same design point as INV·RETAIN·OWNER

# Every protocol requires a memory model of the program.  The grid above holds
# the OCR-model protocols: the runtime orders every conflict, so any OCR-legal
# program is admitted.  The protocols below require the CDAG model instead —
# they are correct only for programs that order every pair of a block's write
# acquisitions — so they sit under their own heading and never in the grid.
models:
  CDAG:
    label: CDAG
    note: >-
      every pair of a DataBlock's write acquisitions is ordered by
      happens-before, released by any means (an explicit release, a downgrade
      or the EDT's completion); read acquisitions are unconstrained
    cells:
      - arm: FLUSH
        label: FLUSH
        variant: cdag_flush
        note: >-
          fetch the whole payload at every remote acquire, write it back at
          every remote RW release, block for the home's acknowledgement
