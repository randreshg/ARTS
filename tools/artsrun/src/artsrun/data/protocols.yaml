# The coherence-configuration plane.
#
# Rows are the coherence family; columns are the two second axes (release
# policy x write policy).  Only combinations a build accepts appear under
# `cells`; every other grid position is unbuildable and carries the reason the
# build itself gives, so the selection screen can explain the gap instead of
# hiding it.
#
# Two cells are also implemented by an independent runtime.  Those cells offer
# a second entry, which is what makes a configuration comparable across
# engines at a fixed design point.

# Read combining is part of the VAL family's definition (every message class
# suppresses duplicate concurrent requests; the *_nocomb build variants are the
# off-plane ablation twins), so it is not a family here.
families: [EXCL, INV, VAL]
releases: [PURGE, RETAIN]
writes: [WT, WB]

family_labels:
  EXCL: EXCL
  INV: INV
  VAL: VAL

# Spelled out: the abbreviations are easy to swap for each other at a glance.
write_labels:
  WT: Write Through
  WB: Write Back

# The family names are acronyms and stay upper-case; the policies are
# ordinary words and read as such.
release_labels:
  PURGE: Purge
  RETAIN: Retain

cells:
  - family: EXCL
    release: PURGE
    write: WB
    variant: ocr_excl_purge
    reference: xsocr
    entries:
      - label: ARTS-CXL-STAGED
        variant: ocr_excl_purge_cxl_staged
      - label: ARTS-CXL-DIRECT
        variant: ocr_excl_purge_cxl_direct
  - family: EXCL
    release: RETAIN
    write: WB
    variant: ocr_excl_retain
  - family: INV
    release: RETAIN
    write: WT
    variant: ocr_inv_wt
  - family: INV
    release: RETAIN
    write: WB
    variant: ocr_inv_wb
    reference: ocrvx
  - family: INV
    release: PURGE
    write: WT
    variant: ocr_inv_wt_purge
  - family: VAL
    release: RETAIN
    write: WT
    variant: ocr_val_wt
  - family: VAL
    release: RETAIN
    write: WB
    variant: ocr_val_wb
  - family: VAL
    release: PURGE
    write: WT
    variant: ocr_val_wt_purge

# Why a grid position carries no configuration.  Keyed by the rule that
# excludes it; the model picks the rule that applies.
unbuildable:
  excl_needs_wb: >-
    EXCL requires WB — the payload rides the permission, so the release
    policy already decides both halves.
  needs_retain: >-
    Write-back requires RETAIN — a voluntary return hands back only the
    permission while the bytes stay at the ex-owner, so the home still
    cannot serve a reader alone (shipping the bytes home too is, by
    definition, write-through).

# A runtime that implements no position on this plane: its comparison axis
# is the programming model, not a coherence design point, so it hangs off no
# cell, never multiplies by the plane, and runs the HPX-origin section of
# the catalog (`hpx_apps.yaml`): each row is an HPX program and its OCR
# mirror, where its scalar joins the ordinary consensus vote.
external_references:
  hpx:
    label: HPX
    kind: hpx
    note: >-
      STE||AR HPX with the MPI parcelport; cross-programming-model
      reference — runs the HPX-origin section of the catalog
      (`hpx_apps.yaml`): each row is an HPX program and its OCR mirror

references:
  xsocr:
    label: XSOCR
    kind: xsocr
    note: home-based purging lock; the same design point as EXCL x PURGE
  ocrvx:
    # OCR-vx is the project; it ships three runtime families (v1, vsm, vdm).
    # The one built here is the distributed-memory family, so the label names
    # that rather than the project.
    label: OCR-Vdm
    kind: ocrvx
    note: owner-resident write-invalidate; the same design point as INV x WB

# Every protocol requires a memory model of the program.  The grid above holds
# the OCR-model protocols: the runtime orders every conflict, so any OCR-legal
# program is admitted.  The protocols below require the DB-WRF model instead —
# they are correct only for programs whose write acquisitions are exclusive —
# so they sit under their own heading and never in the grid.  A cell with no
# variant is a retired arm: drawn with its reason, never selectable.
models:
  DB_WRF:
    label: DB-WRF
    note: >-
      exclusive write acquisition — at most one write-mode acquisition of a
      DataBlock is live at any time, and the program guarantees it by
      happens-before; read acquisitions are unconstrained
    cells:
      - arm: FLUSH
        label: FLUSH
        variant: wrf_flush
        note: >-
          fetch the whole payload at every remote acquire, write it back at
          every remote RW release, block for the home's acknowledgement
      - arm: VAL_WT_RETAIN
        label: VAL·WT·RETAIN
        reason: >-
          retired — the validation family carried under a model that needs no
          validation (buffer versions, a served-version ledger, read and
          write combining); FLUSH is the model's arm
