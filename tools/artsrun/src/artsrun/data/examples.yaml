# The ARTS-examples section of the catalog: the native programs of
# examples/, written against the public arts.h alone.  The ARTS entries run
# them and nothing else does — no reference runtime runs the ARTS API, so a
# row here paired with xsocr, ocrvx or hpx is not a cell.  A row's name ends
# in `_example` and is the binary stem: the program is
# `<name>_arts_<variant>`, built for every variant into build/examples/ by a
# benchmark tree with ARTS_BUILD_EXAMPLES on.  One tier: no hint layer, no
# rewrite.  A row's structural document is docs/examples/<stem>.md, titled
# `# <name>`, the same page the Sphinx documentation renders.  Every other
# field means what it means in ocr_apps.yaml; a name here may not appear
# there.
#
# A row reads what its program already prints.  `expect` pins a value only
# where the printed answer does not depend on the node count, at the row's
# own arguments; a roster that overrides them has left the pin behind.

apps:
  fib_example:
    binary: fib_example
    class: task
    kind: toy
    provenance: 'ARTS example: recursive Fibonacci, one EDT per call, each result carried up as a slot value'
    marker: 'Fib \d+: \d+ time:'
    scalar_re: 'Fib \d+: (\d+) time:'
    scalar_kind: int
    # fib(20); the answer is the recursion's, whatever rank each call ran on.
    expect: '6765'
    expect_args: ['20']
    args: ['20']
    default_enabled: false

  fib_db_example:
    binary: fib_db_example
    class: task
    kind: toy
    provenance: 'ARTS example: recursive Fibonacci, one EDT per call, each value carried in a data block its last reader destroys'
    marker: 'Fib \d+: \d+ time:'
    scalar_re: 'Fib \d+: (\d+) time:'
    scalar_kind: int
    # fib(20); the answer is the recursion's, whatever rank each call ran on.
    expect: '6765'
    expect_args: ['20']
    args: ['20']
    default_enabled: false

  reduction_example:
    binary: reduction_example
    class: task
    kind: toy
    provenance: 'ARTS example: one block per rank gathered into a single summing task'
    marker: 'Result \d+'
    scalar_re: 'Result (\d+)'
    scalar_kind: int
    # The sum of the rank ids, n(n-1)/2: it depends on the node count, so no
    # pin; the consensus compares entries at one node count.
    default_enabled: false

  nqueens_example:
    binary: nqueens_example
    class: task
    provenance: 'ARTS example: N-Queens search, one EDT and one board block per partial placement'
    marker: 'Number of solutions: \d+'
    scalar_re: 'Number of solutions: (\d+)'
    scalar_kind: int
    # 10-queens; the count is the search's, whatever rank each board ran on.
    expect: '724'
    expect_args: ['10']
    args: ['10']
    default_enabled: false

  tiled_matmul_example:
    binary: tiled_matmul_example
    class: task
    kind: toy
    provenance: 'ARTS example: blocked matrix product over tile blocks, sized at compile time'
    # The program prints no result value: its completion line is the check.
    marker: 'DONE \d+'
    scalar_kind: bool
    default_enabled: false

  cholesky_example:
    binary: cholesky_example
    class: task
    provenance: 'ARTS example: tiled Cholesky factorization, a native port of the OCR cholesky example'
    # The program checks trace(L L^T) against trace(A); a FAIL line carries
    # no marker.
    marker: 'rel_err=\S+ PASS'
    scalar_re: 'trace\(L L\^T\)=([0-9.eE+-]+)'
    tolerance: 1e-06
    args: ['--ds', '1000', '--ts', '50']
    default_enabled: false

  bfs_example:
    binary: bfs_example
    class: task
    provenance: 'ARTS example: asynchronous label-correcting BFS over a block-distributed CSR graph, one relax EDT per message, ended by a finish scope'
    # The program prints the levels of rank 0's vertices only, a set that
    # changes with the node count, so the row is completion only: the marker
    # heads that list.
    marker: 'Printing vertex levels'
    scalar_kind: bool
    # The smaller generated graph (fixtures.py): 512 vertices, 2074
    # undirected edges read with --flip, searched from vertex 0.  The
    # search prints two lines per message, and its messages grow far faster
    # than the graph: the other graph rows' 4096 vertices make of the order
    # of 1e7.
    args: ['--file', '{repo}/datasets/graph_examples/graph-examples-512.txt', '--num-vertices', '512', '--num-edges', '2074', '--flip', '--source', '0']
    fixtures: ['{repo}/datasets/graph_examples/graph-examples-512.txt']
    default_enabled: false

  triangle_count_example:
    binary: triangle_count_example
    class: task
    provenance: 'ARTS example: triangle counting over a block-distributed CSR graph by sorted neighbour-list merges, a vertex''s list shipped to each other rank that owns a neighbour'
    marker: 'Triangle Count: \d+ Time:'
    scalar_re: 'Triangle Count: (\d+) Time:'
    scalar_kind: int
    # The generated graph's count, from examples/inputs/graph_reference.py,
    # at any node count.
    expect: '2754'
    expect_args: ['--file', '{repo}/datasets/graph_examples/graph-examples-4096.txt', '--num-vertices', '4096', '--num-edges', '16668', '--flip']
    args: ['--file', '{repo}/datasets/graph_examples/graph-examples-4096.txt', '--num-vertices', '4096', '--num-edges', '16668', '--flip']
    fixtures: ['{repo}/datasets/graph_examples/graph-examples-4096.txt']
    default_enabled: false

  scan_statistics_example:
    binary: scan_statistics_example
    class: task
    provenance: 'ARTS example: the maximum scan statistic of a block-distributed CSR graph, a vertex''s neighbourhood intersected on every rank and gathered per vertex, then globally'
    marker: 'Max vertex_t: \d+ scan_stat: \d+'
    scalar_re: 'Max vertex_t: \d+ scan_stat: (\d+)'
    scalar_kind: int
    # The generated graph's maximum (at vertex 3874), from
    # examples/inputs/graph_reference.py, at any node count.
    expect: '34'
    expect_args: ['--file', '{repo}/datasets/graph_examples/graph-examples-4096.txt', '--num-vertices', '4096', '--num-edges', '16668', '--flip']
    args: ['--file', '{repo}/datasets/graph_examples/graph-examples-4096.txt', '--num-vertices', '4096', '--num-edges', '16668', '--flip']
    fixtures: ['{repo}/datasets/graph_examples/graph-examples-4096.txt']
    default_enabled: false
