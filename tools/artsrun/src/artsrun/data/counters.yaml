# Counters the runtime defines, as its own X-macro list declares them.
#
# This file mirrors libs/include/internal/arts/counter/counter.h: a counter
# that is not in that list cannot be enabled, and one added there has to
# appear here before the driver will offer it.  What a campaign switches on,
# and at which level, is a counter set under experiments/countersets/.
#
# Selecting counters is a BUILD-time decision: the set is parsed at configure
# time into Preamble.h, whose indices are compiled in.  Changing it forces a
# reconfigure and a full rebuild.

counters:
  TIME_EDT_EXEC:
    group: 'EDT time'
    unit: ns
    help: 'Wall time inside EDT bodies, summed over a rank''s threads and paused while a body blocks in arts_event_wait; includes every runtime call the body makes, not the acquires before it or the releases after'

  TIME_EDT_CREATE:
    group: 'EDT time'
    unit: ns
    help: 'Wall time of arts_edt_create on the creating thread: placement, allocation, GUID, finish-scope join, and the ship to a remote home or the local install (readying the EDT and starting its DB acquires when its dependences are already met)'

  TIME_EDT_SIGNAL:
    group: 'EDT time'
    unit: ns
    help: 'Wall time of arts_edt_satisfy_slot on the satisfying thread, including readying the EDT and starting its DB acquires when the satisfy is its last; a satisfy of a remote EDT is only the send'

  NUM_EDT_CREATE:
    group: 'EDT counts'
    unit: count
    help: 'EDT creates issued on this rank, whatever the EDT''s home; includes the runtime''s main EDT and, under the OCR shim, the trampoline EDT that runs mainEdt'

  NUM_EDT_ACQUIRE:
    group: 'EDT counts'
    unit: count
    help: 'EDTs whose dependences and DB acquires all completed and that were queued to run, on the EDT''s rank'

  NUM_EDT_FINISH:
    group: 'EDT counts'
    unit: count
    help: 'EDTs whose body returned, on the executing rank; includes the main EDT and the shim''s trampoline, not EDTs destroyed before running or abandoned at shutdown'

  NUM_EDT_SIGNAL:
    group: 'EDT counts'
    unit: count
    help: 'EDT dependence-slot satisfactions (arts_edt_satisfy_slot calls), counted on the rank that issues them'

  NUM_YIELD:
    group: 'EDT counts'
    unit: count
    help: 'Calls to arts_event_wait'

  TIME_DB_CREATE:
    group: 'DB time'
    unit: ns
    help: 'Wall time of arts_db_create on the creating thread: placement, descriptor and payload allocation, GUID mint, and the local install or the announce to a remote home (no payload copy)'

  NUM_DB_CREATE:
    group: 'DB counts'
    unit: count
    help: 'arts_db_create calls that returned a block, counted on the creating rank whatever the block''s home, with or without a hold'

  NUM_DB_CREATE_NO_ACQUIRE:
    group: 'DB counts'
    unit: count
    help: 'The creates NUM_DB_CREATE counts that passed ARTS_DB_PROP_NO_ACQUIRE (no creator hold)'

  NUM_DB_DESTROY:
    group: 'DB counts'
    unit: count
    help: 'arts_db_destroy calls on a DataBlock GUID, on the calling rank'

  NUM_DB_ACQUIRE_READ:
    group: 'DB counts'
    unit: count
    help: 'EDT read acquisitions: one per (EDT, block) whose strongest slot names it RO, on the EDT''s rank when the slot reaches the block''s arm (several slots naming one block are one acquisition, in the strongest mode)'

  NUM_DB_ACQUIRE_WRITE:
    group: 'DB counts'
    unit: count
    help: 'EDT write acquisitions: one per (EDT, block) whose strongest slot names it RW, plus one per create that takes the creator''s hold, on the creating rank'

  NUM_DB_ACQUIRE_LOCAL_HIT:
    group: 'Coherence: acquires'
    unit: count
    help: 'Acquisitions (READ + WRITE) whose rank held what they need at their decision, whatever they then waited behind (a write right installed but not yet confirmed included): the write right for a write; for a read a valid copy it may read, a read turn, the write right or, under validation, the block''s home answering itself (a create''s hold, a zero-size block and a serve from what the rank holds included: a phase change on the rank, a create''s claim of its first-touch cache); under the voluntary-return policy every acquisition on the block''s home rank; every acquisition of a one-rank run'

  NUM_DB_ACQUIRE_REMOTE:
    group: 'Coherence: acquires'
    unit: count
    help: 'Acquisitions (READ + WRITE) whose permission or copy had to come from another rank: a grant or migration of the write right, a read turn, read reply or first publish another rank sent, and a validation read off the block''s home that its rank''s write right does not cover; never decided by the messages an acquisition caused, what it waited behind or which path ended the wait (a first publish counts from its publisher''s rank); LOCAL_HIT + REMOTE = READ + WRITE when the shutdown is quiescent (an acquisition a non-quiescent shutdown leaves parked is in neither)'

  BYTES_DB_CREATE:
    group: 'DB bytes'
    unit: bytes
    help: 'Declared bytes of the blocks NUM_DB_CREATE counts'

  BYTES_DB_PAYLOAD_SENT:
    group: 'Coherence: payload'
    unit: bytes
    help: 'Datablock bytes this rank put on the fabric one-sided (a CXL store''s transfers are the CXL counters)'

  NUM_DB_PAYLOAD_SENT:
    group: 'Coherence: payload'
    unit: count
    help: 'Datablock payloads this rank put on the fabric one-sided, one per payload however many pieces the provider cut it into'

  TIME_DB_PAYLOAD_PUT:
    group: 'Coherence: payload'
    unit: ns
    help: 'Time from a payload PUT''s post to its last piece''s local completion (time on the sender''s retry ring included), added by the thread that reaps that completion'

  BYTES_MEMORY_FOOTPRINT:
    group: 'Memory'
    unit: bytes
    help: 'Usable bytes held through the runtime''s arts_malloc family (control structures, not DB payloads or the registered pool); a thread''s value wraps when another thread frees what it allocated, so read it as a node or cluster SUM'

  BYTES_REMOTE_SENT:
    group: 'Network bytes'
    unit: bytes
    help: 'Bytes this rank put on the fabric: each two-sided message''s header and tail plus each one-sided datablock payload (no provider framing, no retries)'

  BYTES_REMOTE_RECEIVED:
    group: 'Network bytes'
    unit: bytes
    help: 'Bytes this rank took in from the fabric: each dispatched two-sided message''s header and tail plus each landed datablock payload''s whole length'

  NUM_REMOTE_SEND:
    group: 'Network counts'
    unit: count
    help: 'Two-sided messages this rank sent (one-sided payloads are NUM_DB_PAYLOAD_SENT)'

  NUM_REMOTE_RECEIVE:
    group: 'Network counts'
    unit: count
    help: 'Two-sided messages this rank dispatched'

  NUM_CXL_FLUSH_PRODUCER:
    group: 'CXL flush'
    unit: count
    help: 'Producer flushes of the CXL store (a purge publishing a turn''s writes)'

  NUM_CXL_FLUSH_CONSUMER:
    group: 'CXL flush'
    unit: count
    help: 'Consumer flushes of the CXL store (a fetch dropping stale private lines before a grant is read)'

  BYTES_CXL_FLUSH_PRODUCER:
    group: 'CXL flush'
    unit: bytes
    help: 'Declared bytes of the blocks producer flushes swept'

  BYTES_CXL_FLUSH_CONSUMER:
    group: 'CXL flush'
    unit: bytes
    help: 'Declared bytes of the blocks consumer flushes swept'

  TIME_CXL_FLUSH_PRODUCER:
    group: 'CXL flush'
    unit: ns
    help: 'Time in producer flushes, the cache-line sweep and its sfence'

  TIME_CXL_FLUSH_CONSUMER:
    group: 'CXL flush'
    unit: ns
    help: 'Time in consumer flushes, the cache-line sweep and its mfence'

  NUM_EVENT_CREATE:
    group: 'Event counts'
    unit: count
    help: 'Event creates issued on this rank, including the finish-scope proxies the runtime makes on an EDT''s home when its scope is homed elsewhere'

  NUM_EVENT_DESTROY:
    group: 'Event counts'
    unit: count
    help: 'Events retired on their home (explicit destroy, auto-destroy after firing, a counted event''s last bind); summed over the cluster, creates minus this is what remains'

  NUM_STEAL_SUCCESS:
    group: 'Scheduling'
    unit: count
    help: 'EDTs a worker took from another thread''s deque (a worker''s or a progress thread''s) and ran, counted on the thief'

  NUM_OO_ENQUEUE:
    group: 'Out-of-order'
    unit: count
    help: 'Pushes onto a route slot''s OoO list, one per park or re-park (a non-create operation whose target is not installed, or a create whose GUID is still occupied)'

  NUM_SNAPSHOT_REQUEST:
    group: 'Validation arm'
    unit: count
    help: 'VAL read requests this rank sent, one per message: re-sends after a size round, a dismiss or a write give-back and the home''s request to itself included'

  NUM_SNAPSHOT_HEADER_ONLY:
    group: 'Validation arm'
    unit: count
    help: 'VAL read replies with no payload because the requester''s ledger already held that version, counted at the replying rank'

  NUM_SNAPSHOT_SIZE_CTS:
    group: 'Validation arm'
    unit: count
    help: 'VAL read size rounds (the size alone, to a request that could not size a landing), counted at the replying rank; dismisses excluded'

  NUM_RO_COMBINE_WINDOW:
    group: 'Validation arm'
    unit: count
    help: 'VAL read windows opened: every read request that is not a re-send (a first reader''s, the next window an answer opens, a write give-back''s)'

  NUM_RO_COMBINE_JOINED:
    group: 'Validation arm'
    unit: count
    help: 'VAL readers that sent no request of their own: parked for the next window or riding the rank''s write request'

  NUM_GRANT_SIZE_CTS:
    group: 'Size rounds'
    unit: count
    help: 'Size rounds on the grant plane (VAL, INV), counted at the home; with the GUID size hint only reserved or labeled GUIDs take one'

  NUM_EXCL_SIZE_CTS:
    group: 'Size rounds'
    unit: count
    help: 'Size rounds on the EXCL plane, counted at the home; dismisses excluded'

  NUM_INV_SIZE_CTS:
    group: 'Size rounds'
    unit: count
    help: 'Size rounds on the INV read plane, counted at the home; dismisses excluded'

  NUM_FLUSH_SIZE_CTS:
    group: 'Size rounds'
    unit: count
    help: 'Size rounds on the FLUSH fetch plane, counted at the home'

  NUM_INVALIDATE_ROUND:
    group: 'Invalidation arm'
    unit: count
    help: 'INV invalidation rounds at the home that retired at least one release (a round batches every release queued when it starts)'

  NUM_INVALIDATE_ACK:
    group: 'Invalidation arm'
    unit: count
    help: 'Sharer copies the home''s rounds targeted, one ack each (a target that held no valid copy and the WB home''s own copy included)'

  TIME_INVALIDATE_ROUND:
    group: 'Invalidation arm'
    unit: ns
    help: 'Time an INV RW release blocks on its round (under WT the payload write-through included; a joined release waits for the flight it joined)'

  NUM_GRANT_MIGRATE:
    group: 'Write grant'
    unit: count
    help: 'Write requests this rank committed on the grant plane, one per round asked for (the home''s request to itself included)'

  NUM_GRANT_LOCAL_REUSE:
    group: 'Write grant'
    unit: count
    help: 'Write turns taken on a grant this rank already held'

  NUM_EXCL_QUEUE_WAIT:
    group: 'Exclusion arm'
    unit: count
    help: 'EXCL requests, read or write, the home could not grant at its decision and queued'

  NUM_EXCL_RECALL_SENT:
    group: 'Retention arm'
    unit: count
    help: 'Read grants the home asked back so a writer could proceed, one per retaining rank (itself included)'

  NUM_EXCL_RECALL_EARLY:
    group: 'Retention arm'
    unit: count
    help: 'Recalls that overtook their grant and had to be remembered, once per recall'

  NUM_PUB_FLIGHT:
    group: 'Publish flight'
    unit: count
    help: 'Publish flights launched (payload or control)'

  NUM_PUB_FLIGHT_JOIN:
    group: 'Publish flight'
    unit: count
    help: 'Releases coalesced into an already-open flight'

  NUM_PUB_FLIGHT_TRAILING:
    group: 'Publish flight'
    unit: count
    help: 'Trailing relaunches for waiters an ACK left uncovered'

  NUM_PUB_CTS_FALLBACK:
    group: 'Publish flight'
    unit: count
    help: 'Credit-less announce legs (credit teachers not covering)'

  NUM_GRANT_BATON_RECLAIM:
    group: 'Write grant'
    unit: count
    help: 'Post-release re-check found queued work and re-claimed the baton'

  NUM_GRANT_HOME_DATALESS:
    group: 'Write grant'
    unit: count
    help: 'Write requests the write-through home sends its own directory, asking for the permission alone (it already holds the newest bytes)'

  NUM_GRANT_PURGE_RETURN:
    group: 'Write grant'
    unit: count
    help: 'Write rights handed back at a holder''s own idle edge, standalone'

  NUM_GRANT_PURGE_FLAG:
    group: 'Write grant'
    unit: count
    help: 'Hand-backs that rode a release''s own publish instead of a standalone return'

  NUM_GRANT_PURGE_ACCEPT:
    group: 'Write grant'
    unit: count
    help: 'Purge hand-backs the home accepted; RETURN+FLAG minus ACCEPT is still in flight'

  NUM_GRANT_PURGE_LATCHED:
    group: 'Write grant'
    unit: count
    help: 'Hand-backs parked because another thread was inside the home''s serving tail'

  NUM_GRANT_PURGE_STALE_SETTLE:
    group: 'Write grant'
    unit: count
    help: 'Settles that found the hand-back token armed under a later grant generation and left it alone'

  NUM_GRANT_REGRANT_DEDUP:
    group: 'Write grant'
    unit: count
    help: 'Grants served with permission alone because the requester already held the current copy'

  NUM_PURGE_RETURN:
    group: 'Voluntary return'
    unit: count
    help: 'Hand-backs of a permission (with its bytes, if any) a rank sent the block''s home under the voluntary-return release policy, counted on the returning rank; the home''s own idle edge sends nothing. Grant plane: NUM_GRANT_PURGE_RETURN + NUM_GRANT_PURGE_FLAG; exclusion: every read and write turn a rank other than the home gave back'
