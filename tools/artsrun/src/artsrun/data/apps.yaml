  fft:
    binary: fft
    class: task
    provenance: 'FFT, recursive form'
    marker: 'FFT checksum'
    scalar_re: 'FFT checksum\s*=\s*([\-+0-9.eE]+)'
    tolerance: 0.001
    # Arguments are `<power> [serialBlockSize] [v] [t]`, the optional three in
    # any order.  `power` is the size (the transform is over 2^p points) and
    # the only knob a campaign moves; `serialBlockSize` is the grain -- the
    # leaf size, the combine-slave chunk and the init-slice chunk at once --
    # and is left at its published 16384; `v` runs the serial reference and is
    # never passed, since that recomputation is a reference implementation
    # rather than the work; `t` turns on the upstream per-task trace and is
    # never passed either (see the disclosure below).
    #
    # Two ceilings sit below the memory one and both loud-fail in the program.
    # The binding one is the worker stack: a combine node builds its fan-out as
    # two slave-count-sized VLAs (48 bytes a slave -- 8 for the guid array it
    # uses, 40 for an upstream dead one it does not), so
    # (N/2)/serialBlockSize <= 65536 against an 8 MiB stack.  power <= 31 is
    # NOT an arithmetic limit -- every size-scaled index is u64 -- but chosen
    # headroom one doubling below that fan-out ceiling.  Memory alone would
    # allow power 33.
    #
    # This tier anti-scales, so it is sized to a short flat target rather than
    # the longer window a strong scaler gets, and the knob only doubles: 30 is
    # one full doubling below the fan-out ceiling, holding 16 GB
    # (12*2^power + 8*(2^(power-1)/serialBlockSize) bytes, one block, never
    # replicated).  Whether the 16n/32n cells finish inside the cell timeout at
    # power 30 has never been probed on 108-worker nodes -- see the preflight.
    #
    # DISCLOSURE -- this row has NO in-program self-check in either tier.  The
    # serial reference (`v`) is opt-in and never passed, and unlike fft_dist --
    # which validates every bin against the closed-form spectrum and prints
    # FFT_DIST INVALID -- nothing in fft or fft_hinted compares its own output
    # to anything.  The driver's cross-configuration consensus vote on the
    # checksum below, at tolerance 0.001, is therefore the row's ENTIRE
    # correctness gate.
    #
    # DISCLOSURE -- the scalar is summed in the combine phase's slaves rather
    # than swept afterwards, so the summation is blocked rather than sequential
    # and the last digits moved -- 4.8e-11 relative, against a 1e-3 tolerance.
    # This is a deviation from "base keeps the published compute phase": it
    # adds no EDT, DB or event and changes no decomposition, and the plain
    # sweep it replaced is still the program's small-N branch.
    #
    # The input signal is a pure function of its index, so it is generated by
    # one task per serialBlockSize range instead of by an O(N) pass on rank 0;
    # the transform waits on that phase's FINISH scope.  Identical in both
    # tiers.
    #
    # The upstream per-task trace -- six ocrPrintf sites inside the recursion,
    # ~5.2e5 serialized write() calls at power 30 -- is now behind the `t`
    # argument and OFF by default, so nothing inside the recursion writes to
    # stdout in a campaign cell.  A run prints seven lines in total.
    expect: '170891318.894147'
    expect_args: ['27']
    # Size: the reference runtimes' comm layer casts a message length to int
    # (both of them), so a single datablock above 2 GiB aborts the run rather
    # than moving it -- 12*2^power bytes puts the ceiling at power 27
    # (1.61 GB, 25% of margin) and power 28 (3.22 GB) is the first that
    # aborts.  27 is therefore the largest size at which every runtime under
    # comparison can express the transfer at all.  It costs the one-node
    # anchor: 1.55 s, far under the row's target, and disclosed as such --
    # this row's exhibit is the ratio between write policies, not its
    # absolute time.  The ratio survives the reduction: at two ranks the
    # write-through arms are 22x the write-back arms at power 24 and still
    # divergent at 27.
    # Anchor at these arguments, one node of 108 workers, INV x WB: base 1.7
    # s / hinted 1.7 s, 5.7 GB resident; target 20 s (hinted kept, flat) --
    # 1/12 of the target, the power the reference runtimes' MPI int count
    # allows (28 aborts at two nodes), so this row is the ratio exhibit, not
    # a window-sized one.
    args: ['27']
    # The source carries a placement layer and the CMake entry builds it
    # (HINTED_PLACEMENT), so both tiers exist as one binary pair.  Every task
    # in the recursion acquires the SAME block RW, so the layer cannot
    # distribute the work; what it can do is stop the block from chasing the
    # recursion, by placing a subtree -- and each init slice -- where the part
    # of the transform it owns lives.  That covers every node: pinning to the
    # creator would leave one node doing all of it, which wins by not using the
    # machine.  A combine slave writes both halves of its range, so it is keyed
    # on offset + 2*kstart rather than on its low half alone; the low-half key
    # left the top log2(P) combine levels using half the machine (max/mean
    # 1.31 at 32 ranks, 1.19 at 8, 1.06 at 2), the doubled key is 1.000 at
    # every rank count and keeps the same monotone clustering.
    # Measured at power 28 over 15 workers a node, BEFORE that repair and as a
    # single unrepeated pair: base 8.96 s at one node and 304.26 s at eight,
    # this layer 8.85 s and 61.90 s.  Re-measure interleaved before quoting.
    hinted: true    # kept: containment of the single RW block holds the one-node number where the base degrades (2.5-3.0x at 2-8 ranks); distribution is the restructured row's
    restructured_as: fft_dist
    unordered_writes: 'one block for the whole transform is RW-held by 2^d init slices, both subtrees and every combine slave (fft.c:203-208, :323-324, :376-381)'

  fft_dist:
    binary: fft_dist
    class: task
    provenance: 'FFT, Bailey four-step transpose rewrite'
    marker: 'FFT_DIST checksum'
    # It transforms a pure tone, whose spectrum is known in closed form
    # (X[5] = X[N-5] = N/2, every other bin zero).  Every row tile checks every
    # one of its output bins against that spectrum and reports the worst
    # relative error alongside its partial sum; the printed scalar is the L1
    # sum |Re| + |Im| over the WHOLE spectrum, which equals 2^power only
    # because the non-peak bins are near zero.  The discriminating oracle is
    # the app's own per-bin gate: a run that got the transform wrong prints
    # FFT_DIST INVALID instead of a scalar and extracts nothing.
    scalar_re: 'FFT_DIST checksum\s*=\s*([\-+0-9.eE]+)'
    tolerance: 1e-06
    # Its own size, not the row it re-implements: a restructured tier is a
    # separate row with a separate window.  What fixes the size is memory, and
    # the bound is now structural rather than scheduling-dependent: the column
    # form of the matrix is 16*2^power bytes, the arrival form is another
    # 16*2^power, and no third form of the data exists, so a one-node cell
    # holds 32*2^power bytes -- 137 GB at power 32, 275 GB at 33, which is what
    # excludes 33 against the 190 GB per-node plan.
    #
    # The second argument is the tile count, this rewrite's decomposition and
    # the width of both compute stages.  Tiles are index RANGES in each matrix
    # dimension, not divisors, so the tile count is unconstrained up to the
    # smaller dimension (65536 at power 32) and the width rule can be met
    # exactly: 6912 is an integer multiple of the 3456 persistent units the
    # largest geometry provides.  The tile count is payload-neutral -- it moves
    # block sizes, not bytes -- so the width costs no memory.
    #
    # The exchange is pair-wise in PAYLOAD and per-block in TASKS.  A place
    # packs what it owes a peer for one wave of its tiles into one block, so the
    # block count is places*waves*places whatever the tile count; one packing
    # task exists per block, and the wave count is derived as
    # ceil(tiles/places^2) so that stage is at least as wide as the tile stages
    # it sits between.  The optional fourth argument overrides the wave count;
    # the campaign leaves it derived.
    #
    # Splitting the pack is a task split, not a wire split.  The earlier
    # experiment on this row split the pack per destination ROW BLOCK, which
    # put places*waves*t blocks of 2 KB on the wire and measured 5.3x WORSE at
    # eight nodes; that is NOT what is done here.  The split here is per
    # destination PLACE, so the block count stays places*waves*places and the
    # block sizes are unchanged -- only the task count moves.
    #
    # There is no repacking stage between the exchange and the row FFT: a row
    # tile depends on its place's arrivals themselves, so nothing inside the
    # measured window copies the dataset a second time.  One control-only task
    # per transfer (a forwarder, on the destination's own rank) is the sole
    # waiter on the rendezvous event and republishes the arrival on a
    # place-local event, so the rendezvous events -- homed on the rank that
    # created them -- carry places*waves*places registrations and as many
    # deliveries whatever the tile count, and the fan-out to the tile count's
    # worth of readers is rank-local.
    #
    # The last positional argument is the place count -- the number of
    # partitions the program owns its work and aggregates its exchange payload
    # in.  It is an argument and not the rank count, so the task and datablock
    # counts, and the order the partials combine in, are identical in every
    # geometry; the runtime maps the places onto whatever ranks exist through a
    # hint.  32 is one place per node at the largest geometry, which is where
    # the calibration is taken, and it is the same convention XSBench's `-p 32`
    # uses.
    expect: '4294967296.023928'
    expect_args: ['32', '6912', '32']
    args: ['32', '6912', '32']
    restructured_from: fft

  fibonacci:
    binary: fibonacci
    class: task
    provenance: 'Fibonacci recursion'
    marker: 'answer is\s*\d+'
    scalar_re: 'answer is\s*(\d+)'
    scalar_kind: int
    # Fork-join recursion with no data: the tree IS the decomposition, so the
    # only dials are the size and how deep the spawn scatters before subtrees
    # pin to the rank they landed on.  The hinted map is an ownership interval
    # over the leaf order -- a node of value v owns F(v+1) leaves and its
    # children split them exactly F(v)/F(v-1) -- so a rank's load differs from
    # an equal share by at most one straddling subtree and the static
    # imbalance is bounded by 1 + nodes*F(n-d+1)/F(n+1).  The map places EDTs
    # only; every DB stays hint-less (homed at its creator) because the ~2*2^d
    # crossing edges are 1e-4 of the spawns and a DB hint there is a wash under
    # WT and one message worse under the default WB x RETAIN.  At d=14 that is
    # 1.002/1.010/1.019/1.038 over 2/8/16/32 nodes, against 1.161 at d=11; 14
    # is on the app's measured plateau (9/11/14 within 3% at 4 and 8 nodes) and
    # is the shallowest depth under 1.05 at 32 nodes.  mainEdt refuses a depth
    # too shallow for the rank count rather than letting a rank idle.
    #
    # The base tier anti-scales while the hint layer scales, so the size
    # targets 60 s at one node, and both tiers run it: the hint
    # layer resolves to rank 0 at one place, so the two share an anchor and the
    # window belongs to the tier that has to survive the whole node sweep.
    # Memory: measured rungs only -- 23.0/35.7/84.0/103.0 GB at 37/38/39/40, so
    # 40 (~106 GB with the added paramv word) is the largest rung with measured
    # evidence under a 190 GB node.  41 and beyond are calibration pending;
    # there is no exponential law that fits the measured rungs, so do not
    # project one.
    # Every multinode base cell is expected to censor at the profile timeout --
    # report the base row as censored, do not draw a curve through it.
    expect: '102334155'
    expect_args: ['40', '14']
    args: ['40', '14']
    hinted: true    # kept: scatter-then-pin makes every scattered subtree wire-free; the base is censored at 2 and 8 ranks where hinted scales

