  RSBench_intel:
    binary: RSBench_intel
    # Master/Worker over a task-parallel map, the same central-producer
    # batch chain as XSBench_intel (nprocs is hardcoded to 1); the SPMD
    # member of the pair is the sharedDB sibling.
    class: mw
    provenance: 'RSBench multipole cross-section proxy (ANL)'
    # Both the marker and the voted scalar are the results banner's checksum
    # line, printed once from the timer EDT that hangs off the compute phase's
    # FINISH output event -- so a cell can only be graded complete after the
    # last lookup of the last batch has been reduced.  The old marker
    # ('Lookups:') matched the INPUT banner and the old scalar was the
    # init-phase pole checksum; both were emitted before any lookup ran.
    marker: 'RSBench lookup checksum:'
    scalar_re: 'RSBench lookup checksum:\s+(\d+)'
    scalar_kind: int
    # Dataset-integrity scalar, printed by the init join (initCollect) after
    # the n per-nuclide generator tasks have published their folds.  It is a
    # fold over the pole arrays only: a function of -s/-n, -p and numL, and of
    # nothing else -- not -w, not -l, not -b, not the node count, not the tier.
    extra_scalars:
      pole_cksum: 'RSBench pole checksum:\s+(\d+)'
    # Every lookup sums the four IEEE-754 bit patterns of its macro_xs vector
    # into a u64; the batch reducers add those with wraparound.  Integer
    # addition is associative and commutative and each lookup's own arithmetic
    # is a fixed-order loop inside one EDT, so the value is identical across
    # node counts, tiers, arms and runtime entries.  It depends on the dataset
    # knobs (-s/-n, -p, -w, numL, -d) AND on -l (how many results are summed);
    # it does NOT depend on -b.
    #
    # CROSS-TIER ORACLE.  This row and RSBench_intel_dist compile the SAME
    # generator (one shared header, one mixer, one set of stream ids, one draw
    # addressing, one count multinomial run once in a single pre-pass task in
    # both), and share the per-lookup seed and the bit-pattern fold.  So:
    #   * at equal -s/-n, -p, -w, -d and -l the two rows MUST print the
    #     identical 'RSBench lookup checksum:';
    #   * at equal -s/-n, -p (and numL) they MUST print the identical
    #     'RSBench pole checksum:'.
    # Neither equality involves -b (base), -r or -b (dist), the node count, the
    # tier or the runtime entry.  A disagreement is a defect in one of the two
    # programs, not a tolerance question.
    #
    # REPIN REQUIRED for both scalars.  The pin is only applied when
    # expect_args equals the cell's args (check.py:
    # `list(app.expect_args) == list(args)`), so `expect` MUST be taken from a
    # run at the calibrated campaign arguments -- the same -s/-l values that
    # end up in `args` below.  A value measured at any other size can never be
    # installed here.
    #
    # Separately, and NOT the pin source: `-s small -p 50 -w 10 -l 20 -b 4`
    # (G=5, about a second at one rank) is the cheap check of the mechanism --
    # run it at 1 node and at 2 nodes, confirm both checksums are identical
    # across node counts, and confirm the same two numbers come out of
    # RSBench_intel_dist at `-s small -p 50 -w 10 -l 20 -r 4 -b 2`.
    # Anchor at these arguments, one node of 108 workers, INV x WB: base 19.1
    # s / hinted 23.5 s, 5 GB resident; target 20 s (hinted kept, flat).
    expect: '10389491124515624329'
    expect_args: ['-s', 'large', '-l', '1250000', '-b', '6912']
    # Width is W = -b: within a batch the spawner creates -b independent
    # chains, each chain is strictly serial (rankLookup and macroxs each create
    # their successor and return), and batches never overlap because the
    # spawner is EDT_PROP_FINISH and the next rankCompute hangs off its output
    # event.  Spawn-and-join, so W = b exactly -- not 3b.
    #
    # The ceiling is nominal: nprocs is hardcoded to 1, so one worker's C loop
    # is the only producer and by Little's law the in-flight population is
    # throughput x chain latency (about 540 chains at the 1-node anchor, ~1/6
    # of a 3456-slot window).  Raising -b moves the ceiling, not the occupancy;
    # a genuine >=2x realized width for this class needs a restructured row's
    # parallel producers.
    #
    # -b is also the concurrent-reader fan-out knob (b x p(mat) x num_nucs per
    # nuclide block), which is what makes it the coherence exhibit's width.
    #
    # DISCLOSED (conformance adaptations, identical in base and hinted):
    #  * data generation is index-seeded (a pure function of (stream, index),
    #    splitmix64-style, no rand()/srand(), no shared RNG state) and is
    #    produced by the tasks that own the data: one nuclideGen per nuclide
    #    and one materialGen per material, joined by the init phase's FINISH
    #    scope.  The two count multinomials and the 12-entry num_nucs table
    #    stay in one pre-pass task -- a count bin depends on every draw, so it
    #    is not a function of the index that reads it -- as do the 3n+2m
    #    ocrDbCreate calls, which keeps the GUID arrays single-writer.
    #  * verification is a computed checksum on both the data set and the
    #    lookups; no recompute of the workload, no output file, no
    #    per-iteration stdout.
    #  * the reference workload is 10,000,000 lookups, which this port keeps as
    #    its own default.  Upstream also publishes a smaller size class
    #    (parameters.proposed: -s small -p 1000 -w 100 -l 100000).  -s small is
    #    REJECTED on the record: it drops the fuel material from 321 to 34
    #    nuclides and collapses the per-lookup fan-out (171 -> ~52 acquires)
    #    that is this row's exhibit.  So the window is reached on -l instead,
    #    with the size alternative named rather than assumed away.  -s/-p/-w
    #    stay at the benchmark's canonical defaults (H-M large, 1000 poles,
    #    100 windows; this port has no nprocs, so -p is the poles flag here --
    #    only sharedDB renamed it -a).  -s large IS the port's default -- named
    #    explicitly so the selection is self-documenting, unlike XSBench_intel
    #    whose default is small.
    #  * -n is validated loudly (exactly 68, or >= 355): the H-M tables name
    #    fixed nuclide IDs and are selected by count alone, so anything else
    #    indexes the per-nuclide arrays out of bounds.
    #
    # HINTED (hint arguments only, all under OCR_APP_OPTIMIZED_PLACEMENT):
    # chain pinning of the two spawned links of each lookup chain; home
    # spreading of the dataset by disjoint index bands (handles 0..9, nuclides
    # by a greedy balance over expected read rate, materials at 10+n+i); and
    # each generator task placed on the home of the blocks it fills.  Base
    # creates exactly the same objects and tasks with NULL_HINT.
    #
    # NOTE for whoever re-sizes: every previously recorded time for this row
    # (including the 20.4 s anchor in 22cef4c) came from report.py's silent
    # wall_s fallback, because the app's bare-printf results banner left the
    # [E2E] stamp mid-line and check.py's line-anchored regex never matched.
    # That is fixed in the app; the calibration has to be re-taken, not
    # rescaled.
    args: ['-s', 'large', '-l', '1250000', '-b', '6912']
    hinted: true    # kept: the chain-colocation map completes where the base is censored and is 5.5x faster at 4 ranks
    restructured_as: RSBench_intel_dist
    unordered_writes: 'per-rank batchReduce read-modify-writes one DBK_cksum unordered (main.c:833, :1099-1113)'

  RSBench_intel_dist:
    binary: RSBench_intel_dist
    # One producer chain per lookup partition instead of the single central
    # producer of RSBench_intel: -r partitions of the lookup range, each with
    # its own -b-wide FINISH batch, each pinned to place p % ranks.  The
    # per-lookup three-EDT chain and its 5+3*num_nucs CONST acquires are the
    # base row's, unchanged.  Data generation is NOT one of the differences --
    # both rows generate in parallel from the same shared generator behind the
    # same one-task count pre-pass; what differs is that here the generator
    # also creates and homes its blocks, so the dataset is sharded by producer
    # rather than homed by one creating task.
    class: spmd
    provenance: 'RSBench multipole cross-section proxy (ANL); partitioned-producer rewrite'
    # SAME INSTANCE as RSBench_intel: both programs include the same generator
    # header -- the same mixer, the same stream ids, the same RS_INDEX3(i,j,k)
    # draw addressing, the same count multinomial run once in one pre-pass
    # task -- and share the per-lookup seed and the bit-pattern fold.  So at
    # equal -s/-n/-p/-w/-d/-l the two rows print the SAME
    # 'RSBench lookup checksum:', and at equal -s/-n/-p the SAME
    # 'RSBench pole checksum:'.  That is what makes either row's pin checkable
    # against the other rather than only against itself.
    marker: 'RSBench lookup checksum:'
    scalar_re: 'RSBench lookup checksum:\s+(\d+)'
    scalar_kind: int
    extra_scalars:
      pole_cksum: 'RSBench pole checksum:\s+(\d+)'
    # Both scalars are integer sums with wraparound, so they are exact and
    # order-independent: the lookup checksum is a function of the dataset
    # (-s/-n, -p, -w, numL), of -d and of -l ONLY -- it does not move with -r,
    # -b, the node count, the arm or the runtime.  The pole checksum is a
    # function of -s/-n, -p and numL only.
    # Anchor at these arguments, one node of 108 workers, INV x WB: 113.5 s, 6
    # GB resident; target 120 s (restructured).
    expect: '17548061920822597654'
    expect_args: ['-s', 'large', '-l', '31104000', '-r', '3456', '-b', '8']
    # expect_args is list[str] in tools/artsrun/src/artsrun/model/catalog.py:
    # replace it with the pinning cell's exact args list.
    #
    # Width = -r * -b (a partition's chain is strictly serial, so each of its
    # -b live chains contributes at most one runnable EDT, and partitions never
    # wait for each other).  Sizing constraints, one per placeholder:
    #   3456 (-r): must divide 3456 = 108*32 evenly so every rank holds exactly
    #             3456/ranks partitions at 1/2/4/8/16/32 nodes (imbalance 1.0
    #             by construction); -r 3456 is the recommended value.
    #   8 (-b): >= 2 clears the >=2x width floor at -r 3456; larger -b also
    #             amortises the per-batch rankCompute+spawner pair, which costs
    #             2/-b EDTs per lookup (0.25 at -b 8).  -b 8 recommended, giving
    #             W = 27648 = 8.0x the widest geometry's worker total.
    #   82944000 (-l): the run-length axis, sized to the anchor window exactly as for
    #             the base row.  Nothing else scales with it.
    # Height knobs stay at the benchmark's published defaults (-s large,
    # -p 1000, -w 100, Doppler on, numL 4).
    #
    # DISCLOSED: as for RSBench_intel, the reference workload is 10,000,000
    # lookups and this row runs a fraction of it, sized to the anchor window;
    # the same index-seeded generation, checksum verification and no-output-file
    # adaptations apply, from the same shared header.
    args: ['-s', 'large', '-l', '31104000', '-r', '3456', '-b', '8']
    restructured_from: RSBench_intel
    unordered_writes: 'eight creator holds are wired RW without a release (main.c:151, :172-173, :261-266, :308-309, :726, :899, :1025, :1053)'

  RSBench_intel_sharedDB:
    binary: RSBench_intel_sharedDB
    class: spmd
    provenance: 'RSBench (ANL); shared-datablock form'
    marker: 'Simulation complete\.'
    # The scalar is now a computed digest of the lookup phase, not the -l echo
    # it used to be.  Every lane of every instance folds three u64 words, by
    # the program's own REDUCTION_U8_ADD trees -- first over an instance's `t`
    # lanes, then over the 32 instances -- so the printed value is a function
    # of every lookup the run performed: the exact count of poles evaluated,
    # the exact count that took the slow Abrarov branch, and a magnitude digest
    # of the cross sections themselves (each lane sums |macro_xs| over its own
    # lookups in its own order and quantizes the total to 20 mantissa bits, so
    # both folds are integer and the value does not depend on either tree's
    # shape, on the lane->rank map, on the node count or on the runtime).  The
    # printed line mixes the three and is masked to 53 bits.
    scalar_re: '(?m)^\s*(?:\[\d+\]\s*)?XS Checksum:\s*(?:\[\d+\]\s*)?([0-9]+)\s*$'
    scalar_kind: int
    # The comparator parses every scalar with float() and compares with
    # math.isclose, so a value above 2^53 could not be compared exactly.  The
    # program masks the digest to 53 bits for that reason; with the value
    # exactly representable, this tolerance asks for equality rather than the
    # default 1e-9 relative.
    tolerance: 1e-18
    # <repin>: both the scalar AND the generated dataset changed this cycle
    # (see the disclosures below), so no earlier value transfers.  Take it from
    # one 1-node run at the campaign args.  A cheap cross-check first, at a
    # small argument set that runs in seconds on one node:
    #     -s small -l 20000 -t 4 -p 2
    # every arm, every runtime and every node count must print the same
    # `XS Checksum:`; `Pole Evaluations:` and `Abrarov Evaluations:` must match
    # too, and `Slow Faddeeva:` must now read ~0.5% (the published design
    # target) rather than the meaningless value the old prefix-sum bug printed.
    # Anchor at these arguments, one node of 108 workers, INV x WB: 103.5 s, 6
    # GB resident; target 100 s (the base tier scales).
    expect: '7396750967536631'
    expect_args: ['-s', 'large', '-l', '2000000', '-t', '216', '-p', '32']
    # Strict sweep invariant: every logical count is node-invariant -- 32
    # instances, 216 chains each, 3000000 lookups per instance.  The
    # fork's block partition maps the 32 instances onto however many PDs the
    # run has.  The dataset is a pure function of (instance index, position in
    # the array), so the problem instance is identical at every node count and
    # in every run.
    #
    # DISCLOSED conformance adaptations (identical in base and hinted):
    #  - Data generation no longer uses the process-global rand()/srand().  It
    #    is a counter-based mixer keyed by (instance, stream, array position).
    #    The old code seeded srand(42) per instance and drew from one
    #    mutex-protected libc stream shared by every instance co-resident in a
    #    process, so the generated resonance data was neither reproducible nor
    #    the same at different node counts, and the draws serialised: a term
    #    proportional to instances-per-rank sat inside the measured window and
    #    shrank with the node count for reasons that had nothing to do with the
    #    decomposition.  Both defects are gone; the data itself is different
    #    from any previously recorded run, which is why every pin is <repin>.
    #  - The kernel's two counters were accumulated INSIDE the lookup loop
    #    (`*g += abrarov` per lookup, on a running total), making the reported
    #    numbers prefix sums rather than counts.  The accumulation is now once
    #    per task.  `Slow Faddeeva:` is a real percentage as a result.
    #  - channelSetupEdt read its rank block after releasing it; the two reads
    #    are now before the release.
    #  - Loud argument validation: every rejection names the option and the
    #    reason, an unrecognised option is echoed, and -n is now constrained to
    #    68 or >= 355 (the material tables are literals naming nuclide IDs
    #    below 68 resp. 355, and every per-nuclide array is sized by -n, so
    #    anything between them indexes outside the arrays), and -a >= -w (below
    #    that the per-window pole span floors to zero and the kernel evaluates
    #    no poles at all).
    #  - The pole and window arrays are sized from the realised per-nuclide
    #    counts instead of n_nuclides * avg.  The counts are drawn and then
    #    floored to at least one per nuclide, so their sum can exceed the
    #    requested average; at small -a/-w the old sizing wrote past the end of
    #    the datablock.
    #  - The height knob -l deviates DOWNWARD from the published default of
    #    10,000,000 (io.c's default, the usage text, and upstream's
    #    parameters.proposed nl_ss_large).  The reason is the cell budget: the
    #    published value projects past 600 s at the 1-node anchor against a
    #    900 s timeout.  The deviation is conservative -- a shorter run raises
    #    the fixed-overhead share, which works against a scaling claim, not for
    #    it.  Every other height/grain knob is at its published default
    #    (-s large, -a 1000, -w 100, Doppler ON, CHUNK_SIZE 1000,
    #    SCHEDULER_TYPE 1).
    #  - -p is the app's own SPMD REPLICATION knob, not a partition: each of
    #    the 32 instances runs the full -l against its own dataset.  Aggregate
    #    work is 32 x 3000000 lookups; it is not a 32-x-larger problem.
    #
    # This decomposition SCALES (3456 dependence-free equal-work lanes, one
    # terminal latch per instance), which is what the pair with the
    # Master/Worker sibling RSBench_intel is for.
    args: ['-s', 'large', '-l', '2000000', '-t', '216', '-p', '32']
    # The hint layer is one index substitution plus the per-lane DB hints the
    # program already computes and never applied.  Base places a lane by its
    # index WITHIN its instance over {t} slots, a map identical for every
    # instance: at 32 nodes the 108-over-32 remainder puts 128 lanes on 12
    # nodes and 96 on 20 (max/mean 1.185, an efficiency ceiling of 0.844
    # before any protocol effect), and because the map ignores the instance,
    # every node runs lanes of all 32 instances and caches all 32 datasets --
    # a node-count-INVARIANT ~854 MB read-only working set.  Hinted places a
    # lane by its index among ALL p*t lanes: balance is exactly 1.000 at 1, 2,
    # 4, 8, 16 and 32 ranks, a node's block is 32/N whole instances, and the
    # four mutable per-lane datablocks stop crossing the node boundary on
    # every release.  Register the tier only if the gate holds (see the
    # appdoc's Placement (hinted) section): hinted >= base at 16 AND 32 nodes
    # of one campaign -- 8 nodes cannot show it, the balance term there is only
    # 1.037.  Expect the hinted cells to be protocol-INDIFFERENT: the map is
    # what makes base's acquires remote, so a flat arm spread in the hinted row
    # is the map working, not evidence about the protocols.
    hinted: false   # tried, and no hinted map beats the base: the layer re-indexes lanes globally and homes each lane's blocks where the lane runs (the base homes them at the instance's node while the lane may run elsewhere), measured 9.99/5.01/2.90/1.80 base vs 9.99/5.17/2.78/1.89 hinted at 1/2/4/8 local ranks -- inside noise either way, no 16/32-node A/B exists -- so the base stands in for the tier; the layer stays in source
    extra_scalars:
      # Exact integer observables of the lookup phase over the WHOLE run,
      # summed over every lane of every instance by the same integer trees as
      # the digest.
      pole_evals: '(?m)^\s*(?:\[\d+\]\s*)?Pole Evaluations:\s*(?:\[\d+\]\s*)?([0-9]+)\s*$'
      abrarov_evals: '(?m)^\s*(?:\[\d+\]\s*)?Abrarov Evaluations:\s*(?:\[\d+\]\s*)?([0-9]+)\s*$'
      # The app's own init timer, printed once by instance 0 (its own
      # generation only -- generation is per instance and concurrent).  Worth recording
      # per cell: it is the part of the window that is data generation rather
      # than lookups, and the row's scaling claim should be readable against it
      # now that generation no longer serialises on a shared generator.
      init_s: 'Initialization Complete\. \(([0-9.]+) seconds\)'
    unordered_writes: 'launchReductionEdt hands DBK_rankDataH on in RW unreleased (main.c:856 vs :886), and the reduction library''s accumulator does the same (reduction.c:344, :454)'

  mapreduce_wordcount:
    binary: mapreduce_wordcount
    class: task
    kind: app
    provenance: 'canonical MapReduce word count (Dean & Ghemawat, OSDI 2004), native OCR implementation written for this repo'
    # Weak-scaling map+reduce: each map tile synthesizes its text from its
    # GLOBAL tile id (closed V-word vocabulary, Hadoop RandomTextWriter
    # style), so there is no ingest I/O at any node count and the corpus
    # for a given (nodes, seed) is identical across configurations.  A
    # K-ary spawner-built reduction tree keeps its lower levels node-local
    # (the map-side combiner); the verifier requires the total token count
    # EXACTLY and prints the histogram checksum the consensus votes on.
    # args: V WORDS TPN K ZIPF GRAIN ITER SEED
    marker: 'WORDCOUNT OK '
    scalar_re: 'CHECKSUM=([0-9]+)'
    scalar_kind: int
    extra_scalars:
      TOKENS: 'TOKENS=([0-9]+)'
    args: ['16384', '1000000', '128', '8', '100', '0', '4', '1']
    default_enabled: false
    timeout: 300
    multinode_timeout: 600
  # --- the adversarial suite ------------------------------------------------
  # One program per attack, under benchmarks/apps/attack/: each names its
  # target arm and owns a single designed workload, so a column of the
  # master table is a row here rather than a point buried in a sweep file.
  # Every program derives its population from the runtime's own rank count,
  # so `args` below is size and op count only -- no per-node ladder, and no
  # args_by_nodes.
  # The suite is ARTS-only by design: the experiment it serves compares the
  # plane's own coherence arms against each other, so every row here carries
  # arts_only -- the reference runtimes are not part of that comparison.
  own_reread_64k:
    binary: own_reread
    arts_only: true
    class: mw
    kind: attack
    provenance: 'attack matrix C1: private-lane re-read (release-axis spectrometer)'
    # Every chain re-reads the block it owns, homed one rank away: nothing is
    # shared, so the only cost left is what a protocol charges a holder for
    # touching its own data again.
    # TARGET: the two arms that cannot let a holder keep anything.
    # On one node of 108 workers the eight arms tie within 5% (18.9-19.5 s);
    # at eight ranks EXCL·PURGE opens to 271.1 s against 17.8 s on the rest.
    # Anchor at these arguments, one node of 108 workers: worst arm
    # EXCL·PURGE 19.5 s; 32-node projection ~350 s by the calibration rule on
    # the full-size local growth of the previous pass, whose 8-rank cells
    # this program reproduces.
    marker: 'OWN_REREAD OK '
    scalar_kind: bool
    extra_scalars: &chain_scalars
      RHO: 'RHO=([-0-9.]+)'
      ROPS: 'ROPS=([0-9]+)'
      WOPS: 'WOPS=([0-9]+)'
      RXPUT: 'RXPUT=([-0-9.]+)'
      WXPUT: 'WXPUT=([-0-9.]+)'
      RTOT_P50: 'RTOT_P50=([-0-9.]+)'
      RTOT_P90: 'RTOT_P90=([-0-9.]+)'
      RTOT_P99: 'RTOT_P99=([-0-9.]+)'
      WTOT_P50: 'WTOT_P50=([-0-9.]+)'
      WTOT_P90: 'WTOT_P90=([-0-9.]+)'
      WTOT_P99: 'WTOT_P99=([-0-9.]+)'
      RACQ_P99: 'RACQ_P99=([-0-9.]+)'
      RREL_P99: 'RREL_P99=([-0-9.]+)'
      WACQ_P99: 'WACQ_P99=([-0-9.]+)'
      WREL_P99: 'WREL_P99=([-0-9.]+)'
      RACQ_MEAN: 'RACQ_MEAN=([-0-9.]+)'
      RREL_MEAN: 'RREL_MEAN=([-0-9.]+)'
      RTOT_MEAN: 'RTOT_MEAN=([-0-9.]+)'
      WACQ_MEAN: 'WACQ_MEAN=([-0-9.]+)'
      WREL_MEAN: 'WREL_MEAN=([-0-9.]+)'
      WTOT_MEAN: 'WTOT_MEAN=([-0-9.]+)'
      RCV: 'RCV=([-0-9.]+)'
      WCV: 'WCV=([-0-9.]+)'
      RUSE: 'RUSE=([-0-9.]+)'
      FINAL: 'FINAL=([0-9]+)'
      ETHW: 'ETHW=([0-9]+)'
    args: ['65536', '740000']
    default_enabled: false
    timeout: 1800
    multinode_timeout: 1800
  own_reread_16m:
    binary: own_reread
    arts_only: true
    class: mw
    kind: attack
    provenance: 'attack matrix C1: private-lane re-read at size'
    # The same private re-read with the payload 256x larger, which converts a
    # protocol's per-turn byte traffic into the dominant term.
    # TARGET: purge-family arms, whose return-and-refetch now moves 16 MB.
    # On one node of 108 workers the eight arms tie within 5% (about 0.8 s);
    # at eight ranks EXCL·PURGE opens to 194.5 s against 0.7-0.9 s on the rest.
    # Anchor at these arguments, one node of 108 workers: worst arm VAL·WT
    # 0.8 s; 32-node projection ~347 s by the calibration rule on the
    # full-size local growth of the previous pass, whose 8-rank cells this
    # program reproduces.
    marker: 'OWN_REREAD OK '
    scalar_kind: bool
    extra_scalars: *chain_scalars
    args: ['16777216', '6400']
    default_enabled: false
    timeout: 1800
    multinode_timeout: 1800
  own_rewrite_64k:
    binary: own_rewrite
    arts_only: true
    class: mw
    kind: attack
    provenance: 'attack matrix C1: private-lane re-write (turn amortization)'
    # Every chain re-writes the block it owns, homed one rank away: consecutive
    # write turns by one holder, which a sticky grant should make free.
    # TARGET: every arm that re-arbitrates a write it already owns.
    # On one node of 108 workers the eight arms tie within 5% (12.8-13.1 s);
    # at eight ranks EXCL·PURGE 248.1 s and INV·WB 71.3 s against VAL·WB
    # 11.6 s and EXCL·RETAIN 11.7 s.
    # Anchor at these arguments, one node of 108 workers: worst arm INV·WB
    # 13.1 s; 32-node projection ~352 s by the calibration rule on the
    # full-size local growth of the previous pass, whose 8-rank cells this
    # program reproduces.
