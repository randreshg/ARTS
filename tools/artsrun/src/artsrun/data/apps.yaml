  graph500:
    binary: graph500
    class: task
    provenance: 'Graph500-shaped BFS: uniform-random (Erdos-Renyi) edge stream,
      64-bit vertices, one search from a fixed root -- not the specification
      Kronecker/RMAT generator and not its 64 searches'
    # The result is a digest of the finished BFS tree: the sum, over every
    # reached vertex, of a splitmix64 avalanche of (vertex, level, parent).
    # The fold is `+` over u64, so it is commutative and associative and the
    # value does not depend on the order the workers finish, on how the sum is
    # grouped, or on the node count.  It replaces the old `nodes` scalar, which
    # at an average degree of 32 is just 2^SCALE -- an echo of argv[1] that a
    # run reaching every vertex at the wrong level would still pass.
    marker: 'BFS_DIGEST \d+'
    scalar_re: 'BFS_DIGEST (\d+)'
    scalar_kind: int
    # The scalar comparator coerces both sides to double, and the default
    # integer tolerance is 1e-9 RELATIVE -- on a 64-bit digest that would
    # accept a value wrong in its low ~34 bits.  A digest is exact or it is
    # nothing, so demand equality of the doubles.
    tolerance: 1e-18
    # <repin>: the scalar changed.  Take the value from one 1-node run at the
    # campaign args.  Model-derived reference points, for a cross-check at
    # small arguments: `6 8 2 2` -> 17423262753130883682 (nodes 64, frontier
    # prints 0:1 1:8 2:51 3:4 4:0); `10 16 8 8` -> 903256210448785348
    # (nodes 1024); `12 16 16 16` -> 14849956761108488830 (nodes 4096).
    # The digest depends on all four arguments -- the parent term is a function
    # of the R x C decomposition -- so a re-pin is needed if the grid moves.
    expect: '9733102401291435748'
    expect_args: ['20', '16', '128', '128']
    # SCALE is the size knob and the only calibration handle.  EDGEFACTOR is
    # the density knob (EDGE_SIZE = 2^SCALE * EDGEFACTOR), not an iteration
    # count: 16 is the value the official benchmark fixes and the app's own
    # README names -- the shipped example argv (Makefile.tg:31) says 8.
    # R and C are the worker grid; W = R*C is the instantaneous width of every
    # bulk phase (spawn-and-join: W loads behind one latch, then per level W
    # distributes -> W searches -> W applies behind a per-level latch).  The
    # program requires R*C | 2^SCALE, so W is a power of two and an integer
    # multiple of a 3456-worker envelope is arithmetically impossible; 128x128
    # = 16384 is the power of two nearest above 4x it (4.74x), and the
    # quantisation costs one short wave (<= 28 of 108 threads idle in the last
    # of 4.74 waves).  Keep the grid square.
    args: ['20', '16', '128', '128']
    # Dropped (R3).  The layer exists in the source but cannot differ from the
    # shipped map here: base is w % P = col % P (P divides C, because R and C
    # must be powers of two), a partition by whole columns; the hinted
    # gridTiles needs pr | R and P/pr | C, and on a SQUARE grid pr=1 and pr=P
    # score identically, so the strict `>` keeps pr=1 -- the same whole-column
    # partition, regrouped.  Identical balance and identical per-axis local
    # partner counts at every rank count of the sweep.  This key alone keeps
    # the tier out of every roster; the build keeps HINTED_PLACEMENT so the
    # guarded arm stays compiled and checked.  See the appdoc.
    hinted: false   # hinted == base: on a square power-of-two grid the tiled map degenerates to the base's whole-column partition (the same assignment, algebraically), so the base stands in for the tier; the layer stays in source
    extra_scalars:
      # Both are printed in SECONDS (the program divides by 1e6); the old key
      # was named kernel2_ns.  Kernel 1 -- the per-worker replay of the whole
      # edge stream -- owns most of the measured window at this width, so the
      # construction/BFS split must be recorded in every cell.
      kernel1_s: '\[kernel1 time ([0-9.eE+-]+)\]'
      kernel2_s: '\[kernel2 time ([0-9.eE+-]+)\]'
      mteps: 'mean MTEPS ([0-9.eE+-]+)'
      visited_vertices: 'nodes (\d+)'
    restructured_as: graph500_dist

  graph500_dist:
    binary: graph500_dist
    class: task
    provenance: 'Graph500-shaped BFS (uniform-random edge stream, 64-bit
      vertices, one search from a fixed root); owner-computes distributed
      rewrite'
    marker: 'BFS_DIGEST \d+'
    scalar_re: 'BFS_DIGEST (\d+)'
    scalar_kind: int
    # A digest is exact or it is nothing: the comparator coerces to double and
    # the default integer tolerance would accept a value wrong in its low ~34
    # bits.
    tolerance: 1e-18
    # The base row's window is a redundancy, not a BFS: every one of the W
    # logical workers replays the whole edge stream twice to sift out its own
    # share, so construction is W-fold and it is construction that scales,
    # while the search itself anti-scales because a level exchanges W*(R+C)
    # datablock-carrying edges whatever the frontier holds.  This program
    # keeps the instance, the search, the printed lines and the digest, and
    # replaces all three terms: the stream is partitioned by jumping its
    # linear recurrence to a slice head (generation work becomes the stream,
    # not the stream times W), every edge is routed once to the owner of its
    # source so a level walks only the adjacency of what it just discovered,
    # and a level's exchange is one block per ordered node pair carrying the
    # frontier -- P^2 messages per level in place of W*(R+C).  Control is a
    # per-node persistent chain, so no thread ever pre-creates 32*W tasks and
    # a worker with nothing addressed to it is never issued.
    #
    # The answer is the base's, not a re-pinned one.  A vertex's level is its
    # distance from the root and no decomposition can change it; its recorded
    # parent is decided by a rule that reads only R (among the adjacent
    # frontier vertices, the smallest residue class modulo R wins and the
    # largest of those is taken), and that rule is a minimum under a total
    # order, so evaluating it once at the owner gives what a grid of searches
    # gives in stages.  R and C therefore stay real arguments here: R fixes
    # the parent rule and R*C is still the width of a level.
    #
    # Anchor at these arguments, one node of 108 workers, INV x WB: 45.7 s,
    # 143.8 GB resident; target 120 s (restructured).
    # Off the 0.8-1.2x band: memory-capped -- the resident set doubles per
    # SCALE step (SCALE 26 on a 64x64 worker grid 120.7 GB, SCALE 27 319 GB),
    # so the rung that would reach the target exceeds the per-node cap; the
    # 128x128 grid keeps the campaign's worker count.  The base row's
    # 20 16 128 128 is not this row's anchor: generation is 1024x cheaper here.
    args: ['26', '16', '128', '128']
    expect: '7429651756441100803'
    expect_args: ['26', '16', '128', '128']
    extra_scalars:
      # Both are printed in SECONDS.  The split is what this row exists to
      # move: construction should collapse and the search should become the
      # part that scales.
      kernel1_s: '\[kernel1 time ([0-9.eE+-]+)\]'
      kernel2_s: '\[kernel2 time ([0-9.eE+-]+)\]'
      mteps: 'mean MTEPS ([0-9.eE+-]+)'
      visited_vertices: 'nodes (\d+)'
    restructured_from: graph500
    unordered_writes: 'chanInitEdt registers buildHubEDT on the channels before releasing priv (graph500_dist.c:1287-1288 vs :1290)'

  highbw:
    binary: highbw
    class: mw
    provenance: 'OCR high-bandwidth example'
    kind: toy
    marker: 'HIGHBW_WORK_SUM'
    scalar_re: 'HIGHBW_WORK_SUM\s*=\s*(\d+)'
    scalar_kind: int
    expect: '2048'
    expect_args: []
    args: ['48', '8388608', '1000']
    default_enabled: false
    unordered_writes: 'the creating task hands the block on in RW without releasing it (highbw.c:86, :96)'

  hpcg_intel:
    binary: hpcg_intel
    hinted: false   # tried, and no hinted map beats the base: the only placement the program leaves to a hint is the halo blocks' home (tiles are the author's balanced bisection, EDTs are pinned to their tile, the reduction partials are not hintable from the app), and its one alternative -- the consumer's home -- runs 1.1-1.7x slower than the producer-home base at every multinode geometry, so the base's own map is the best hinted map and the base stands in for the tier
    class: spmd
    provenance: 'HPCG conjugate-gradient benchmark'
    marker: 'final deviation'
    scalar_re: 'final deviation:\s*([\-+0-9.eE]+)'
    tolerance: 0.0001
    # Anchor at these arguments, one node of 108 workers, INV x WB: 132.3 s,
    # 84 GB resident; target 100 s (the base tier scales).
    # Off the 0.8-1.2x band: at the width floor (24x12x12 = 3456 tiles) with
    # the published tile edge m = 32; no smaller lattice keeps the floor.
    expect: '14248044.343658'
    expect_args: ['24', '12', '12', '32', '50']
    # The first three arguments are the rank grid, the fourth the edge of the
    # cube each rank owns, the fifth the CG iteration cap.  The cap stays at
    # the README default 50, which is also the program's own HPCGMAXITER; T is
    # that default, not a timestep count.  Calibration is done with the edge.
    #
    # WIDTH.  One tile is one runnable EDT at a time -- the private block is
    # handed RW from stage to stage through fresh ONCE events -- so the
    # instantaneous width is exactly npx*npy*npz and the structure is
    # spawn-and-join (11 halo barriers and 3 reduction barriers per iteration).
    # It must therefore be an integer multiple of the widest geometry's 3456
    # workers.  The previous 16 16 16 = 4096 was 1.185x: the tile-per-worker
    # count is fractional at 4/8/16/32 nodes, and each barrier interval costs
    # ceil(t/w) rounds, a 1.055/1.055/1.266/1.688x quantisation tax that grows
    # exactly where the scaling claim is made.  The app's own rank->domain map
    # (a recursive bisection, getMyPDc) balances all three grids perfectly, so
    # the defect is worker quantisation, not placement.
    #
    # Two grids satisfy the rule; both were verified by enumerating getMyPDc at
    # 1/2/4/8/16/32 nodes (min tiles per domain == max at every one):
    #   24 12 12 = 3456 (1x)  -> 3456/1728/864/432/216/108 per node, and the
    #                            32-node box is 3x6x6, minimum surface for 108
    #   24 24 12 = 6912 (2x)  -> 6912/3456/1728/864/432/216, box 6x6x6
    #
    # EDGE.  Four multigrid levels halve the edge four times, so m is a multiple
    # of 16 (the program rounds up) and 16 is the floor; m is also the
    # granularity, since a tile computes m^3 and exchanges ~6m^2.  At the floor
    # the exchange is not covered and the row collapses at the first node
    # boundary (6.3 s at one node against 32.9 s at two); at m = 32 it scales
    # monotonically instead -- 524.7 / 288.6 / 188.4 / 130.7 s over 1-8 local
    # nodes, 4.02x.
    #
    # MEMORY at the 1-node cell is N * ~429*m^3 B of payload, times the recorded
    # 2.17 RSS factor: 3456 x m=32 -> ~105 GB (fits), 6912 x m=32 -> ~211 GB
    # (does not), 6912 x m=16 -> ~27 GB but at the granularity floor.  So the 2x
    # width is only reachable at the grain where this row stops scaling; 1x with
    # m = 32 is the point that satisfies width, memory and grain at once, and it
    # is the map experiments/profiles/dane.yaml prescribes for this app.  Work
    # is 0.844x of the 16 16 16 anchor (155.2 / 160.9 / 159.0 s across the three
    # families), so expect the new anchor in a ~131-140 s band -- a 3x6x6 box
    # carries ~3.7% more cross-node links per tile than 4x4x8.
    #
    # SCALAR.  final deviation is sum over all points of (1-x_i)^2, computed
    # from the solution vector and reduced by the app's own 10-ary tree, whose
    # shape depends on the participant index and N alone -- stable across node
    # counts, runtimes and coherence arms.  It is a convergence residual, not a
    # size-invariant checksum, so it moves with the grid: expect must be
    # REGENERATED whenever the arguments change, never edited.  expect_args is
    # kept identical to args so the pin rides the campaign cell itself.
    #
    # BASE ADAPTATIONS (disclosed).  bomb() exits instead of returning into the
    # arguments it just rejected; the T comment corrected; the linked reduction
    # library frees its per-call accumulator and releases the nrank==1 return
    # block before satisfying it; loud validation for a non-positive grid, edge,
    # iteration count or debug level (maxIter == 0 used to reach an
    # uninitialised pointer); a debug-print loop that reused the halo pack
    # loop's counter, wedging the exchange at debug >= 2, prints the current
    # direction instead; and the two per-iteration convergence lines print only
    # at debug > 0, so the measured window carries no per-iteration stdout.
    #
    # No hinted tier: the placement is the author's and unguarded (AFFINITY),
    # every rank is covered with imbalance 1.000 and compact 3-D boxes, and the
    # one candidate layer -- a consumer home for the per-exchange halo blocks --
    # measured 1.09-1.21x at m = 16 but neutral to three digits at m = 32, i.e.
    # it was mitigating the cost correct sizing removes.  A reduction tree
    # renumbered into domain order was also tried and lost (1.00 / 0.92 / 0.84x
    # at 2/4/8 nodes) -- a flat tree's internal nodes are its low indices, so
    # domain-major numbering alone piles them on one domain.
    #
    # RESTRUCTURED TIER (added after the placement verdict, which is what made
    # the diagnosis unavoidable).  The clause this row used to carry -- "the row
    # scales, and its init is already parallel" -- has one true half: the init
    # is parallel (matrixfill runs inside each tile's own initEdt).  The other
    # half does not survive its own numbers: 25 % of the achievable 15N/16 at 8
    # local nodes, a 4.03x core-second inflation over the 1-node cell, and a
    # cross-node BLOCK count per node that is flat in the node count while
    # compute per node falls as 1/N.  What sets that count is the exchange
    # itself -- 26 x 11 = 286 datablock creates and 286 destroys per tile per
    # iteration, 220 of them carrying 92 B -- which neither a home nor the grain
    # can touch (m = 32 is the last multiple of 16 inside the node memory
    # budget).  hpcg_intel_dist keeps the arithmetic, the tile grid and the
    # bisection and replaces the exchange's container; see its row.
    args: ['24', '12', '12', '32', '50']
    restructured_as: hpcg_intel_dist
    unordered_writes: 'myDataBlock is never released yet re-wired RW at every phase, including by its creator (hpcg.c:1535, :1594, :1650, :1703, :1753, :1809, :1872, :1880)'

  hpcg_intel_dist:
    binary: hpcg_intel_dist
    class: spmd
    provenance: 'HPCG conjugate-gradient benchmark; Intel OCR port, distributed exchange rewrite'
    marker: 'final deviation'
    scalar_re: 'final deviation:\s*([\-+0-9.eE]+)'
    tolerance: 0.0001
    # WHAT IT BREAKS.  The base row's wall is the exchange's container, not its
    # bytes: one fresh datablock per DIRECTION per exchange, so a tile pays 286
    # creates and 286 destroys per iteration and the cross-node message count
    # follows the tile adjacency, which does not shrink when the node count
    # grows.  This program keeps ONE persistent block per (tile, destination
    # policy domain) per multigrid level, in two copies alternated by round.
    # Each outgoing direction packs its own slice of the block belonging to its
    # neighbour's domain; every neighbour tile on that domain reads its own
    # slice out of that one block.  The 26-way join is untouched (a consumer's
    # 26 slots are still fed by 26 distinct source tiles), so the sharing is
    # across CONSUMERS -- which is exactly what makes a payload cross the fabric
    # once per reading domain instead of once per reading tile.
    #
    # COUNTS.  Cross-node halo messages per node per iteration at the campaign
    # grid: 15,521 / 10,576 / 8,104 at 8/16/32 nodes become 2,178 / 1,666 /
    # 1,372 -- 5.9x at 32 nodes for identical bytes; and 11 x 77,464 x 50 =
    # 42.6 M creates and as many destroys leave the run cluster-wide.  The
    # required per-send budget at 32 nodes moves from 5.4 us to 21.2 us, inside
    # the 26.0 us measured remote read-acquire round trip rather than 5x beyond
    # it.  Two copies are necessary and sufficient: a tile's pack in round e+1
    # is ordered after its neighbour's PACK in round e but not after that
    # neighbour's UNPACK, and the first write that could reach an unread
    # generation is in round e+2, which the private block's own chain already
    # orders after the read.
    #
    # REDUCTION.  The base builds its 10-ary tree on the tile id, unrelated to
    # where a tile runs, so (N-1)/N of its blocks cross a domain boundary -- 941
    # per node per iteration at 32 nodes, ~90 % of what is left after the
    # exchange change.  This row links reductionTwoLevel and numbers the
    # participants domain-major, the same substitution nekbone_dist makes;
    # renumbering alone was tried on the base and lost, which is why the
    # two-level construction is the point.  HPCG_NO_TWO_LEVEL_REDUCTION compiles
    # the piece out for attribution.
    #
    # SCALAR.  The exchange change moves the same values through a different
    # container in the same order, so it is exact.  The reduction change
    # reassociates the sum above one domain, so at more than one node the
    # residual agrees to the tolerance above rather than bit for bit -- the same
    # disclosure nekbone_dist carries.  At ONE domain the two-level tree IS the
    # flat tree over the identity numbering, so the pin below is the base row's
    # own value at the base row's arguments, bit for bit; that is what makes it
    # the cross-tier identity check.  An uneven bisection also falls back to the
    # flat tree over tile ids, and the fallback is derived identically on every
    # rank from the grid alone.
    #
    # No hinted tier: placement is part of the design (a persistent block stays
    # with its last writer, which is its only writer), and the base row's
    # consumer-home experiment is the measurement that settles it.
    # Anchor at these arguments, one node of 108 workers, INV x WB: 131.7 s,
    # 92.9 GB resident; target 120 s (restructured) -- inside the band.  The
    # one-node time equals the base's (132.3 s) by construction: the rewrite
    # changes only what crosses a node boundary, and at one node nothing does.
    # The tile grid is the width floor and m = 32 the last grain that fits
    # memory (see the base row), so the size cannot move either way.
    args: ['24', '12', '12', '32', '50']
    expect: '14248044.343658'
    expect_args: ['24', '12', '12', '32', '50']
    restructured_from: hpcg_intel
    unordered_writes: 'rpDBK and myDataDBK are handed RW to the clone unreleased across five phases (hpcg.c:1650, :1660), and the creator''s dataBlock the same way (hpcg.c:2001; reductionTwoLevel.c:497)'
  hpgmg:
    binary: hpgmg
    class: task
    provenance: 'HPGMG geometric-multigrid benchmark; OCR port by SDSC'
    marker: '\|\|error\|\|'
    scalar_re: '\|\|error\|\|\s*=\s*([\-+0-9.eE]+)'
    tolerance: 0.001
    # The pins are KEPT: this change moved initialization and verification into
    # per-box tasks but altered no arithmetic, so the old value at the old
    # arguments is the one mechanical check that it is answer-neutral (a pin is
    # consulted only when the cell's args equal expect_args, so it costs
    # nothing at the campaign width).  A second pin at the campaign width is
    # ADDED once one cell has been run and its ||error|| checked against the
    # O(h^2) ladder - it does not replace this one.
    # Anchor at these arguments, one node of 108 workers, INV x WB: base 10.3
    # s / hinted 12.6 s, 30 GB resident; target 20 s (hinted kept, flat).
    # Off the 0.8-1.2x band: the published grain (log2 box dim 4) at a 4x
    # width multiple; the next grain multiplies the work by 8 and is a
    # separate decision.
    expect: '0.000000006555138'   # the ||error|| at the campaign arguments; 5 512 must still reprint 0.000000014674034
    expect_args: ['4', '13824']
    extra_scalars:
      # The reliable twin of the port's own 'f-cycle,    norm=' line, which is
      # written by a fan-out into one shared datablock and is not an oracle at
      # >= 2 ranks.  This one is a single-task max over every fine box.
      residual: 'final residual norm =\s*([0-9.eE+-]+)'
      # The F-cycle's own timer, so the figure can separate the solve from the
      # hierarchy layout that precedes it.
      solve_s: 'Total Time =\s*([0-9.eE+-]+)'
    # Anti-scaler: the worst cells are the LARGE geometries.  Width is the
    # binding constraint (the frontier of a phase is exactly that level's box
    # count, and phases never overlap), and only a box grid whose edge is a
    # multiple of 24 reaches an integer multiple of 3456.  The program refuses
    # a box grid that cannot bottom out on one box, that would agglomerate more
    # than 125 fine boxes into one, whose level or box datablock size is not
    # representable, or whose per-rank footprint exceeds the budget; it prints
    # the footprint either way.  Disclosed: the operator build's dot(alpha,alpha)
    # has no reader under the compiled Dirichlet boundary (its only consumer was
    # the periodic mean shift) and is kept because it is the published program's
    # own work - both rows pay it identically.
    args: ['4', '13824']
    hinted: true    # kept: one near-cubic partition for every level keeps inter-level transfers rank-local, 2.4-3.7x faster than the base at 2-8 ranks
    restructured_as: hpgmg_dist
    unordered_writes: 'norm_level_edt holds the level block RW while N_l norm_edt children take it RW (mg.c:340, mg_edt.c:245)'

  hpgmg_dist:
    binary: hpgmg_dist
    class: task
    provenance: 'HPGMG; rank-persistent rewrite (distributed solve plane, face-slab exchange)'
    marker: '\|\|error\|\|'
    scalar_re: '\|\|error\|\|\s*=\s*([\-+0-9.eE]+)'
    tolerance: 0.001
    # Kept for the same reason as the base row's pin (see above); at ['5','512']
    # this row must now print the base row's value, since both compute the same
    # instance with the same initialization and verification bodies.
    # Anchor at these arguments, one node of 108 workers, INV x WB: 9.6 s, 30
    # GB resident; target 120 s (restructured).
    # Off the 0.8-1.2x band: same instance as the base row by design (the
    # same-instance answer comparison); the grain decision is the base row's.
    expect: '0.000000006555138'   # the ||error|| at the campaign arguments; 5 512 must still reprint 0.000000014674034
    expect_args: ['4', '13824']
    extra_scalars:
      residual: 'final residual norm =\s*([0-9.eE+-]+)'
      solve_s: 'Total Time =\s*([0-9.eE+-]+)'
    # Scaling row: the 1-node anchor IS the worst cell.  Same dials and the
    # same initialization, verification and per-operator bookkeeping as the
    # base row, so at identical arguments the two rows must print an identical
    # ||error||: 'hpgmg_dist <base args>' on one node is the same-instance
    # equality check, and it costs seconds.  Disclosed with the base row: the
    # unread dot(alpha,alpha), and the per-operator timing lines, whose interval
    # is attributed to a different level here than in the base spine (only the
    # whole-run 'Total Time' is comparable row-to-row).
    args: ['4', '13824']
    restructured_from: hpgmg

  LCS_all_db_distributed:
    binary: LCS_all_db_distributed
    class: task
    provenance: 'Longest common subsequence; fully distributed datablocks'
    marker: 'LCS checksum:'
    scalar_re: 'LCS checksum:\s*(\d+)'
    scalar_kind: int
    # Anchor at these arguments, one node of 108 workers, INV x WB: 17.5 s
    # base / 28.5 s hinted, 116 GB resident; target 20 s.  The hinted tier
    # scales, inside the span cap the quadrant recursion sets ((4/3)^d = 7.5
    # at L = 128), so its rule would ask for the 60 s window; that window
    # needs twice this N and four times this table, past the node's memory,
    # so the size stays where the memory bound puts it.
    # The anchor is only meaningful when the kernel backs the table with huge
    # pages: the creation phase materializes ~70 GB before the first leaf, and
    # a run that gets 4 KiB pages instead (a fragmented host; the minor-fault
    # count is the witness, ~1M against ~17M here) takes 45-55 s at the same
    # arguments.  Between 640 and 1024 the tile edge moves the huge-page
    # anchor only from ~8 to ~18 s, so the size is set by the memory bound and
    # the target, not by the tile.
    expect: '928649940'
    expect_args: ['131072', '1024']   # MUST equal args, or check.py never pins
    args: ['131072', '1024']               # memory-bound, see below
    # Arguments are now validated: exactly two, and N/base a positive power
    # of two (the leaf addresses its tile as (xi-1)/base while the recursion
    # halves n).  The old third element of expect_args is now a hard failure,
    # not a silently ignored argument.
    #
    # Size is set by memory, not by width: the creation phase materializes
    # the whole (N+1)^2-cell table before the first leaf runs, 4*(N+1)^2 =
    # 68.7 GB at 131072 1024, on ONE node (labeled homes split it 1/nranks
    # multinode, so the 1-node cell binds).
    #
    # WIDTH EXEMPTION (R6).  The recursion's FINISH gating is the only
    # ordering (leaf DB dependences are pre-created and satisfy on arrival),
    # so work/span gives a time-average frontier of (4/3)^d = 7.5 and a peak
    # of 2^d = 128 at d = 7 -- 0.0022x / 0.037x of 3456.  No argument closes
    # it ((4/3)^d >= 3456 needs d >= 29).  This row is the wiring-capped
    # anti-scaling exhibit; every scaling claim for this application comes
    # from LCS_wavefront.
    #
    # The hint layer bands the block rows across the ranks -- band(row) =
    # (row * nranks) / L, a balanced contiguous partition of the L rows in
    # play -- and re-encodes the labeled index as band + nranks*t so a
    # block's home lands on its band's rank, steering the S tiles and the
    # recursion spine the same way.  (Before 2026-09-03 the height was
    # ceil((L+1)/nranks), which stranded 1 of 16 and 6 of 32 ranks with no
    # leaves and no tile homes at L = 128.  The WHOLE measured table below
    # predates the fix: at 16/32 ranks the old map left ranks idle, and at
    # 2/4/8 both maps cover every rank but assign different rows to them, so
    # those cells are indicative of shape only -- not a like-for-like
    # locality reference for the new map; the node-count trend is what a fresh
    # campaign sweep re-measures.)  Both tiers create the
    # same EDT/DB/event counts; only where they run differs, and at one node
    # the layer is the exact identity.
    #
    #   nodes   1      2      4      8      (pre-fix, 15w+1p, 131072 1024)
    #   base    41.6   57.6   52.7   40.7   anti: never beats its own 1 node
    #   hinted  41.7   45.2   31.4   19.0   2.2x at 8n against a 7.5x span bound
    #
    # Base-tier disclosures (both unconditional, i.e. in BOTH binaries, so
    # neither contributes to the hinted-vs-base delta): every creation-phase
    # block is created DB_PROP_NO_ACQUIRE (so a block whose home is remote is
    # born there; the three pointer arrays consequently hold NULLs and are
    # read by nothing), and each leaf destroys its diagonal tile (trims the
    # tail, never the peak).  Shutdown was split (wrapup prints, a separate
    # gated EDT calls ocrShutdown) so this row and its restructured sibling
    # share one [E2E] convention.
    #
    # CROSS-TIER ORACLE: this row and LCS_wavefront print the same LCS length
    # and the same digest, but only at a shared argument pair that satisfies
    # THIS row's power-of-two N/base constraint -- which the wavefront's own
    # campaign point does not.  It is a one-off validation run at 1024 256,
    # not a campaign cell (see LCS_wavefront).
    hinted: true    # kept: contiguous row bands, 2.4-5.2x faster than the base at 2-8 ranks (scales within the (4/3)^d span cap)
    restructured_as: LCS_wavefront

  LCS_wavefront:
    binary: LCS_wavefront
    class: task
    provenance: 'LCS; wavefront rewrite (boundary strips on counted events)'
    marker: 'LCS checksum:'
    scalar_re: 'LCS checksum:\s*(\d+)'
    scalar_kind: int
    expect: '1860356362'
    expect_args: ['1769472', '256']   # digest is what the driver now reads
    # L = N/base = 6912: the average anti-diagonal width (L/2 = 3456) matches
    # the largest campaign geometry's total worker count.  The 141.0 s
    # one-node anchor predates the 2026-09-03 creation-plane rewrite (the
    # serial row-spawner chain of L^2 = 47.8M creates became
    # leaf-creates-south-neighbour: O(1) creates per leaf, L-wide, and the
    # parked-leaf pool bounded at one row instead of L^2), so the point must
    # be re-measured before it is quoted and 16n/32n re-run.
    args: ['1769472', '256']    # recommended 1769472 256, pending that re-anchor
    # CROSS-TIER ORACLE (a validation step, not a campaign cell).  This row
    # prints the same LCS length and the same digest as
    # LCS_all_db_distributed, but only when both binaries are given the SAME
    # arguments AND those arguments satisfy the tiled row's constraint that
    # N/base be a power of two.  This row only requires N % base == 0, and its
    # campaign point 1769472 256 (L = 6912) is one LCS_all_db_distributed
    # rejects, so the two rows never compute the same instance during a
    # campaign.  ORCHESTRATOR ACTION: run both binaries once at 1024 256
    # (expect length 526, checksum 185149728) and compare.
    restructured_from: LCS_all_db_distributed

  LCS_distributed_ST:
    binary: LCS_distributed_ST
    hinted: true    # kept: subtree colocation removes the score block's migration tax -- 3.4x at 2 ranks, 8.1x at 8
    class: task
    provenance: 'Longest common subsequence; labeled-GUID string storage'
    marker: 'LCS checksum:'
    scalar_re: 'LCS checksum:\s*(\d+)'
    scalar_kind: int
    expect: '1663678361'
    expect_args: ['409600', '1600']
    args: ['409600', '1600']
    # Anchor at these arguments, one node of 108 workers, INV x WB: base
    # 19.7 s / hinted 19.2 s, 4.2 GB resident; target 20 s (hinted kept,
    # flat).  Derived with LCS_shared (same value for both rows): at a
    # fixed tree depth (N/base = 256) the time is quadratic in N, so 8.2 s
    # at 262144 puts 20 s at 409600; base widens to 1600 to keep the depth.
    # The three tiled LCS rows share an argument surface, a DAG shape and --
    # since 2026-09-03 -- the same generated instance (one index-seeded
    # generator, identical tile seeds in all four programs).  They do NOT
    # share a computed quantity: this row and LCS_shared collapse to a MAX
    # recurrence whose answer is analytically N, while
    # LCS_all_db_distributed / LCS_wavefront compute a MIN (edit-distance)
    # table with an answer near 0.5N.  Their digests therefore differ by
    # design; within each pair they agree exactly.
    #
    # SCALAR STRENGTH.  The digest covers the 2N+1 written cells, so a leaf that
    # never ran, ran twice or wrote the wrong index range moves it -- but the
    # collapsed recurrence saturates to a value that depends only on N, not
    # on the characters, so it is not a content oracle.  Do not cite this
    # row's consensus as evidence of DP arithmetic.
    #
    # WIDTH EXEMPTION (R6): peak frontier 2^d = 256, time-average (4/3)^d =
    # 10.0 at d = 8, against 3456; unreachable at any feasible argument
    # (d >= 12 means 16.8M leaf turns).  Decomposition-ladder exhibit.
    # N/base must be a power of two (now enforced by the program).
    # Anti-scaling mechanism: one shared RW score block whose grant migrates
    # on most of the 4^d leaf turns; RW is exclusive between nodes and shared
    # within one, so what nodes cost is migration, not concurrency.
    #
    # HINTED TIER (measured 2026-09-08): the same subtree-colocation map as
    # LCS_shared (see below), plus each fill task placed on its own tile's
    # labeled home.  The labeled tiles themselves cannot move -- a range fixes
    # each index's home at range-creation time -- and with a two-dimensional
    # quadrant map no tile has a single consumer rank anyway.  Measured
    # 8.38/8.32, 28.87/8.62, 48.87/11.74, 97.62/12.01 s (base/hinted,
    # INV x WB, 15w+1p x 1/2/4/8, '262144 1024').
    unordered_writes: 'every leaf of the concurrent x12/x21 subtrees RW-acquires the one score block (lcs_ST_distributed.c:301)'

  LCS_shared:
    binary: LCS_shared
    hinted: true    # kept: subtree colocation removes the score block's migration tax -- 3.4x at 2 ranks, 8.2x at 8
    class: task
    provenance: 'Longest common subsequence; shared datablocks'
    marker: 'LCS checksum:'
    scalar_re: 'LCS checksum:\s*(\d+)'
    scalar_kind: int
    expect: '1663678361'
    expect_args: ['409600', '1600']
    args: ['409600', '1600']
    # Anchor at these arguments, one node of 108 workers, INV x WB: base
    # 19.6 s / hinted 20.0 s, 4.2 GB resident; target 20 s (hinted kept,
    # flat).  Derived, not searched: at a fixed tree depth (N/base = 256,
    # the trend roster's) the time is quadratic in N, so 8.2 s at 262144
    # puts 20 s at 409600, and base widens to 1600 to keep the depth.
    # Same arguments as LCS_distributed_ST by construction (the ladder's
    # cell-by-cell check).
    # Bottom rung of the ladder: S, T and the score array are one DB each.
    # Same instance, same recurrence and therefore the same digest as
    # LCS_distributed_ST at the same arguments -- which is the ladder's
    # cell-by-cell check.  Same width exemption and the same content-blind
    # digest caveat as that row (see above).
    #
    # HINTED TIER (measured 2026-09-08).  The one placement-sensitive object
    # is the single mutable block every leaf writes, so the map is subtree
    # colocation: a G x G grid of equal quadrant subtrees (G the smallest
    # power of two with G^2 >= nranks), each rank a contiguous band of it,
    # every recursion and base-case EDT hinted onto the band of its own
    # region's corner.  Aggregate balance 1.000 at 1/2/4/8/16/32.  It cannot
    # turn the curve upward -- one RW block admits one node at a time whatever
    # the placement -- but it removes almost all of the migration cost:
    # 8.29/8.25, 28.62/8.52, 49.43/11.68, 98.90/12.09 s (base/hinted, INV x WB,
    # 15w+1p x 1/2/4/8, '262144 1024').  The base tier, which is what the row
    # exhibits, is unchanged.
    unordered_writes: 'every leaf of the concurrent x12/x21 subtrees RW-acquires the one score block (lcs.c:287, x12Edt :347, x21Edt :365 unordered)'

  # Reclassified 2026-08-23: its EDT set is a strict subset of
  # miniAMR_intel_bryan's (same block-per-EDT chain with halo send/recv,
  # minus the checksum, reduction and wrapup path), so it computes no
  # result at all -- what it exercises is the refinement spawn storm.
  miniAMR_forkbomb:
    binary: miniAMR_forkbomb
    kind: toy
    class: task
    provenance: 'miniAMR (Mantevo); spawn-storm variant'
    marker: 'BLOCK 0 finished'
    scalar_kind: bool
    args: ['--nx', '1', '--ny', '1', '--nz', '1', '--num_tsteps', '1200000', '--num_refine', '2']
    default_enabled: false

  miniAMR_intel:
    binary: miniAMR_intel
    class: task
    provenance: 'miniAMR adaptive-mesh proxy (Mantevo); Intel OCR port'
    marker: 'Weighted Mesh Checksum'
    scalar_re: 'Weighted Mesh Checksum\s*==\s*([\-+0-9.eE]+)'
    tolerance: 1e-08
    # THREE stdout scalars, all printed once, all from the shutdown path or the
    # pre-loop round -- nothing per round on the root's critical path:
    #   Golden Checksum == <v> (weighted <w>)   the pre-loop reference round
    #   Grand Total Checksum == <v> at timestep <t>
    #   Weighted Mesh Checksum == <v> at timestep <t>
    # The plain sum is CONSERVED by construction: refine writes a parent cell as
    # v*0.125 into eight children and coarsen sums the eight back (both exact in
    # binary FP), and the program aborts in-run if any round differs from the
    # golden by more than 10^-error_tol -- the same 1e-8 this row votes with.  So
    # `Grand Total Checksum` is numerically the initialization checksum: it is a
    # completion marker, not an oracle that sees the workload's output, and it is
    # NOT what the regex reads.
    # `Weighted Mesh Checksum` is the reduction that does see it: the same
    # O(cells) sweep also accumulates each value times its linear index within
    # its own block, which is NOT conserved when a block is split eight ways or
    # joined, so the value is a function of the mesh state the run actually
    # reached.  It is never compared against the golden.  Reduction order is the
    # block tree (block loop order, parent slot order, root dependence order),
    # which is identical at every node count and every runtime, so the value is
    # bitwise reproducible across the twelve entries.
    # The run-sensitive oracles on this row are therefore: this scalar, the
    # program's own per-round divergence abort, and the completion marker.
    #
    # REFINEMENT IS LIVE -- AND UNVALIDATED.  The program supplies the published
    # one-object specification when the argument vector names none, so the object
    # sweeps the mesh, blocks refine 8-way and coarsen back, and the
    # parent/consensus machinery this proxy exists to exercise actually runs.
    # That code path has never been exercised by a recorded campaign (the old
    # arguments made it unreachable).  A single-node smoke at the small-argument
    # set below MUST pass before this row is committed.  If it aborts in
    # chksum.c (the multi-level halo exchange not conservative to 10^-8), the
    # fallback is `--num_objects 0` -- a static mesh with closed-form counts --
    # and the finding reopens.  NEVER raise `--error_tol` to make it pass.
    #
    # WIDTH is the block grid.  Each block is a single continuation chain -- one
    # runnable EDT at a time -- so the instantaneous frontier is the live block
    # count: npx*npy*npz at level 0, plus 7 per block that refines, and 1 at
    # every checksum round, which is an all-blocks barrier through one EDT.
    # 24*12*12 = 3456 divides exactly by every policy-domain grid the hinted
    # map produces over 1..32 ranks (32 -> 4x4x2 -> a 6x3x6 box, 108 blocks a
    # rank), so load imbalance is 1.00 at every geometry in the sweep.
    # It needs MAX_NUM_UNREFINED_BLOCKS raised on the target (see cmake snippet).
    #
    # DEPTH: 1 <= 1 <= 4 at npx*npy*npz = 3456.  Lower bound because 1 = 0
    # makes refinement inert again -- a REFINE decision is downgraded to
    # LEAVE_BLK_AT_LVL once a block is at num_refine, so R=0 is a static mesh and
    # silently undoes the default object.  Upper bound from the halo GUID range,
    # which the program now checks and refuses loudly:
    # npx*npy*npz * 36 * (8^(num_refine+1)-1)/7 <= 2^32-1.  At 3456 blocks that
    # permits 4; the published default 5 needs 4.7e9 slots and used to truncate
    # silently into a range too small for the indices the mesh computes.
    #
    # CELLS PER BLOCK are grain, not width: halo goes as the block face and
    # compute as its volume, so shrinking the block raises the communication
    # share -- the direction that flatters a coherence measurement.  EDT
    # creations are identical at 16 and at 6 cells a block.
    #
    # Timestep and stage counts stay at the program's own defaults (20 and 20);
    # the anchor window is reached with the size knobs.
    #
    # No restructured version yet, and the decision is open rather than settled:
    # the hinted tier dissolved the base tier's anti-scaling at 512 blocks over
    # at most 8 nodes, but the root's flat B-way checksum rendezvous grows with
    # the block grid and has not been measured at 3456 blocks or past 8 nodes.
    # The SPMD re-decomposition of the same physics exists as its own row
    # (miniAMR_intel_chandra, a rank grid rather than a dataflow DAG).
    # Anchor at these arguments, one node of 108 workers, INV x WB: the 1x
    # lattice (24x12x12 = 3456 blocks) gives base 24.0 s / hinted 21.8 s,
    # 12.7 GB resident, both tiers on the same checksum; the 32-node
    # projection (~588 s) clears the cell budget where the 2x lattice
    # (24x24x12 = 6912 blocks, ~997 s projected) does not.
    expect: '8414305604769322'
    expect_args: ['--nx', '10', '--ny', '10', '--nz', '10', '--npx', '24', '--npy', '12', '--npz', '12', '--num_refine', '1', '--num_tsteps', '20']
    args: ['--nx', '10', '--ny', '10', '--nz', '10', '--npx', '24', '--npy', '12', '--npz', '12', '--num_refine', '1', '--num_tsteps', '20']
    hinted: true    # kept: the level-consistent spatial map keeps a block's chain and family on one rank, 27-46x faster than the base at 2-8 ranks
    restructured_as: miniAMR_intel_dist

  miniAMR_intel_dist:
    binary: miniAMR_intel_dist
    class: task
    provenance: 'miniAMR adaptive-mesh proxy (Mantevo); Intel OCR port, distributed rewrite'
    marker: 'Weighted Mesh Checksum'
    scalar_re: 'Weighted Mesh Checksum\s*==\s*([\-+0-9.eE]+)'
    tolerance: 1e-08
    # The base row's wall is its control plane, not its physics: every wait is a
    # new EDT plus a copy of its dependence vector, the three halo axes are
    # serialised because each is a suspension, every face rendezvouses through a
    # labeled sticky event homed at `index % nranks`, and every checksum round is
    # a B-way join walked on one root EDT.  Measured on the trend instance that
    # is ~7 EDTs and ~13 datablocks per block per stage, and a per-block latency
    # chain whose length does not fall with the node count.
    #
    # This program keeps the stencil, the refinement and coarsening rules, the
    # object sweep, the checksum sweeps and the command line, and replaces all of
    # that: ONE task per block per stage over strips its neighbours wrote,
    # phases emitted and collected by spawn trees indexed by rank, and the
    # checksum reduced over the block forest so no task holds a dependence per
    # block.  The mesh itself is a directory one task derives from the object
    # trajectory — the published refinement decision reads only a block's level
    # and centre, never a cell — so the distributed intent/consensus protocol is
    # gone and the mesh it produces is the base row's, block for block.
    #
    # SCALAR IDENTITY is the gate and it is exact, not to tolerance: the weighted
    # reduction adds base blocks in mesh order and each base block's subtree in
    # prong order, which is the base row's own grouping, so the two rows print
    # the same digits at shared arguments.  Verified at the trend instance, at
    # `--num_refine 0`, at half the grid, at `--checksum_freq 1`, and at the 1x
    # lattice below.
    #
    # SIZE: the 6x lattice `48x24x18` (20,736 = 6 x 3456 blocks, an integer
    # multiple of the width floor that splits exactly over the rank grid at
    # 1..32 nodes), the published heights (`--num_refine 1 --num_tsteps 20`).
    # The cross-tier identity is pinned at the base row's 1x lattice
    # (24x12x12: this row 17.1 s / 18.4 GB, the base 21.7 s), where both rows
    # print 8414305604769322; the block grid alone then sets this row's window:
    # 4x `48x24x12` 88.8 s / 50.8 GB, 6x 134.6 s / 68.3 GB, 8x `48x24x24`
    # 184.8 s / 96.4 GB on one node of 108 workers, INV x WB.  There is no
    # MAX_NUM_UNREFINED_BLOCKS on this target: no task holds a dependence per
    # block and no labeled range is reserved, so the grid is bounded by memory
    # alone.
    # Anchor at these arguments, one node of 108 workers, INV x WB: 134.6 s,
    # 68 GB resident; target 120 s (restructured).
    args: ['--nx', '10', '--ny', '10', '--nz', '10', '--npx', '48', '--npy', '24', '--npz', '18', '--num_refine', '1', '--num_tsteps', '20']
    expect: '92490067348329968'
    expect_args: ['--nx', '10', '--ny', '10', '--nz', '10', '--npx', '48', '--npy', '24', '--npz', '18', '--num_refine', '1', '--num_tsteps', '20']
    restructured_from: miniAMR_intel
    unordered_writes: 'no ocrDbRelease anywhere: build_edt publishes with every creator hold open (amr_dist.c:167), and the spine wires stg/st->obj RW while holding them (amr_dist.c:512, :514)'

  # Reclassified 2026-08-23: same philosophy as miniAMR_intel (block-per-EDT
  # dataflow with halo exchange) and dominated by it -- 9 EDT creation sites
  # against 21, no refinement clone machinery, every EDT pinned to the
  # creating rank so nothing distributes, and per-block checksums with no
  # grand total to pin.  Kept as a toy of the caller-pinned shape.
  miniAMR_intel_bryan:
    binary: miniAMR_intel_bryan
    kind: toy
    # Reclassified from application: the same physics as miniAMR_intel and
    # dominated by it, with every EDT pinned to the rank that created it, so
    # nothing distributes.  A toy is not campaign material.
    default_enabled: false
    class: task
    provenance: 'miniAMR (Mantevo); full refinement and communication'
    marker: 'miniAMR complete'
    scalar_kind: bool
    args: ['--npx', '4', '--npy', '2', '--npz', '2', '--max_time', '800']
    unordered_writes: 'DBKArgs/DBKObjects are handed RW to every rank''s myConnect (mainOCR.c:495-496)'

  miniAMR_intel_chandra:
    binary: miniAMR_intel_chandra
    class: spmd
    provenance: 'miniAMR (Mantevo); SPMD rank-grid port'
    # The marker is the program's own verification verdict, so a cell that ran
    # to the end with a diverging checksum fails instead of voting.  The app
    # prints, once, from the sequential-rank-0 block: "VERIFICATION PASSED: <n>
    # checksum comparisons within tolerance", or "VERIFICATION FAILED: ..."
    # plus one "CHECKSUM DIVERGENCE ts <t> variable <v> sum <s> old <o>" line
    # per divergent comparison.  It deliberately does NOT also require the
    # "Done" shutdown line: that line comes from an unhinted task the runtime
    # places on any rank while the verdict comes from the rank owning the
    # sequential-rank-0 block, so their relative order in the one merged log
    # per cell is a buffering artifact.  Shutdown recognition is proven by the
    # runtime's own [E2E] stamp, which the driver requires of a reaped run.
    marker: 'VERIFICATION PASSED'
    scalar_re: 'ts 5 CHECKSUM sum\s+([\-+0-9.eE]+)'
    tolerance: 1e-06
    # The scalar line is printed only when --report_diffusion is on AND the
    # timestep is a checksum step (ts % checksum_freq == 0), so both flags are
    # part of the argument list. The ts 0 step prints the initial reference
    # line (no 'old'/'diff' terms -- the sum is only stored for the next
    # comparison); with checksum_freq 5 the first COMPARED line is ts 5,
    # variable 0, which is why the regex names ts 5.
    #
    # The scalar is a real oracle now.  Cells are initialised by an
    # index-seeded generator (splitmix64 of the global (level, var, i, j, k)
    # index -> [0,1)), a pure function of the index: identical at every node
    # count and in every runtime, with no shared generator state.  The 7-point
    # average with the mirror boundary condition conserves the grid sum
    # exactly, so the checksum equals the initial sum to rounding and any wrong
    # ghost value -- a lost or duplicated halo, a stale snapshot, a misplaced
    # block -- breaks it.  The previous constant initialisation was a fixed
    # point of both the stencil and the boundary condition, so its checksum was
    # blind to the whole data path.  Floating sum: reduction order varies with
    # the node count, drift is ~1e-13 relative against the 1e-06 tolerance.
    #
    # SPMD, and the base already carries a complete placement layer: the rank
    # grid maps to policy domains as contiguous 3-D subgrids (not modulo) and
    # both EDT and datablock affinity follow the owning domain at every create
    # site but three.  Load imbalance is exactly 1.00 at 1/2/4/8/16/32 nodes by
    # construction.  The hinted tier keeps that map and re-chooses only the
    # policy-domain factorisation (see the flag below).
    #
    # The rank grid mirrors the largest geometry, not the worker count.  The EDT
    # count is set by the block total, not the rank count (518,117,863 against
    # 518,119,559 for the same mesh), so an oversized grid buys no parallelism,
    # only overhead, at an equal EDT count.  Width comes from
    # init_x*init_y*init_z.
    #
    # stages_per_ts and num_vars are stated rather than left at their defaults
    # (20 and 40, the values in force): with the 6-face halo walked as a 3-axis
    # chain (12 comm EDTs per stage) they are what makes ~2,000 EDTs per
    # block-timestep, and an argument list that does not name them hides where
    # half a billion EDTs come from.
    #
    # num_refine 0 is a declared deviation from the published default of 5: the
    # octree is allocated eagerly, so one level of refinement multiplies the
    # payload by 9 and cannot fit a 256 GB node at any block count that also
    # satisfies the width floor.  report_diffusion 1 (published 0) is required
    # for the app to print any scalar at all.
    #
    # Disclosed build adaptations (all compile-time, all symmetric across the
    # twelve runtime entries via COMMON_DEFINES): CHANNEL_EVENTS_AT_RECEIVER is
    # defined, as the port's published Makefile.x86-base does;
    # OCR_APP_COUNTED_OEVT is defined (app-supplied COUNTED output events, a
    # memory-conformance adaptation, no dependence edge changed);
    # VERIFICATION_RUN is gone (the index-seeded initialisation is
    # unconditional); SHUTDOWN_LAG and PRINTBLOCKSTATS stay undefined
    # (SHUTDOWN_LAG's sleep() would sit inside the [E2E] window).
    # Anchor at these arguments, one node of 108 workers, INV x WB: 26.6 s, 22
    # GB resident; target 20 s (both tiers anti-scale, clamped).
    # Off the 0.8-1.2x band: at the width floor (4x4x2 x 6x6x3 = 3456 blocks)
    # with the published block size; no smaller lattice keeps the floor.
    expect: '1727840.569690'
    expect_args: ['--npx', '4', '--npy', '4', '--npz', '2', '--init_x', '6', '--init_y', '6', '--init_z', '3', '--nx', '10', '--ny', '10', '--nz', '10', '--max_blocks', '108', '--num_tsteps', '20', '--num_refine', '0', '--stages_per_ts', '20', '--num_vars', '40', '--report_diffusion', '1', '--checksum_freq', '5']
    args: ['--npx', '4', '--npy', '4', '--npz', '2',
           '--init_x', '6', '--init_y', '6', '--init_z', '3',
           '--nx', '10', '--ny', '10', '--nz', '10',
           '--max_blocks', '108',
           '--num_tsteps', '20', '--num_refine', '0',
           '--stages_per_ts', '20', '--num_vars', '40',
           '--report_diffusion', '1', '--checksum_freq', '5']
    # tried 2026-09-08: the policy-domain grid is chosen by the mesh area its
    # cut planes cross, not by the near-cube of the node count -- 2x4x1 instead
    # of 2x2x2 at 8 nodes and 4x4x1 instead of 4x2x2 at 16, cutting the
    # cross-node halo faces per stage by 33% and 25%; identical map at
    # 1/2/4/32 nodes and at every paper-trend geometry.
    hinted: true    # kept: the same rank grid cut into the halo-face-minimal policy-domain factorisation instead of the near-cube -- identical where the near-cube is already minimal (1/2/4/32 nodes, the trend grid), -33 % / -25 % faces at 8 / 16 nodes on the campaign grid; 14 % faster at 8 ranks on the shrunk campaign grid
    unordered_writes: 'FNC_timestepLoop and its siblings hand DBK_rankH/DBK_octTreeRedH on in RW without releasing them (driver.c:102, :121, :133, :154 and further sites; block.c:182-187 and refine.c:239-242 release after the hand-off)'

  multigen:
    binary: multigen
    class: task
    provenance: 'OCR multi-generation EDT example'
    kind: toy
    marker: 'End leaf1, result'
    scalar_re: 'End leaf1, result\s*=\s*(-?\d+)'
    scalar_kind: int
    expect: '121393'
    expect_args: []
    args: []
    default_enabled: false

  multigen_2:
    binary: multigen_2
    class: task
    provenance: 'OCR multi-generation EDT example, second form'
    kind: toy
    marker: 'End leaf1, result'
    scalar_re: 'End leaf1, result\s*=\s*(-?\d+)'
    scalar_kind: int
    expect: '3524578'
    expect_args: []
    args: []
    default_enabled: false

  nekbone:
    binary: nekbone
    class: spmd
    provenance: 'Nekbone (Nek5000 proxy)'
    marker: 'FinalEDT'
    # The final residual is the one printed value that observes the CG loop
    # (matvec, halo, reductions); the initial residual is computed before it
    # and stays as a secondary scalar.  Both are printed once, by virtual rank
    # 0; the per-rank diagnostic stdout the program used to emit from every
    # rank (23 lines a rank) is now rank 0's too, so the measured window
    # carries a constant, not a rank-count-sized, stream of write() calls.
    scalar_re: 'CGloop_stop> rnormfinal(?:\^2)?\s*=\s*([0-9.eE+-]+)'
    # artsrun uses the tolerance as an absolute floor as well as a relative
    # one, so it has to be scaled to the scalar's magnitude or the pin is
    # vacuous.  The residual here is ~1e-6, so 1e-12 is a relative band of
    # about 1e-6: wide enough for a runtime whose reduction reassociates the
    # sum differently (the reference lands ~1e-8 away), far tighter than a
    # CG loop that went wrong.
    tolerance: 1e-12
    extra_scalars:
      rnorminit: 'CGstep0_stop> rnorminit(?:\^2)?\s*=\s*([0-9.eE+-]+)'
    # SPMD, so the rank lattice is 1x the persistent units the largest
    # geometry provides: 32 nodes x 108 workers = 3456 = 18*16*12, and the
    # lattice is held there for every node count.  (The lattice must be
    # non-increasing -- the program rejects Rx<Ry or Ry<Rz.)  The base tier
    # anti-scales and the hinted tier scales (the box map keeps most faces
    # local once the element block carries enough flops per halo: at this
    # grain, 15 workers a rank, base 130.8/285/245/113.5 s and hinted
    # 130.3/108.3/71.8/58.1 s over 1/2/4/8 ranks; at a 2x2x2 block the same
    # map is anti, which is what a smaller trend lattice once showed), so the
    # size targets 60 s at one node (the hint layer is a no-op at one place,
    # so base and hinted share the anchor), and the restructured row runs its
    # own grain.
    #
    # Everything but the lattice comes from the program's own references.  The
    # polynomial DOF count is 8 -- what every one of the ten `x_edison_run_Rx*`
    # scaling scripts passes, and what the original's example1 input carries --
    # and the CG count is 100, which the original hardcodes in its driver
    # rather than reading from input.  (The port's README worked example uses
    # pDOF 12, so 8 is the defensible published value, not the only one.)  The
    # one knob left is the element block per rank, which is exactly what the
    # original's input file varies (`iel0,ielN,ielD (per processor)`), so that
    # is what carries the size: 4x4x4 = 64 elements, against the 8 the port's
    # scripts use and the ~512 of the reference inputs (3x3x3 = 27 gave 25.5 s,
    # the 20 s window of an anti-scaling row).
    # Anchor at these arguments, one node of 108 workers, INV x WB: 57.1 s
    # base / 56.9 s hinted, 35 GB resident; target 60 s (hinted scales).
    #
    # The block is pure GRAIN and costs no width: EDT creations are identical
    # -- 6,401,025 of them -- at 144, 27 and 24 elements a rank, so the task
    # population is the rank lattice's and the block only sets how much work
    # each task does.  What the block does change is the halo's share, since
    # its surface falls more slowly than its volume, and that is why the shape
    # is kept as cubic as the count allows: 3x3x3 and 4x4x2 both give a
    # surface-to-volume of 2.0 where 4x3x2 gives 2.17.  4x4x2 (32 elements)
    # is the larger of the two and predicts ~28 s by the size fit, so the pick
    # between them is the window's lower half, not the surface ratio.
    expect: '2.43928196219303E-06'
    expect_args: ['18', '16', '12', '4', '4', '4', '8', '100']
    args: ['18', '16', '12', '4', '4', '4', '8', '100']
    # The shipped rank-to-place map is rankID % places, which puts a rank's
    # halo neighbours on other places by construction: an axis neighbour is
    # local only when its id delta (1, Rx, Rx*Ry) divides the place count, so
    # on this lattice 66.3% of face adjacencies stay local at 2 places and
    # 32.8% at 4, 8, 16 and 32.  The hinted tier gives each place a contiguous
    # box of the lattice instead (98.0 / 95.8 / 92.8 / 88.3 / 82.4%).  Every
    # place still holds the same number of ranks and every rank the same
    # number of elements, so the balance is 1.000 under both maps.  Note that
    # the base map's remote fraction depends on the lattice's factorisation --
    # a 24x12x12 lattice would keep 65.7% local at 4 and 8 places -- so the
    # 4- and 8-node base-vs-hinted deltas are an upper bound; the 16- and
    # 32-node ones are lattice-independent.
    hinted: true    # kept: the 3-D box place map makes most of the 26-neighbour halo local and turns the verdict at the calibrated grain (base anti, hinted scales)
    restructured_as: nekbone_dist
    unordered_writes: 'the reduction library hands the accumulator to its clone in RW without releasing it (reduction.c:344, :454)'

  nekbone_dist:
    binary: nekbone_dist
    class: spmd
    provenance: 'Nekbone (Nek5000 proxy); reduction restructured'
    marker: 'FinalEDT'
    scalar_re: 'CGloop_stop> rnormfinal(?:\^2)?\s*=\s*([0-9.eE+-]+)'
    tolerance: 1e-12   # the same relative band as the base row: the two-level tree changes the reduction order with the node count, so the residual agrees to round-off, not bit-for-bit
    extra_scalars:
      rnorminit: 'CGstep0_stop> rnorminit(?:\^2)?\s*=\s*([0-9.eE+-]+)'
    # Same lattice and same iteration count as the row it re-implements, with
    # a larger element block (5x5x5 against the base row's 3x3x3): the
    # rewrite is in the all-reduce, so the structural delta is the tree, and
    # the restructured tier takes the larger per-rank grain its own 120 s
    # target asks for -- the base row cannot, its target being the
    # anti-scaler's.  Two disclosures.
    # (1) The binary is compiled with OCR_APP_OPTIMIZED_PLACEMENT forced on
    # (benchmarks/apps/CMakeLists.txt), so it carries the hinted tier's
    # contiguous-box placement map: restructured = hinted placement + the
    # two-level tree, and it is read against the hinted curve as much as
    # against base.  (2) The tree reassociates the sum -- and its shape keys on
    # Rtotal/places, so the reassociation changes at every node count -- so the
    # residual agrees to the tolerance rather than bit-for-bit, and the pin has
    # to hold at 16 and 32 nodes as well as at 1.
    expect: '3.28221007150027E-06'
    expect_args: ['18', '16', '12', '5', '5', '5', '8', '100']
    args: ['18', '16', '12', '5', '5', '5', '8', '100']
    restructured_from: nekbone
    unordered_writes: 'reductionTwoLevel.c hands the accumulator to its clone in RW without releasing it (reductionTwoLevel.c:387, :497)'

  npb_cg:
    binary: npb_cg
    hinted: false   # tried, and no hinted map beats the base: five maps (band-homed blocks, band-pinned readers, both, the spine pinned, all three) measured slower than the base at classes A and B and every geometry -- the matrix is read-only after construction and each iteration is a broadcast plus a gather, which no home assignment improves -- so the base's own map is the best hinted map and the base stands in for the tier; the layer was removed from the source
    class: task
    provenance: 'NAS Parallel Benchmarks CG'
    marker: 'Verification SUCCESSFUL'
    scalar_re: 'Verification SUCCESSFUL \(zeta\s*=\s*([\-+0-9.eE]+)'
    tolerance: 1e-10
    # Fork-join: per matvec, na/blk transient row tasks and one gather whose
    # dependence count IS na/blk.  Anti-scaler -- the whole-vector broadcast,
    # the single-EDT gather and the serial vector spine make every added node
    # cost time -- so the class stays at A (B already times out at two nodes).
    # Width = na/blk, node-invariant.  The rule's floor is na/blk >= 3456; an
    # exact multiple of it is advice, not a requirement, and no class size can
    # reach one anyway (na/blk = m*3456 needs 27 | na, and no class size is:
    # 14000 = 2^4*5^3*7 at A).  -b 4 is the smallest block count that still
    # clears the floor (3500 = 1.01x); -b 2 would give 7000 = 2.03x for no
    # benefit the advisory multiple asks for.
    # Construction is untimed by NPB's own specification and is parallel: one
    # builder per row block (the same na/blk width), from a shared inverse
    # index; the matrix is bit-identical to the published serial sweep.
    # The pin is the class's own reference zeta, so it is live at args.
    expect: '17.1721077015265'
    expect_args: ['-t', 'A', '-b', '4']
    args: ['-t', 'A', '-b', '4']
    restructured_as: npb_cg_dist

  npb_cg_dist:
    binary: npb_cg_dist
    class: spmd
    provenance: 'NAS Parallel Benchmarks CG; row-band SPMD rewrite'
    marker: 'Verification SUCCESSFUL'
    scalar_re: 'Verification SUCCESSFUL \(zeta\s*=\s*([\-+0-9.eE]+)'
    tolerance: 1e-10
    # SPMD: one persistent chain per rank with -c row slices inside it.  The
    # width is R*c and c is node-invariant, so -c 216 = 2x a node's 108 workers
    # gives exactly two balanced waves per rank at every node count and
    # 32*216 = 6912 = exactly 2x the 3456 workers of the widest geometry.  The
    # derived default (256) would give 8192 = 2.37x and a 40-worker third wave.
    # This is the SPMD carve-out of the invariance rule: per-rank width is fixed
    # by argument, aggregate width and the replayed draw stream scale with R on
    # purpose.  Scaler.
    # D is the largest class that runs: E's 72MB operand puts every gather in
    # DRAM behind a TLB walk and takes >19h at one node, while C is far under
    # budget.  -i cannot bridge the two -- D reaches the benchmark's own 1e-8
    # bar only near iteration 85 of its 100 -- so the published count stands and
    # the pin is the class's reference zeta (the run prints it to ~4e-13).
    # Construction never crosses the wire: every rank draws the stream itself,
    # divides the inverse index over its own workers and builds each row slice
    # with the task that will multiply it.
    # Anchor at these arguments, one node of 108 workers, INV x WB: 298.2 s,
    # 15 GB resident; target 120 s (restructured) -- the construction is now
    # per-rank parallel, not serial, so the previous 471 s / 314.8 s do not
    # carry over.
    expect: '52.5239203995295'
    expect_args: ['-t', 'D', '-c', '216']
    args: ['-t', 'D', '-c', '216']
    restructured_from: npb_cg
    unordered_writes: 'nchunk chunk tasks RW one vector and nscan scanners RW one index block (cg_dist_edt.c:605, makea_ocr.c:314)'

  nqueens:
    binary: nqueens
    class: task
    provenance: 'N-Queens'
    marker: 'sols:\s*\d+'
    scalar_re: 'sols:\s*(\d+)'
    scalar_kind: int
    # DISCLOSURE (base tier conformance).  The published program returns
    # nothing up the tree: every task is EDT_PROP_FINISH and each solution
    # bumps a process-global u32 with a relaxed atomic, so upstream creates
    # ZERO data blocks and ZERO per-node events.  A process-global is per-rank
    # state, so on a multi-rank runtime rank 0 would print its own share only;
    # the base tier therefore carries an explicit per-edge reduction (an
    # 8-byte block per task, satisfied onto a ONCE event wired into a
    # per-parent summer).  At the shipped args that adaptation IS the entire
    # 516,550 blocks / 516,550 events / 52,202 summers this row measures --
    # read every DB and event number here as introduced by distribution, not
    # as published behaviour.  The FINISH scopes were not the obstacle (the
    # shim implements them).  Rejected alternatives: one shared counter block
    # with atomic RMW -- the app README's own plan, but OCR has no atomic RMW
    # on a block, so every leaf would take an exclusive write turn on one
    # block and the run would measure that block, not the search; and a
    # per-rank accumulator under FINISH summed by the shutdown EDT -- correct
    # and cheap, but it makes the measured traffic a function of the node
    # count instead of the search.  The per-edge form was chosen because its
    # traffic is a function of the published decomposition: one edge per tree
    # edge, exactly the edges the FINISH scopes already imply.  The compute
    # phase itself (recurrence, cutoff test, pruning masks, sequential leaf
    # kernel) is unchanged.
    #
    # Recursive enumeration over a pruned search tree -- a dataflow frontier,
    # not a fork-join window: every leaf task is created with depc 0 and is
    # runnable at once, so the width rule is "instantaneous frontier >= total
    # workers", not "integer multiple of them".  rounds is pure repetition --
    # the shutdown EDT restarts the identical solve -- so it stays at its
    # default 1 and the size carries the weight.
    #
    # PUBLISHED DEFAULTS: the app publishes `13 5` (Makefile.x86-base:29,
    # WORKLOAD_ARGS) and `5 2` for tg (Makefile.tg:35); rounds and scatter have
    # no upstream analogue at all.  DELIBERATE DEVIATION on BOTH: n=13 is
    # milliseconds of work, so n is the size calibration, and cutoff moves with
    # it so the grain stays fixed -- cutoff 5 at n=19 would mean max_set=14,
    # essentially the whole tree expanded as EDTs, where max_set=4 still leaves
    # 464,348 sequential-leaf tasks.
    #
    # The two remaining dials are one plane, not two knobs: cutoff fixes
    # max_set = n - cutoff, hence how many levels spawn at all, and scatter
    # says how many of those levels cross ranks.  Swept at n=20 over 8 nodes:
    # the cost tracks the NUMBER of scattered tasks, which is exponential in
    # depth, so scattering every spawning level is right only while that count
    # stays near 1e5 (c13 s8 scatters 52.2M tasks and costs 540s against the
    # optimum's 284s; at n=20 levels 1..4 hold 67,086 boards and level 7 holds
    # 45,562,852).  c17 s5 is the fastest cell at 283.6s but leaves only 72k
    # units -- 21 per worker at 32 nodes -- and already shows 1.19x work
    # imbalance at 8; c16 s6 gives 789k units, 1.05x imbalance and 287.2s, so
    # the campaign knowingly pays the 1.3% for 10x the headroom (the band is
    # under 0.1%: s7 saturates to the same run as s6 and read 287.3).
    #
    # SCATTER IS A MEASUREMENT INVARIANT, not a free knob: a measurement
    # roster MUST use scatter = max_set + 2 (6 at the shipped grain).  Only
    # then is every task placed by key; below it a pinned task carries its
    # whole subtree onto one rank.  Static replay at 19 15, charging each task
    # to the rank it actually runs on, max/mean at 8/16/32 ranks:
    #   s2 2.50/3.40/3.63 and 15 of 32 ranks IDLE;  s3 1.24/1.67/2.08;
    #   s4 1.02/1.14/1.20;  s5 1.03/1.03/1.06;  s6 1.009/1.012/1.017.
    # Only s6 meets R2's "close to 1 at 2, 8, 16 and 32".  Values in
    # [2, max_set+1] stay LEGAL and are useful for functional smokes
    # (an experiment may run `13 10 1 2`), but they are not
    # measurement settings.  The program rejects only the total funnel
    # (scatter < 2, which places nothing but the empty board and runs the
    # whole search on one rank) -- as it rejects rounds < 1, a negative token,
    # a size outside [1,30] and a cutoff outside [0,size).  Validation is loud
    # (print + abort) rather than ocrAssert, which the reference runtime
    # compiles away.
    #
    # At the shipped args: T = 516,550 find EDTs, S = 52,202 spawning,
    # 464,348 sequential leaves (134x the 3456 workers of the widest
    # geometry), 568,754 EDTs and 516,550 8-byte DBs/events in total, under
    # 0.3 GB.  Every spawning task creates and destroys its own sum template
    # (52,202 pairs) -- published idiom, shim-dependent, not a defect to chase
    # if a reference runtime trips there.
    #
    # Those two settle the WIDTH plane and are held; n carries the size, and
    # the cutoff moves with it so max_set stays 4.  The base tier scales, so n
    # targets 100 s.  DELIBERATE DEVIATION, and it is forced -- n is an
    # integer and the enumeration grows by roughly a factor of seven per step,
    # so 18 is 4.2 s and 20 is 237.3 s, with no rung in between close to the
    # target.  Narrowing max_set instead would buy the seconds by giving up
    # width, which the rule forbids.
    expect: '39029188884'
    expect_args: ['20', '16', '1', '6']
    args: ['20', '16', '1', '6']
    hinted: true    # kept: 19 % faster at 8 ranks, equal below -- at this grain the state-key map is balance-equivalent to round-robin and the gain is the creator-pinned summers (one of the three crossings per tree edge removed)
    # The hinted layer places a search task by a canonical key of its whole
    # board state (cols, ldiag, rdiag) -- the column mask alone is an
    # order-independent SET, so keying on it sent every permutation of one
    # column set to one rank (11,628 keys for 464,348 leaves).  Scattered-task
    # max/mean at 2/8/16/32 ranks, static replay at 19 15: old key
    # 1.010/1.032/1.041/1.094, canonical key 1.002/1.009/1.012/1.017, against
    # a multinomial floor of ~1.002/1.010/1.014/1.020 -- i.e. the widened key
    # is AT the floor, where the old one was far above it at width.  A second
    # candidate (shifted-OR pack of the three masks) sits within noise of it on
    # both metrics; the choice between them is not a balance argument, and the
    # canonical key was taken because it is lossless in its inputs.  Summers
    # pin to the creating rank; result DBs and the shutdown EDT stay unhinted
    # in both tiers.
    #
    # R3 GATE OPEN: the 8-13x hinted win on record is measured at n=18
    # cutoff 12 (max_set 6), where the layer creator-pins 17.2M of 17.6M
    # tasks -- a mechanism that does not exist at the campaign's max_set 4.
    # The only same-campaign both-tier record at the campaign grain
    # (17 13 1 6, ferrari 1/2/4/8) reads 1.0-1.3x at a size too small to
    # resolve shape.  Re-run the gate at 18 14 1 6, both tiers, interleaved,
    # AFTER the key widening -- never mixed across it.

  p2p:
    binary: p2p
    # The enum has three classes and none of them is "dataflow"; spmd is the
    # closest fit for p ranks over a partitioned domain, but the frontier is a
    # wavefront that fills and drains once per TIMESTEP (rank p-1's wrap value
    # gates rank 0's next timestep), so the width has two honest readings and
    # both are recorded below rather than one being quoted as "the" width.
    class: spmd
    provenance: 'Parallel Research Kernels synch_p2p (pipelined wavefront)'
    marker: 'PASS checksum'
    scalar_re: 'PASS checksum\s*=\s*([\-+0-9.eE]+)'
    tolerance: 1e-08
    # The scalar is the last cell of the recurrence against its closed form,
    # printed with six decimals: checksum = (t+1)*(n+m-2).  It is a pure
    # function of the arguments, identical at every node count and on every
    # runtime, integral for any argument set, so the pin below applies at the
    # small consensus set and the campaign size needs no re-pin: at its
    # arguments the expected line is `PASS checksum = <(t+1)*(n+m-2)>.000000`.
    expect: '3839515.000000'
    expect_args: ['3456', '34560', '3457', '100', '1', '108']
    #
    # Two tiers.  base is the published program: an unguarded `#define BLOCK`
    # lays the p ranks out in contiguous blocks over the policy domains and
    # `AFFINITY` pins each rank's whole chain to the domain it was born on.
    # hinted overrides ONLY that map, under OCR_APP_OPTIMIZED_PLACEMENT: the
    # same ranks are dealt to the domains in runs of `chunk` (argv[6], parsed
    # in both tiers and used only by the guarded one; 0 or a value above the
    # contiguous block means the contiguous block, i.e. base's map).  Nothing
    # else differs -- same task graph, same DB and event counts, same wiring.
    # Why the override exists: base's contiguous map puts the wavefront's
    # contiguous runnable interval on a contiguous NODE interval, so a node
    # holding `block` runnable ranks can only run `workers` of them and the
    # rest of the machine is idle for most of a sweep.  With chunk = the
    # per-node worker count, every engaged node saturates exactly once and the
    # crossing count is p/chunk instead of the block map's node count -- 0.93 %
    # of handoffs instead of 0.46 % at p = 6912 on 32 nodes, both far from the
    # wrap map's 100 %.  A coverage model of the runnable set (workers = 108,
    # p = w = 6912) puts the hinted map at 1.33x / 1.57x / 1.69x / 1.67x /
    # 1.48x the busy-worker average at 2 / 4 / 8 / 16 / 32 nodes; any chunk at
    # or below the worker count models the same and larger chunks decay to
    # base, so the worker count is the knee and is the value to size.
    # THE MODEL IS NOT A MEASUREMENT -- the campaign decides whether the layer
    # is kept (R3).  What was measured earlier and removed was a different
    # layer (the boundary DB's home, 0.87x / 0.99x / 0.97x at 2 / 4 / 8 nodes),
    # and none of those runs survives under logs/, so they are history, not
    # evidence.  The `11x for the strided map` figure quoted by the previous
    # row was produced by editing the unguarded `#define BLOCK` out of the
    # source and is NOT reproducible from this tree; it is dropped here.
    hinted: false   # tried, and no hinted map beats the base: the pipeline admits one alternative to the published contiguous map -- dealing ranks to domains in chunks -- and it runs 3-11x slower at every multinode geometry, so the base's own map is the best hinted map and the base stands in for the tier
    #
    # p is the number of virtual ranks, an application-level decomposition knob
    # with no relation to the worker threads arts.cfg starts.  The instantaneous
    # width is min(p, w) with w = ceil((n-1)/gf) -- rank i phase j waits on
    # rank i-1 phase j and on its own phase j-1 -- and the average over a
    # timestep is p*w/(p+w-1), so both p and the phase count have to clear the
    # worker total, not just one of them.  p = w is where they balance: for a
    # given array it buys the most width, and there a peak of 2x the workers is
    # an average of 1x.  Size the row with p, n and m; the timestep count stays
    # at the published default t = 100 and gf stays 1 (the PRK README calls any
    # other value cheating and the program negates its own reported flop rate
    # for it).  Keep p a multiple of chunk * (largest node count) so both maps
    # are exactly balanced (load imbalance 1.000 at 2/8/16/32 nodes); at
    # chunk = 108 that means a multiple of 3456.  Memory is 8*n*(m+p) for the
    # arrays plus about c*p*w for live boundary blocks, where the lookahead
    # bound is the program's own per-timestep wrap barrier and NOT the
    # channel's maxGen (the shim ignores maxGen); c was near 1.8 kB at the
    # previous size but no RSS sample of that run survives, so the 1-node
    # budget must be re-checked by measurement.
    # The row runs p = 3456 (the width floor: chunk times the largest node
    # count, 108 x 32), n = 3457 so w = ceil((n-1)/gf) lands at p exactly --
    # the balanced p = w point that buys the most width -- and m = 34560 as
    # the one size knob still free once p and n are pinned; t and gf stay at
    # the published defaults (100, 1).
    # Anchor at these arguments, one node of 108 workers, INV x WB: 81.3 s, 7
    # GB resident; target 20 s (both tiers anti-scale, clamped).
    # Off the 0.8-1.2x band: the width floor itself (p = w = 3456 at the
    # published t = 100, gf = 1) costs this much; nothing smaller keeps the
    # floor.
    args: ['3456', '34560', '3457', '100', '1', '108']
    unordered_writes: 'realMainEdt holds timerDBK RW past its satisfy, and mainEdt''s/initEdt''s creator holds are handed on unreleased (p2p.c:726, :724, :528, :532, :537)'

  printf:
    binary: printf
    class: task
    provenance: 'OCR output fixture'
    kind: toy
    marker: 'Hello from mainEdt'
    scalar_kind: bool
    args: []
    default_enabled: false

  prodcon:
    binary: prodcon
    class: spmd
    provenance: 'OCR tagged-scheduler producer/consumer kernel'
    kind: toy
    marker: 'MB/s'
    scalar_kind: bool
    args: ['48', '8000000', '6000']
    default_enabled: false
    unsupported: 're-creates a wrapping label index (prodcon.c:174-181) whose previous generation another thread''s consumer destroys (:116-119) with nothing ordering that destroy before the new generation''s dependences (:199-200), and creates each mapCons label from two loops per round (:177-181) — outside the labeled-GUID contract (docs/programming_model/guids.rst)'
    unordered_writes: 'the creating task hands the block on in RW without releasing it (prodcon.c:155, :206)'

  quicksort:
    binary: quicksort
    class: task
    provenance: 'Quicksort'
    marker: 'QSORT_VALID'
    # The row pins the checksum the finisher computes over the whole sorted
    # array: non-decreasing order, the element count, and the sum a permutation
    # of the input must preserve.  `sorted=0` makes the pattern miss and the
    # cell fail.  The program also prints one `QSORT_ARGS` line with the
    # resolved arguments, and `QSORT_ARG_ERROR` instead of running if an
    # argument cannot describe a run -- neither line matches the marker.
    scalar_re: 'QSORT_VALID sum=(\d+) sorted=1'
    scalar_kind: int
    # Size is the array.  This tier anti-scales: every task in the recursion
    # acquires the SAME block RW, so adding nodes adds whole-array hand-offs
    # rather than concurrency, and the size targets 20 s (hinted kept, flat)
    # rather than the longer window a strong scaler gets.
    # The window is now the sort.  The input used to be generated by one task
    # on one rank with a generator that walked a thousand-entry table per
    # element -- ~90% of the window at the old size, and node-invariant, so it
    # compressed the very ratio this row exists to show.  Generation is now an
    # index-seeded pure function of the element index run by the tasks that own
    # the ranges (third argument), which is the conformance adaptation the
    # restructured row uses too, so both rows sort the same multiset at the
    # same size.
    # The range is the program's own default (RANGE in quicksort.c): nothing
    # about the experiment picks it, and it changes only how many values
    # repeat, not the decomposition or the task count.
    # The third argument is how many tasks the generation is cut into.  The one
    # datablock is the published decomposition, so the generators are placed on
    # its home and their useful ceiling is one node's workers.
    # Anchor at these arguments, one node of 108 workers, INV x WB: base 19.2
    # s / hinted 19.1 s, 6 GB resident; target 20 s (hinted kept, flat).
    expect: '9997705644359'
    expect_args: ['20000000', '1000000', '108']
    args: ['20000000', '1000000', '108']
    # Known-good small values for a smoke or a re-pin check (sum is a pure
    # function of the first two arguments, identical in both rows):
    #   1000    1000000 -> 513512683
    #   200000  1000000 -> 100256346693
    #   2000000 1000000 -> 999727516675     (local trend argv)
    #   6000000 1000000 -> 2999139219780
    # The source carries a placement layer.  Every task in the recursion
    # acquires the SAME block RW -- the children are handed the same GUID and
    # differ only in their index range -- so the layer cannot distribute the
    # work; what it can do is stop the block from chasing the recursion, by
    # placing a subarray's tasks where the MIDDLE of the range they sort lives.
    # Keyed on the range start instead, every range that begins at the front of
    # the array maps to rank 0 however large it is, so the root and the whole
    # left spine stack there: task count balances and work does not, worsening
    # with rank count (rank-0 work / ideal ~3x at 32 ranks).  The midpoint map
    # keeps the leaves where they were -- a leaf's middle is its start -- and
    # bounds the left spine's excess at ~1.13x the ideal share at 2, 8, 16 and
    # 32 ranks.  Read 1.13 as an upper bound derived on the spine (the worst
    # chain: extents shrink geometrically while sharing an endpoint), not as a
    # measured imbalance of the map.  Count balance is ~1.0 under BOTH maps, so
    # no campaign scalar can tell them apart -- only per-rank busy time can.
    # Disclosure: the guard also adds one u64 to the EDT parameter block (the
    # extent the hint formula needs), so the hinted binary passes one more word
    # per EDT than base.  One node returns NULL_HINT, so the two are equivalent
    # there, not bit-identical.
    hinted: true    # kept: containment of the single RW array block, 8x faster than the base at 2-8 ranks; distribution is the restructured row's
    restructured_as: quicksort_dist
    unordered_writes: '128 fillTask writers and both recursive children RW the one array (quicksort.c:375, :230, :246)'

  quicksort_dist:
    binary: quicksort_dist
    class: task
    provenance: 'Sample-splitter distributed sort'
    marker: 'QSORT_VALID'
    scalar_re: 'QSORT_VALID sum=(\d+) sorted=1'
    scalar_kind: int
    # The same generator as the row it re-implements -- a pure function of the
    # element index -- so the same array and the same answer at the same size.
    # This row is calibrated at its own size, so its scalar is compared against
    # itself only.
    #
    # The third and fourth arguments are this rewrite's decomposition, buckets
    # and chunks, and the width rule sets them.  The structure is
    # spawn-and-join, so the rule wants an integer multiple of the 3456
    # persistent units the largest geometry provides, >= 2x: 6912 is 2x, and
    # every stage that touches an element is nchunks, nbuckets or
    # places^2 * waves wide (8192 at these arguments).  The stages that are one
    # per place -- the layout task, the readiness edge, the join -- do
    # arithmetic over the exchange grid and never over the elements.
    # A direct chunk-to-bucket exchange would make their product the block
    # count -- 47.8 million blocks carrying 0.84 elements each.  The exchange
    # is aggregated per place instead: a place packs everything it owes ONE
    # peer in one wave into one buffer, so it costs P(P-1) buffers per wave
    # whatever the width.
    # The last argument is the place count -- the number of partitions the
    # program owns its work and aggregates its exchange in.  It is an argument
    # and not the rank count, so the task and datablock counts, and the order
    # the partials combine in, are identical in every geometry; the runtime
    # maps the places onto whatever ranks exist through a hint.  32 is one
    # place per node at the largest geometry, which is where the calibration
    # is taken, and it is the same convention XSBench's `-p 32` uses.  It is
    # also the exchange width knob: the per-peer stages are places^2 * waves.
    # 1-node memory: peak <= 24 * arraySize bytes + ~1 GB of per-chunk scratch.
    # Nothing bounds chunk residency (a chunk depends only on the splitters, and
    # a wave's reaper is enabled rather than executed), so the generated form,
    # the packed arrivals and the place arrays can all be resident at once; a
    # prompt scheduler settles near 16 * arraySize, which is an observation and
    # not a bound.  96 GB at 4e9 against the 190 GB budget, a ~1.9x margin --
    # measure the 1-node RSS before committing to that size.
    # The splitter cut is the one width-1 stage on the critical path: its serial
    # term is O(32 * nbuckets * log places), linear in nbuckets, so nbuckets
    # buys sort width at a small central cost that the sweep should stay aware
    # of.
    expect: '1999991945511713'
    expect_args: ['4000000000', '1000000', '6912', '6912', '32']
    args: ['4000000000', '1000000', '6912', '6912', '32']
    # Known-good small value: 40000000 1000000 240 240 8 -> 19997351056649
    # (the local trend argv; 240 = 2 x 120 workers at the 8-rank geometry,
    # places 8 = one per rank, waves 8).
    restructured_from: quicksort
    unordered_writes: 'narr scatter tasks and bpg bucket tasks RW the one place array (quicksort_dist.c:690, :666)'

  reduction_intel:
    binary: reduction_intel
    class: task
    provenance: 'Test driver for the OCR reduction library'
    kind: toy
    marker: 'T\d+ i1'
    scalar_re: 'T30 i1\s+([0-9.]+)'
    expect: '1025'
    expect_args: ['25', '2', '30']
    args: ['48', '2', '20000']
    default_enabled: false
    unordered_writes: 'the creating task hands the block on in RW without releasing it (driver.c:349-350, :299)'

  reduction_intel_chandra:
    binary: reduction_intel_chandra
