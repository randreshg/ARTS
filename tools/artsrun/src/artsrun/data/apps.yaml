    provenance: 'attack matrix v3: the exclusion column — an event-ordered handoff whose consumers hold the block for longer than the producer'
    # The consumers' hold is the read phase; the next producer must wait it
    # out under exclusion and does not under validation or invalidation, so
    # the per-generation cost is the hold under the exclusion arms and the
    # handoff's own overhead elsewhere.
    # TARGET: exclusion, whose queue-fair lock makes the next producer wait
    # out a live read phase.
    # The home-based reference fails the consumer oracle on this row from
    # four ranks: a re-acquire on a rank whose earlier consumer still holds
    # the block is served the previous occupant of the region.  The printed
    # GENS= is the aggregate over all lattices (lattices times the
    # per-lattice generation count).
    # On one node of 108 workers only EXCL·PURGE pays the consumer hold:
    # EXCL·PURGE ~270 s against ~21-22 s on the other seven arms (scaled
    # from a measurement at 20,000 generations) -- a writer on the readers'
    # own rank waits their zero edge only when the grant returns at every
    # release, and EXCL·RETAIN serves both under its resident grant.  From
    # two ranks both exclusion arms pay it: EXCL ~360 s against VAL·WB
    # ~115 s / INV·WB ~155 s (same scaling).
    # Anchor at these arguments, one node of 108 workers: GENS raised
    # 20,000 -> 130,000 so the exclusion arms land near 350 s.  Population is
    # fixed at 8 lattices, so the 32-node cell is its 8-rank cell:
    # EXCL·RETAIN ~359 s, EXCL·PURGE ~349 s (VAL·WB ~115 s, INV·WB ~155 s).
    marker: 'HANDOFF_LATTICE OK '
    scalar_kind: bool
    extra_scalars: *lattice_scalars
    args: ['65536', '20', '2000', '3', '130000', '8', '8']
    default_enabled: false
    timeout: 1800
    multinode_timeout: 1800
  sar_pss:
    binary: sar_problem_size_scaling
    class: task
    provenance: 'Streaming Sensor Challenge Problem SAR reference (Georgia Tech Research Institute)'
    marker: 'SAR detects:'
    scalar_re: 'SAR detects:\s*(\d+)'
    scalar_kind: int
    # Anchor at these arguments, one node of 108 workers, INV x WB: 20.4 s, 10
    # GB resident; target 20 s (both tiers anti-scale, clamped).
    args: ['{repo}/datasets/sar-huge/Data.bin', '{repo}/datasets/sar-huge/PlatformPosition.bin', '{repo}/datasets/sar-huge/PulseTransmissionTime.bin', '{repo}/scratch/sar_detects.txt', '{repo}/third_party/ocr-apps/apps/sar/ocr/problem_size_scaling/Parameter17.txt', '50', '100', '250', '0']
    # Anti-scaler, structurally: every tile family splits the image but writes
    # it back through ONE whole-image block acquired RW, and write permission
    # is exclusive per policy domain, so the block tours the domains and each
    # hop carries the whole image.  Measured at 2000 a side: 13.2s / 1.4GB at
    # one ferrari node against 78.7s / 110.5GB at two -- the anti-scaling is a
    # memory blow-up as much as a time one, so declare the per-geometry RSS
    # before running and read a 4- or 8-rank death on the uncombined VAL arm as
    # a result about that arm.
    #
    # Hinted was tried and no map beats the base: a placement layer here either
    # collapses the pipeline onto one rank (measured: 97% of the useful work on
    # one of four, five tasks between the other two) or, written honestly as a
    # coordinate map, runs 23-36% slower than no hints, so the base's own map is
    # the best hinted map and the base stands in for the tier.  Affinity cannot
    # address a serialisation that is on a shared block.  There is no OCR_APP_OPTIMIZED_PLACEMENT guard
    # in the SAR sources and never has been.
    #
    # WIDTH.  Phases are barrier-separated, so the frontier is one phase and the
    # spawn-and-join clause applies.  Tile phases are ceil(Ix/blk_tile)^2:
    # Parameter9 (4000) gives 6400 = 1.85x of 3456 -- short.  Parameter10 (4400,
    # created with this change set) gives 7744 = 2.24x; Parameter14 (6000) gives
    # 14400 = 4.17x and meets the project's 4x fork-join slack.  Both follow the
    # ladder's own rule Ix = 400*(n+1).  The registration stage is
    # floor(sqrt(Nc))^2 = 3600 at EVERY rung (Nc = 3629 in every shipped file)
    # = 1.04x; raising Nc is the only fix and is a deliberate deviation nobody
    # has authorised, so this row's narrowest phase stays 3600 for now.
    #
    # Memory ~= 48*Ix^2 + 134 MB app-side; 3.8 GB RSS measured at 4000, ~8.6 GB
    # at 6000 on one Dane node.
    #
    # The detections file (~180 MB from one task) is OFF: argv[9] = 0.  It is
    # published output, not workload, and it is a flat serial term that would
    # compress the very anti-scaling this row exists to show.  argv[9] = 1
    # restores it.
    expect: '10322816'
    expect_args: ['{repo}/datasets/sar-huge/Data.bin', '{repo}/datasets/sar-huge/PlatformPosition.bin', '{repo}/datasets/sar-huge/PulseTransmissionTime.bin', '{repo}/scratch/sar_detects.txt', '{repo}/third_party/ocr-apps/apps/sar/ocr/problem_size_scaling/Parameter17.txt', '50', '100', '250', '0']
    fixtures: ['{repo}/datasets/sar-huge/Data.bin', '{repo}/datasets/sar-huge/PlatformPosition.bin', '{repo}/datasets/sar-huge/PulseTransmissionTime.bin']
    restructured_as: sar_dist
    unordered_writes: 'every stage''s tile tasks RW the one output block (inputs.c:393-395, back_proj.c:565, ccd.c:203, cfar.c:340-341, registration.c:358, :733-735)'

  sar_dist:
    binary: sar_dist
    class: task
    provenance: 'Streaming Sensor Challenge Problem SAR reference (Georgia Tech Research Institute); distributed rewrite'
    marker: 'SAR detects:'
    scalar_re: 'SAR detects:\s*(\d+)'
    scalar_kind: int
    # The image is its stripe set -- one row-stripe per rank, each homed on its
    # rank -- and no task ever holds the picture whole.  Every shared object the
    # base program's phases pass through is gone: the projection's tiles feed
    # per-band slabs and per-stripe gathers directly, the correlation pass is
    # fused into the detection pass so the whole-image correlation map is never
    # built, detections are per block instead of appended into one array under
    # an atomic, and the resample lands in the registered image's stripes the
    # same way.  Detection blocks and their reducers are a two-level tree, one
    # row of blocks per task, so neither the creation nor the fan-in passes
    # through a single task.  Placement is an ownership-range map, EDT and DB
    # alike: rank = floor(s*nr/ns) over the stripe partition, applied to the
    # projection's bands and tiles, the resample's blocks and band gathers, the
    # control points and the detection rows.  Derived imbalance at 2/8/16/32
    # ranks is 1.00/1.00/1.04/1.04 for every phase except the control points
    # (2:1 at 32, a consequence of floor(sqrt(Nc)) = 60 grid rows).
    #
    # COVERAGE.  The layout aborts loudly rather than returning fewer stripes
    # than ranks, and the bound is on the SHORTEST realized stripe, not on the
    # average: stripe boundaries fall on multiples of blk_tile, so with
    # B = blk_tile the condition is
    #   floor(ceil(Iy/B)/ranks) * B >= min_rows,  ranks <= 64,
    # min_rows = max(blk_cfar+Ncfar+Ncor-2, blk_affine+64, Sc+2*Rc, blk_tile)
    # (164 at the arguments below).  At B = 50 and min_rows = 164 that admits
    # 64 ranks at Parameter45 (18400; 92 but for the array bound), 30 at
    # Parameter14 (6000), 22 at Parameter10 (4400) and 20 at Parameter9 (4000)
    # -- so a short-image rung of THIS row is a <= 16-node trend, and 32 nodes
    # needs Iy >= 6400.  The rung below (18400) covers the whole sweep.
    #
    # WIDTH at Parameter45 (18400) with blk_tile 50 / blk_cfar 100 /
    # blk_affine 100: projection 135,424 (39x), detection 33,856 (9.8x),
    # resample 33,856 (9.8x).  argv[8] = 100 is REQUIRED: the compiled default
    # 250 gives 5476 = 1.58x and a 1.5:1 imbalance at 32 ranks.  Both are
    # downward-only from their compiled maxima (100 / 250), which size the
    # tasks' automatic storage; a larger value is refused loudly.
    #
    # It scales where the base anti-scales, which puts it under the
    # restructured tier's 120 s target rather than the base's 20 s -- hence
    # its own rung of the shipped ladder (Ix = 400*(n+1), so 18400 is
    # Parameter45).  MEMORY is cumulative,
    # not a frontier: nothing under dist/ is ever destroyed (the *_free macros
    # are empty and there is no ocrDbDestroy), so every phase's tiles, band
    # slabs and scratch live to shutdown.  App-side live set
    #   ~= [8*(2 projections' tiles + 2 band slabs + 3 stripe sets
    #          + resample blocks + resample band slabs)
    #       + 12 (detection lists) + 4*(1+(Ncfar-1)/blk_cfar)^2 (correlation)]
    #      * Ix^2 + 134 MB  ~= 90 * Ix^2  = ~31 GB at Parameter45.
    # The block knobs move only the DB COUNT, not the bytes -- each level's
    # payload is one image's worth however it is cut -- except the correlation
    # term, which grows as blk_cfar falls.  49.9 GB was measured before the
    # whole-image blocks were removed; recheck the recorded per-node RSS at 8
    # and 16 nodes before the 32-node run, because the retaining arms replicate
    # stripes.
    #
    # Its own detects path: the two rows used to name the same file.
    args: ['{repo}/datasets/sar-huge/Data.bin', '{repo}/datasets/sar-huge/PlatformPosition.bin', '{repo}/datasets/sar-huge/PulseTransmissionTime.bin', '{repo}/scratch/sar_dist_detects.txt', '{repo}/third_party/ocr-apps/apps/sar/ocr/problem_size_scaling/Parameter45.txt', '50', '100', '100', '0']
    expect: '27114207'
    expect_args: ['{repo}/datasets/sar-huge/Data.bin', '{repo}/datasets/sar-huge/PlatformPosition.bin', '{repo}/datasets/sar-huge/PulseTransmissionTime.bin', '{repo}/scratch/sar_dist_detects.txt', '{repo}/third_party/ocr-apps/apps/sar/ocr/problem_size_scaling/Parameter45.txt', '50', '100', '100', '0']
    fixtures: ['{repo}/datasets/sar-huge/Data.bin', '{repo}/datasets/sar-huge/PlatformPosition.bin', '{repo}/datasets/sar-huge/PulseTransmissionTime.bin']
    restructured_from: sar_pss
    unordered_writes: '128 read_slab_edt take X/Pt/Tp RW concurrently (src/inputs.c:392-394)'

  smithwaterman:
    binary: smithwaterman
    class: task
    provenance: 'Smith-Waterman sequence alignment'
    marker: 'score:\s*\d+'
    scalar_re: 'score:\s*(\d+)'
    scalar_kind: int
    # Pinned scores of the staged pairs (unchanged by this pass):
    #   gate   2,000 / 2,000       tile 10  -> 1176
    #   trend  70,000 / 70,000     tile 100 -> 43068
    #   cal    140,000 / 140,400   tile 100 -> 86360
    #   mid    178,000 / 178,400   tile 100 -> 110024
    #   cmp    200,000 / 200,000   tile 100 -> 123196  (score-cmp.txt still holds
    #                                                   the placeholder -1)
    # Anchor at these arguments, one node of 108 workers, INV x WB: base
    # 23.0 s / hinted 22.1 s, 10.3 GB resident; target 20 s (hinted kept,
    # flat).  The cmp pair (200,000 / 200,000) is the rung the window
    # selects: the cal pair (140,000 / 140,400) sits at 9.4 s and the
    # wavefront's time is quadratic in the length.  Its score is the value the
    # program itself prints in agreement across runtimes and node counts --
    # the pair is past what the sequential reference computes -- so this
    # row's consensus is a cross-runtime check, not an independent oracle.
    expect: '123196'
    expect_args: ['100', '100', '{repo}/datasets/smithwaterman/string1-cmp.txt', '{repo}/datasets/smithwaterman/string2-cmp.txt', '{repo}/datasets/smithwaterman/score-cmp.txt']
    # Two knobs and they are independent: total DP work is the product of the
    # two sequence lengths, while the wavefront's peak width is min(W,H) =
    # min(len1/tileWidth, len2/tileHeight).  The tile the app documents is 10,
    # but its example runs a 51-character sequence, so it says nothing about
    # scale; the width rule has to derive it.  There is no iteration, timestep
    # or round count in this program, so calibration moves the SIZE only.
    #
    # DELIBERATE DEVIATION on width, and it is structural.  A wavefront offers
    # width X only with X^2 tasks, under either lever and any tile aspect
    # ratio: the rule's 1x floor (3,456) is 11.9 M tiles and its 4x slack
    # (13,824) is 191 M.  Memory is NOT what forbids it -- 11.9 M tiles is
    # 3*3457^2 = 35.9 M events at ~508 B each (a constant apportioned from the
    # measured ~3.0 GB over that instance's 5,905,215 events, so this is an
    # extrapolation from one anchor), ~18 GB at one node, well inside
    # the budget.  The window is.  This row builds its whole graph in mainEdt,
    # so creation cost tracks the task count, and the measured tile lever
    # prices it: tile 50 is 100.8 s at width 0.81x, already outside the
    # window.  At tile 100 the width is 0.41x (W=1400, H=1404 at the 140,000
    # pair; average concurrency 701 = 0.20x).  The width the base row cannot
    # reach is supplied by smithwaterman_dist at 2.31x.
    #
    # base and hinted are one entry and differ only in the binary stem, so
    # they share these arguments and their 1-node cells coincide (the hint
    # layer is a no-op at nranks <= 1) -- which is what anchors the size.
    #
    # This row anti-scales steeply -- 1.45 s at one node against 51.3 s at two
    # on the 70,000 trend pair -- and also INSIDE a node, 7.91 s at 15 workers
    # against 10.88 s at 112, which is what a single-threaded creation loop
    # looks like when workers are added around it.  That serial construction
    # IS this program's published decomposition and is what the base tier is
    # here to display, so this row measures create/dependence-registration
    # cost far more than coherence traffic.
    #
    # Disclosed base adaptations (identical in both tiers, none of them a
    # change to the compute-phase decomposition):
    #   - ceiling division for W/H plus effective_tile_width/height edge
    #     handling, and the two actual string lengths carried in the params
    #     block: an upstream bug fix -- upstream truncated the tail with
    #     integer division and read a full tile unconditionally.
    #   - three ocrEventDestroy calls in the tile body (and the three GUIDs
    #     they need in paramv): a consumer reclaims the readiness events it
    #     read along with the blocks they carried.  Worth ~12% of E2E and half
    #     the resident set; it also grows each create message by three GUIDs.
    #     Not upstream behaviour -- disclose it.
    #   - loud argument validation: non-positive tile side, unreadable score
    #     file, and a sequence with no nucleotide in it now print a line and
    #     shut down instead of dividing by zero, dereferencing NULL, or
    #     hanging on an empty grid.
    #   - hinted-guard precondition: the row-band map yields to no-preference
    #     placement when nranks > n_tiles_height, where a band per rank could
    #     not reach every rank.  Inside the guard, hint-only.
    args: ['100', '100', '{repo}/datasets/smithwaterman/string1-cmp.txt', '{repo}/datasets/smithwaterman/string2-cmp.txt', '{repo}/datasets/smithwaterman/score-cmp.txt']
    # The gate pair travels with the row rather than with the roster that
    # names it: a roster row carries arguments only, so a small-size gate can
    # stage its own inputs only from here.
    fixtures: ['{repo}/datasets/smithwaterman/string1-cmp.txt', '{repo}/datasets/smithwaterman/string2-cmp.txt', '{repo}/datasets/smithwaterman/score-cmp.txt', '{repo}/datasets/smithwaterman/string1-gate.txt', '{repo}/datasets/smithwaterman/string2-gate.txt', '{repo}/datasets/smithwaterman/score-gate.txt', '{repo}/datasets/smithwaterman/string1-cal.txt', '{repo}/datasets/smithwaterman/string2-cal.txt', '{repo}/datasets/smithwaterman/score-cal.txt']
    hinted: true    # kept: the band map is 1.3-2x faster than the base at 2-8 ranks
    restructured_as: smithwaterman_dist

  smithwaterman_dist:
    binary: smithwaterman_dist
    class: task
    provenance: 'Smith-Waterman sequence alignment, place-persistent SPMD rewrite'
    marker: 'score:\s*\d+'
    scalar_re: 'score:\s*(\d+)'
    scalar_kind: int
    expect: '493680'
    expect_args: ['100', '100', '{repo}/datasets/smithwaterman/string1-swd.txt', '{repo}/datasets/smithwaterman/string2-swd.txt', '{repo}/datasets/smithwaterman/score-swd.txt', '32']
    # The same wavefront and the same kernel as the row it re-implements; what
    # changes is that each place builds the tasks for its own band of rows
    # instead of one rank prescribing the whole W^2 graph.  That row cannot
    # finish before its creation loops do, and they are essentially the whole
    # run: 9.82 s of a 9.93 s run in the run where the phase split was taken.
    # More workers make it slower and more ranks turn every placed task into a
    # message.  (The worker figures that used to sit here -- 7.91 s at 15
    # against 10.88 s at 112 -- are from a different run set and cannot be read
    # against the 9.82 s split; the most recent campaign measured that cell at
    # 9.411 s.  The anchor belongs to the smithwaterman row.)
    #
    # Rows are banded rather than scattered because a wavefront is a pipeline:
    # only the band's top edge crosses, O(P*W) against the O(W^2) a cyclic map
    # pays.  The fill that costs is real, not negligible: the last band's first
    # row lies (1-1/P) of the way down the grid, so its place idles until
    # anti-diagonal step (1-1/P)*H of the W+H-1 -- step 7751 of 15999 at
    # places 32 and W=H=8000, 47% of the tiles -- and k separated bands per
    # place would divide that by k at k times the crossings (unmeasured).
    # Measured, cyclic was worse than the base row's own hinted banding.
    #
    # Names are created in a phase of their own, before the phase that binds
    # to them: a band's builder waits on the announcements of its own names
    # and of the band above, which is every name its tasks can reach.  A
    # chain that made each band wait for the whole band above instead is
    # portable too, but it serialises creation and the row stops scaling
    # (0.95x against 6.19x over 1..8 nodes, same input, interleaved).
    #
    # This row is a SCALER, so it is calibrated against the restructured
    # tier's 120 s target.  ds comes from
    # the window (the anchor goes as L^2.2: 7.9 s at 200k, 40.1 s at 400k,
    # 92.7 s at 600k, 178.5 s at 800k) and the tile then sets the width.
    # The anchor is the tightest of the three coherence arms; at 800,000 they
    # run 178.5 / 163.6 / 155.6 s holding 106 / 88 / 106 GB, so the window
    # decides the size and the node's memory has room to spare.
    #
    # places is the ownership decomposition, not the width knob: the width is
    # the tile grid, and 800,000 at tile 100 is 6.4e7 tiles against the 13,824
    # a 4x-slack DAG rule asks for.  places follows the SPMD rule instead --
    # one persistent unit per node, each owning a partition -- fixed at the
    # largest geometry (32) and packed by placeRank at smaller node counts, so
    # the decomposition does not move with the sweep.  It is not a performance
    # choice: at one node the fastest value is 4 (12.9 s), not 32 (14.4 s).
    # It IS a correctness precondition: places are contiguous row bands reached
    # by a linear map, so every rank owns rows exactly when places lies between
    # the rank count (the map is onto) and the row count H+1 (no band is
    # empty).  The program checks both bounds and refuses the run otherwise, so
    # a roster that sets places below the node count -- or above the grid --
    # fails loudly instead of idling nodes.  Above 32 nodes this argument must
    # be raised to match.
    #
    # The width the base row could not reach, this one does.  A wavefront
    # needs W^2 tasks to offer width W, and distributing the creation does not
    # reduce the count, so the tile is what sets it: tile 100 puts the
    # wavefront at 2.31x the largest geometry's workers -- past the machine
    # with room to spare -- where the base row's own window left it at 0.41x,
    # short of the machine.  A finer tile is not available to buy more: at
    # 800,000 a tile of 50 quadruples the tiles and passed 417 GB before it
    # was stopped, against tile 100's 106 GB, past what a node has.
    #
    # The answer is pinned by agreement between two independently built graphs
    # (this row and the port it re-implements) rather than by a sequential
    # reference: 800,000 x 800,000 is 6.4e11 cells.
    args: ['100', '100', '{repo}/datasets/smithwaterman/string1-swd.txt', '{repo}/datasets/smithwaterman/string2-swd.txt', '{repo}/datasets/smithwaterman/score-swd.txt', '32']
    fixtures: ['{repo}/datasets/smithwaterman/string1-swd.txt', '{repo}/datasets/smithwaterman/string2-swd.txt', '{repo}/datasets/smithwaterman/score-swd.txt', '{repo}/datasets/smithwaterman/string1-mid.txt', '{repo}/datasets/smithwaterman/string2-mid.txt', '{repo}/datasets/smithwaterman/score-mid.txt']
    restructured_from: smithwaterman

