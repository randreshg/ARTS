  Stencil2D_intel_channelEVTs:
    binary: Stencil2D_intel_channelEVTs
    hinted: false   # tried, and no hinted map beats the base: the tile map is already the minimum-cut factorisation at every node count, and the one movable object -- the halo send buffer, re-homed on its reader -- is neutral to 2 % better at 2-4 ranks and 8-12 % slower at 8 in every family (the push lands on the producer's critical path, and the crossing share only grows with the node count), so the base's own map is the best hinted map and the base stands in for the tier; the layer stays in source behind its guard
    class: spmd
    provenance: '2-D stencil over channel events (Intel OCR app)'
    marker: 'Computed L1 norm'
    scalar_re: 'Computed L1 norm\s*=\s*([\-+0-9.eE]+)'
    tolerance: 1e-06
    # The three arguments are the global tile edge, the tile count and the
    # timestep count, all-or-nothing (any other count is now rejected with a
    # usage line instead of silently running the defaults).
    #
    # The tile count is the width.  This is a spawn-and-join SPMD program --
    # all NR tiles are forked in one loop and each is then a serial chain of
    # NT+1 rounds -- so the instantaneous frontier is exactly NR and the rule
    # is an INTEGER multiple of the widest geometry's worker count:
    # 13,824 = 4 x 3,456 (32 nodes x 108 workers).  The edge is kept a
    # multiple of lcm(NR_X,NR_Y) = lcm(108,128) = 3,456 so every tile is
    # identical -- a non-multiple is legal (a remainder just makes some
    # blocks one point wider) but leaves the tiles unequal -- which is why
    # the rungs are 3,456 apart.
    #
    # The timestep count is the published height (100 in every upstream run
    # script; the source default is 10 and 400 is a sweep member).  Rounds are
    # real halo exchanges, not repetition padding, so the EDGE carries the
    # calibration.
    #
    # This row strong-scales: 31.11 / 21.39 / 11.93 / 8.86 s over 1/2/4/8
    # reduced-geometry ranks (3.51x) at `5184 13824 400`, ferrari 15w+1p,
    # logs/adhoc/2026-08-31-base-calib/track.txt:143.  Sizing is anchored on
    # the one-node 108w+4p geometry instead: `31104 13824 400` ran
    # 134.0 / 127.6 / 154.0 s across the three families at 48.5 GiB RSS, and
    # the next rung 34,560 overshot at 162.8 / 171.0 / 155.7 s.  Payload is
    # ~16*NP^2 bytes (15.07 GiB at 31104) and that one RSS measurement is
    # 3.22x it, most of the residual being NP-independent object overhead.
    # The L1 norm is a property of the stencil and of the height alone, so
    # the pin does not move with the edge.
    expect: '202.000000000000'
    # Anchor at these arguments, one node of 108 workers, INV x WB: 119.2 s,
    # 117 GB resident; target 100 s (the base tier scales). EXCL x RETAIN 121
    # GB resident, VAL x WT 121 GB resident.
    expect_args: ['51840', '13824', '100']
    args: ['51840', '13824', '100']
    unordered_writes: 'four unordered halo receives RW DBK_xIn (stencil_2d.c:701, :717, :764, :778)'

  stream:
    binary: stream
    class: spmd
    provenance: 'STREAM memory-bandwidth benchmark (McCalpin)'
    marker: 'Solution Validates'
    # The app validates itself, and the scalar is now a REDUCTION: each chain
    # checks its own final slice against the closed form of the kernel
    # recurrence at a relative 1e-13 and returns the count it verified;
    # finalize sums the counts.  So the pin is still "the whole array
    # validated" -- every element is counted -- but no task holds more than one
    # chain's slice and the join carries 16 bytes per chain instead of the
    # whole result.  A wrong element makes the count smaller and prints
    # "Solution FAILED Validation", which this pattern does not match.
    #
    # a[0] cannot carry the pin: it is a per-element recurrence with no
    # reduction, so it depends on the sweep count and nothing else (identical
    # at every array size and width).  It rides along as an extra scalar, and
    # both rows now print it in the same form, so the pair is comparable.
    scalar_re: 'Solution Validates: all (\d+) elements'
    scalar_kind: int
    extra_scalars:
      a0: 'STREAM_RESULT a\[0\] = ([0-9.eE+-]+)'
    # Width is the sweep rule's, not a performance choice: SPMD, so 1x the
    # persistent units the largest geometry provides (32 nodes x 108 workers =
    # 3456 chains), and the knob is unconstrained -- any chain count divides the
    # problem, so 2x (6912) is reachable if the spawn-and-join reading is
    # imposed.  The frontier is numThreads..2*numThreads and never falls below
    # numThreads before the single join.
    #
    # The sweep count is the PUBLISHED default (1000, the OCR port's; McCalpin's
    # own canonical is 10).  The row previously carried 100 as a declared
    # deviation, on the grounds that the array cannot be used as the dial: one
    # array per chain crosses 512 KiB between 65,000 and 66,000 elements and the
    # anchor moves 14.0 s -> 48.9 s across that single step, with resident set
    # FALLING 14.7 -> 10.2 GB (an allocation-path signature; a core's L2 and the
    # allocator's large-object limit are both 512 KiB and this cannot tell them
    # apart).  That cliff is still there and still constrains the size -- what
    # changed is that the height is no longer where the calibration is taken,
    # and that the base tier's multinode cells are ~10x longer at 1000 sweeps
    # than at 100.  Size against the 2-node base cell, not the 1-node anchor.
    #
    # Memory: 8*233280000 bytes live for the whole run plus 32*workers*(233280000/3456)
    # transient and allocator retention behind 4*1000*3456 DB creates; measured
    # resident has run ~3x the live set.  Node-count invariant; the 1-node cell
    # is the peak.
    # Anchor at these arguments, one node of 108 workers, INV x WB: base 54.8
    # s / hinted 52.9 s, 6 GB resident; target 60 s (base anti-scales, hinted
    # scales).
    expect: '233280000'
    expect_args: ['233280000', '3456', '1000']
    args: ['233280000', '3456', '1000']
    # The source carries a placement layer (OCR_APP_OPTIMIZED_PLACEMENT).  It
    # is now ONE index map -- place(chain) = chain % pdCount -- applied to every
    # task AND every datablock of a chain: the chain root, its FINISH loop, the
    # four kernels of every sweep, the per-chain check, the initial array and
    # every array a kernel creates.  Before, it pinned only the kernels to the
    # rank they were created on, left the chain root and every datablock
    # unhinted, and therefore borrowed its coverage from two CMake defaults
    # (ARTS_NOHINT_EDT_PLACEMENT=ROUNDROBIN, ARTS_NOHINT_DB_HOME=CREATOR);
    # under the equally supported CREATOR/ROUNDROBIN settings the same guard
    # would have funnelled every chain onto one rank.  Per-place chain counts
    # are now exactly 3456/N at every rank count that divides 3456 (1728 at 2,
    # 432 at 8, 108 at 32 for 3456=3456), by the program.
    #
    # Measured before that rework, at a reduced size and single repetitions:
    # the base tier is 67x its own one-node time at two nodes and ~65x the
    # hinted tier at eight.  Budget the base tier's multinode cells accordingly
    # or expect them to time out -- that is the tier exhibiting its structure,
    # not a defect to mask.
    #
    # Disclosures (all in-source, all conformance-class under R5/R9): the triad
    # slot order is corrected against the 2016 port, which wired add_output into
    # slot 1 and evaluated a = add + scalar*scale rather than McCalpin's triad;
    # SCALAR is 0.42 (McCalpin's own MPI-STREAM value) rather than the port's
    # 3.0, which overflows long before 1000 sweeps; sizes and GUIDs travel
    # through paramv rather than file-scope statics; and verification is the
    # per-chain reduction described above rather than a single-task sweep over
    # the whole result.
    hinted: true    # kept: pinning the array block's chain to its creating rank, 46-124x faster than the base at 2-8 ranks
    restructured_as: stream_dist
    unordered_writes: 'mainLet''s creator hold on db_a outlives the satisfy, and the loop holds db_a RW while wiring its own triad (stream.c:414, :335)'

  stream_dist:
    binary: stream_dist
    class: spmd
    provenance: 'STREAM; the port''s persistent-datablock variant + an index affinity map'
    marker: 'Solution Validates'
    scalar_re: 'Solution Validates: all (\d+) elements'
    scalar_kind: int
    extra_scalars:
      a0: 'STREAM_RESULT a\[0\] = ([0-9.eE+-]+)'
    # PROVENANCE, stated because the paper must not claim more than this is:
    # the 2016 OCR port shipped TWO variants side by side -- single assignment
    # (every kernel creates its output array; that is the stream row) and
    # persistent per-chain arrays written in place.  This row is the second
    # variant, conformance-adapted exactly as the first, plus one addition of
    # its own: an explicit place(chain) = chain % pdCount affinity map on every
    # EDT and every datablock.  It is not an ARTS-side redesign.
    #
    # The decomposition is therefore IDENTICAL to the row it re-implements --
    # the same chains, the same slice, the same four kernels, the same K-deep
    # pipeline, the same single join -- and the axis it isolates is
    # allocate/first-touch/free churn (4*1000 datablock create/destroy pairs per
    # chain) against persistence (3 blocks per chain for the whole run).  Its
    # datablock count is node-count AND sweep-count invariant: 4*3456.
    #
    # Same arguments as the row it re-implements, and the two now print the same
    # validation line AND the same extra-scalar line in the same format, which
    # is the check that they are one application.
    #
    # Memory: 24*233280000 bytes, flat for the whole run.
    # Anchor at these arguments, one node of 108 workers, INV x WB: 13.2 s, 20
    # GB resident; target 120 s (restructured).
    # Off the 0.8-1.2x band: same arguments as the row it re-implements by
    # design (the paired churn-versus-persistence exhibit).
    expect: '233280000'
    expect_args: ['233280000', '3456', '1000']
    args: ['233280000', '3456', '1000']
    restructured_from: stream
    unordered_writes: 'mainLet''s creator hold outlives the first loop''s start, and the loop holds a/b/c while starting copy/scale (stream_dist.c:425-427, :359-363)'


  task_priorities:
    binary: task_priorities
    class: task
    provenance: 'OCR priority-scheduler test program'
    kind: toy
    marker: 'Hello from 9'
    scalar_kind: bool
    args: []
    default_enabled: false

  tempest:
    binary: tempest
    class: task
    provenance: 'Tempest neighbour exchange (Intel OCR app, B. Pawlowski)'
    marker: 'CROSS-CHECKING NEIGHBOR DATA EXCHANGE'
    scalar_re: 'CROSS-CHECKING NEIGHBOR DATA EXCHANGE\*(?:[ \t]*\n|[ \t]+|[A-Za-z*][^\n]*\n)*-?\d+[ \t]+-?\d+[ \t]+-?\d+(?:[ \t]*\n|[ \t]+|[A-Za-z*][^\n]*\n)*-?\d+[ \t]+-?\d+[ \t]+-?\d+(?:[ \t]*\n|[ \t]+|[A-Za-z*][^\n]*\n)*-?\d+[ \t]+-?\d+[ \t]+(-?\d+)'
    scalar_kind: int
    # The scalar is patch 0's received SE neighbour, i.e. 5k^2+1 -- a pure
    # function of k, invariant in duration, node count and runtime.  The pin
    # only fires when expect_args equals args, so the two move together.
    # Anchor at these arguments, one node of 108 workers, INV x WB: base 20.1
    # s / hinted 19.3 s, 10 GB resident; target 20 s (hinted kept, flat).
    expect: '233281'   # 5k^2+1 at k=288, the SE neighbour of patch 0
    expect_args: ['216', '100']
    # Both dials are arguments: k sets how many patches there are (6k^2, each
    # the same size) and duration how many timesteps they take.  duration stays
    # at the shipped default of 100 and the window is reached with k alone.
    # Width follows as a consequence: this is a dataflow frontier, not a
    # fork-join -- a generation creates only its own successor, there is no
    # barrier, and the shim ignores the channels' maxGen -- so all 6k^2 patch
    # chains are runnable at once and the largest geometry's 3456 workers are a
    # floor with no ceiling.  A k that is a multiple of 24 makes 6k^2 an exact
    # multiple of 3456 and keeps the placement map's balance exactly 1.000 at
    # 2/4/8/16/32 ranks.
    #
    # The one-node anchor above is taken at duration=100, on the current tree;
    # every previously quoted anchor at duration=1900 predates it and does not
    # carry over.  The init/steady split still matters for a trend: init is
    # O(k^2) with no duration divisor and grows with the size knob while the
    # steady term does not.
    args: ['216', '100']
    hinted: true    # kept: the min-cut patch map completes at 2-8 ranks where the base is censored
    restructured_as: tempest_dist
    # No multinode cap of its own.  This row's whole result is how badly it
    # degrades across a node boundary, and a cap shorter than that degradation
    # records it as a timeout instead of measuring it.  The profile's budget is
    # what bounds a runaway.  (The base/hinted four-node pair previously quoted
    # here belonged to different arguments than this row's and has been dropped
    # rather than re-labelled; it comes back from the re-take.)

  tempest_dist:
    binary: tempest_dist
    class: task
    provenance: 'Tempest neighbour exchange (Intel OCR app, B. Pawlowski); rank-pair batched halo'
    marker: 'CROSS-CHECKING NEIGHBOR DATA EXCHANGE'
    scalar_re: 'CROSS-CHECKING NEIGHBOR DATA EXCHANGE\*(?:[ \t]*\n|[ \t]+|[A-Za-z*][^\n]*\n)*-?\d+[ \t]+-?\d+[ \t]+-?\d+(?:[ \t]*\n|[ \t]+|[A-Za-z*][^\n]*\n)*-?\d+[ \t]+-?\d+[ \t]+-?\d+(?:[ \t]*\n|[ \t]+|[A-Za-z*][^\n]*\n)*-?\d+[ \t]+-?\d+[ \t]+(-?\d+)'
    scalar_kind: int
    # The scalar is the SE neighbour of patch 0 = 5k^2 + 1, pure topology, so it
    # is invariant in node count, runtime and duration -- and identical to what
    # the base row prints, which is why both rows pin the same answer.
    # expect_args must match `args` element for element or the pin never fires.
    # Anchor at these arguments, one node of 108 workers, INV x WB: 42.3 s,
    # 127 GB resident; target 120 s (restructured).
    # Off the 0.8-1.2x band: memory-capped: the resident set grows with k^2
    # (127 GB at k = 864); the rung that would reach the target exceeds the
    # per-node cap.
    expect: '3732481'                    # 5k^2+1 at 864: 11521 at 48, 2592001 at 720
    expect_args: ['864', '100', '512']  # the FULL arg list, identical to `args`
    #
    # The same exchange and the same cross-check as the row it re-implements, so
    # the same answer, and the same number of exchanges: the base forwards on
    # generations 0..duration-2 and its last generation only reads, and this row
    # performs duration rounds of which the last one only delivers.
    #
    # Placement had already done all a hint can do -- remote acquires 74.93% ->
    # 1.32%, what crosses 14.4 GB -> 265 MB, under half a percent of the edges
    # left crossing -- and the row still lost 2.75x across the first node
    # boundary.  What remains is not the size of the cut but the price of
    # crossing it: a patch edge bounces one datablock RW between its two
    # patches, so a crossing edge migrates exclusive ownership twice a
    # timestep, and the payload is eight bytes against 349 bytes of protocol
    # per remote acquire.  This row batches everything a rank owes a peer into
    # one block per round.  The same stamps cross the same number of times.
    #
    # Placement cannot reach it because the dependence graph is a mesh, not a
    # tree: a divide-and-conquer program's subtrees are independent, so its
    # edges are crossed once, while every patch here talks to eight neighbours
    # every timestep and any partition leaves a cut that is paid `duration`
    # times.
    #
    # The decomposition is the rank's own and nothing in a round is per-rank
    # serial: ownership is a box of the k x 6k patch strip, cut again into
    # tiles; a tile computes its patches' geometry once at setup, opens their
    # tasks every round, and delivers every stamp that stays inside it.  The
    # rank's single apply sees only what left a tile -- the perimeter, not the
    # patch count -- and creates one apply plus one spawn task per tile, a count
    # bounded by the `groups` knob rather than by the problem.
    #
    # duration keeps the shipped default and k reaches the window.  Width is
    # 6k^2 tasks per round, an exact multiple of the largest geometry's 3456
    # workers whenever 24 | k; the third argument (`groups`, default 512) is the
    # grain knob.  Size and anchor are measured on this structure (above); the
    # previous numbers measured work that is gone, and the node-count trend is
    # what a campaign sweep takes.
    args: ['864', '100', '512']
    restructured_from: tempest
    unordered_writes: 'applyEdt(t) wires the group view RW into apply(t+1) while holding it (tempest_dist.c:964 vs :860)'

  testlibs:
    binary: testlibs
    class: task
    provenance: 'OCR C-library fixture'
    kind: toy
    marker: 'Testing strlen'
    scalar_re: 'Testing strlen of \w+ is (\d+)'
    scalar_kind: int
    expect: '10'
    expect_args: []
    args: []
    default_enabled: false

  triangle:
    binary: triangle
    class: task
    provenance: '14-peg puzzle solution count (Intel OCR app, D. Scott)'
    marker: 'final count\s+\d+'
    scalar_re: 'final count\s+(\d+)'
    scalar_kind: int
    # One 8-row board searched once (rows generalizes the author's 5-row
    # puzzle; depth truncates its tree; rounds stays 1 — the graph is the
    # dial, not repetition).  The pin is the count at these exact arguments,
    # reproduced by exhaustive enumeration of the search and cross-checked by
    # consensus like every non-analytic scalar.  No in-program oracle fires
    # here: the 29,760 literal and the generator-vs-author cross-check are
    # both author-board gates.
    #
    # The base tier anti-scales while the hint layer scales, so the size
    # targets 60 s at one node — the hint layer is a no-op at one place, so
    # the two still share this anchor.  Depth is the size knob left once
    # the board is fixed, and it moves the anchor by more than an order of
    # magnitude a step (ferrari-era: depth 8 was 10.2 / 18.9 / 13.9 s across
    # the three families and depth 9 was 193.7 s), so the lattice is sparse
    # and there is no rung between them.
    #
    # Disclosed adaptations to the published program (all conformance or
    # contract fixes, none touching the compute-phase decomposition):
    # the shared EW solution counter became a per-node count block summed by
    # the return path (ARTS maps EW to RW, so the published increment loses
    # updates); the initializer acquires the jump table RW so remote readers
    # see it; depth/rounds/rows are added knobs with loud validation
    # (out-of-range aborts instead of silently running another instance);
    # every per-node datablock is destroyed at its last reader (the round's
    # own starting board and jump table are knowingly retained — 3.3 KB per
    # round — because no event in the program orders the last reader's
    # release before the round's end); completion events are COUNTED for
    # every backend.  The hinted layer's scatter depth is derived from the
    # rank count (4 + ceil(log10(nranks))), so base and hinted keep identical
    # argv and the map covers 2/4/8/16/32 ranks with max/mean <= 1.13,
    # min/mean >= 0.91 and no idle rank.
    # 8 is the same list in all three fields: the pin applies only to the
    # arguments it was enumerated for.
    # Anchor at these arguments, one node of 108 workers, INV x WB: base 18.6
    # s / hinted 19.0 s, 4 GB resident; target 60 s (base anti-scales, hinted
    # scales).
    # Off the 0.8-1.2x band: the size ladder steps by 8x; the rung above lands
    # far over the band.  The local trend roster runs depth 8 on the 7-row
    # board (4.95 s at one trend node): depth 7 is a 0.66 s latency floor that
    # cannot carry a verdict, and rows barely move the time at that depth.
    expect: '19979938'            # '19979938' for ['8','1','8'], '1278558' for ['7','1','8']
    expect_args: ['8', '1', '8']
    args: ['8', '1', '8']
    hinted: true    # kept: scatter-then-pin over the board key, ~200x faster than the base at 2-8 ranks
    unordered_writes: 'launch_round wires three freshly created blocks RW into realmain without releasing them (triangle.c:474-479, :484-487)'

  xeonNumaSize:
    binary: xeonNumaSize
    class: task
    provenance: 'OCR allocation-size test program'
    kind: toy
    marker: 'DONE!'
    scalar_kind: bool
    args: ['-dcpu']
    default_enabled: false
    unordered_writes: 'the creating task hands the block on in RW without releasing it (xeonNumaSize.c:691, :726)'

  XSBench_intel:
    binary: XSBench_intel
    # Master/Worker over a task-parallel map: one central producer chain
    # spawns every lookup as a transient task; the SPMD member of the pair
    # is the sharedDB sibling — same algorithm, two implementation
    # structures, which is the whole ablation.
    class: mw
    provenance: 'XSBench Monte Carlo neutron-transport proxy (ANL)'
    marker: 'Lookups/s'
    scalar_re: 'XSBench grid checksum:\s+(\d+)'
    scalar_kind: int
    expect: '3906729473756589834'
    expect_args: ['-s', 'large', '-g', '96', '-l', '2764800', '-b', '6912']
    # The compute plane is wire-bound and mildly anti-scaling in every arm
    # (each lookup is a spawned three-task chain whose aggregator fans in
    # one nuclide-grid DB per nuclide of the drawn material), so this is an
    # exhibition row, and both tiers anti-scale — the hint layer is a no-op
    # at one place, so the two share an anchor and -l is sized to the
    # anti-scale-clamped 20 s target: base 23.6 s / hinted 22.2 s at one node,
    # ~4.4 GB resident, the slower of which is what the window has to hold.
    # The grid checksum sums the IEEE-754 bit patterns of the unionized
    # energy grid.  The grid is generated by N_i tasks, one per nuclide grid
    # DB, from a pure function of (stream, (nuclide, gridpoint, field)) — no
    # generator state is carried between elements, so the table does not
    # depend on the task, place or node count, and the sum, being exact
    # integer addition, does not depend on completion order either.  The value
    # therefore moves only with -s/-g and the pin survives -l and -b changes.
    # The restructured tier (XSBench_intel_dist) includes the SAME generator
    # header and prints the SAME line as an extra scalar, so at equal -s/-g
    # the two rows must print the same number: that equality is the row pair's
    # cross-tier oracle, and a disagreement is a table built differently, not
    # a tolerance question.  Pin both from the same first successful cell.
    #
    # DISCLOSED, with every published reference point named.  Grid
    # resolution: the code default and the DOE reference are both -g 11303;
    # the app suite's own strong-scaling table publishes -g 1130 (ss_small,
    # ss_medium) and -g 11303 (ss_large).  This row runs -g 96 — 11.8x below
    # the tightest published tier.  The reduction is FORCED: at 11303 the
    # plane is U = 4,012,565 gridpoint DBs and init issues U*(4+n_isotopes)
    # ~ 1.44 G dependence registrations, which no campaign geometry holds.
    # Its DIRECTION is toward the control-plane-dominated end — i.e. toward
    # this row's own conclusion — because it shrinks each nuclide grid from
    # 542 KB to 4.6 KB while leaving the wiring plane intact; the paper
    # states the direction, not only the value.
    # Lookup count: this row runs -l 2,000,000, which is INSIDE the suite's
    # published range (2x ss_medium's 1,000,000, 13% of the DOE reference's
    # 15,000,000); the port's own default is 15,000 and its Makefile runs
    # 10,000.  The SPMD sibling on the same physics runs 32 instances of
    # 320,000,000 — 10.24 G aggregate, ~683x the 15 M reference; that gap
    # between two decompositions of one benchmark is what the pair exists to
    # show.
    # -s large is the benchmark's canonical configuration (355 isotopes,
    # 321-nuclide fuel fan-in; small is its reduced fresh-fuel subset) and
    # changes no structure — one-node rate is identical (261K lookups/s).
    # What large multiplies is init's dependence registrations
    # (n_isotopes^2 x g), which is the other half of why -g compensates.
    # -b is the in-flight window (lookup chains per sync batch) — this
    # variant's width knob.  Master/Worker width rule, calibrated once at
    # the largest geometry: the pool is the work count (-l, already far
    # above the worker count) and the WINDOW covers the machine exactly —
    # 3456 = the 32x108 campaign's total workers, an exact integer multiple
    # dividing evenly at every node count (the trailing batch of 2,432
    # does too) — so the row's anti-scaling is attributable to the
    # program's central serial production, never to an under-provisioned
    # window.  Measured throughput is insensitive to the width (within ~7%
    # across 1024..13824), which is itself evidence that production, not the
    # window, binds.  The offered window is not the realized frontier: one
    # spawner emits a chain every ~4 us, so the in-flight count is single-
    # to double-digit — this row is never described as filling the machine.
    # At these args the off-plane val_*_nocomb ablation twins are expected to
    # censor at every multinode geometry on both profiles.  That is the
    # sizing rule working as written (the twins are measured, never the
    # sizing reference), not a mask.
    # -l and -b are ORCHESTRATOR-SIZED placeholders; the values below are the
    # current calibration.  -l <L>: 2,764,800.  -b <W>: 6912 = 2x the 32x108
    # campaign width, an exact integer multiple that divides L evenly with no
    # trailing batch at any node count; the 1x point -b 3456 divides just as
    # evenly and is equally compliant within the measured width ladder
    # (1024..13824 moves cells <=7%) -- that choice must be made BEFORE the
    # campaign starts.  -s/-g are NOT placeholders: expect is pinned to them.
    args: ['-s', 'large', '-g', '96', '-l', '2764800', '-b', '6912']
    hinted: true    # kept: the chain-colocation map is 1.8-3.8x faster than the base at 2-4 ranks and completes at 8 where the base is censored
    # Hinted layer (hint arguments only, all under OCR_APP_OPTIMIZED_PLACEMENT,
    # every constructor a no-op at one PD so base == hinted at the anchor):
    # nuclide grids, gridpoint leaves and each leaf's writer EDT at i % N;
    # material tables at j % N; the nine compute-phase handle blocks (a
    # lookup acquires eight of them, the ninth is the batch spawner's)
    # strided at floor(k*N/9) so their homes cover the whole rank space; and
    # each lookup chain's two spawned links placed at the home of the one
    # gridpoint leaf that chain reads twice (idx % N, idx already in scope at
    # the hint site).  Link 1 stays round-robin — that is the exact balance
    # across lookups.  Derived imbalance for links 2/3 (replay of the
    # generator and the binary search over the real grid, b=3456, 60
    # batches, at 2/8/16/32 ranks).  By EDT count: worst batch
    # 1.047/1.127/1.194/1.380, cumulative 1.014/1.045/1.045/1.078.  Weighted
    # by the aggregator fan-in num_nucs[mat], which is the chain's real cost:
    # worst batch 1.093/1.368/1.470/1.766, cumulative
    # 1.014/1.045/1.062/1.081.  The weighted per-batch column is dominated by
    # the fan-in's own heavy tail (4..321, mean 55.3): an exactly
    # count-balanced control map still gives 1.162/1.179/1.207/1.241 there.
    # The cumulative column is the operative one because the row is
    # production-limited (one spawner, a chain every ~4 us, so a batch's b
    # chains are never co-resident and each barrier is spawn- not
    # load-bound); on it the map is close to 1 at every geometry.
    # <repin> the hinted verdict: the previous (creator-pinned) map won only
    # 1.06-1.08x on [E2E] while showing 1.15-1.24x on the app's compute
    # timer.  The current map must be judged base-vs-hinted at these args,
    # >=2 geometries in ONE campaign, all three families, on [E2E], with the
    # compute timer recorded so the init/compute split is visible.
    # Restructured tier: XSBench_intel_dist, the same per-lookup chain over
    # a lookup range cut into places, each with its own producer and its own
    # replica of the table.  The SPMD sibling XSBench_intel_sharedDB stays
    # an independent peer at its own instance: it replaces the chain with an
    # inline loop, so it is a different program, not this row's restructure.
    restructured_as: XSBench_intel_dist
    unordered_writes: 'the uEnergy grids are created and never released before FNC_init_uEnergy_i takes them RW (Main.c:545-546, :785)'

  XSBench_intel_dist:
    binary: XSBench_intel_dist
    # Restructured decomposition of the Master/Worker row: the lookup range is
    # cut into places, each owning a share of the lookups, one producer over
    # that share and its own replica of the table, every object of a place
    # created at (place % PDs).  The per-lookup three-task chain is kept
    # unchanged -- the row exists to show that chain's cost once the two
    # things that made the sibling anti-scale are gone: the single central
    # producer and the machine-wide fan-in on one rank's copy of the table.
    class: mw
    provenance: 'XSBench Monte Carlo neutron-transport proxy (ANL); distributed-places rewrite'
    marker: 'Lookups/s'
    scalar_re: 'XSBench lookup checksum:\s+(\d+)'
    scalar_kind: int
    extra_scalars:
      grid_cksum: 'XSBench grid checksum:\s+(\d+)'
    # The scalar is computed from the LOOKUP RESULTS, not from the grid: each
    # aggregator quantizes its 5-vector to integers (scale 1024), weights the
    # sum by the lookup index and folds it into its slot's accumulator; the
    # place digests are summed once.  Integer accumulation makes it
    # independent of completion order and of the partition, the index weight
    # makes it sensitive to which lookup produced which result, and the
    # quantization keeps it stable against last-bit differences in the
    # floating-point kernel.  It therefore depends on -s/-g/-l only and is
    # invariant under -p, -b and the node count.
    # The grid checksum is the parent row's voted scalar, printed here once by
    # the union task of place 0 over that place's unionized grid — same domain,
    # same arithmetic, and every replica holds the same table.  It is carried
    # as an extra scalar rather than the voted one because this row's answer is
    # its lookup checksum; its purpose is that the two tiers of the pair have
    # one value that MUST agree at equal -s/-g, whatever -l/-p/-b, the node
    # count, the arm or the runtime.
    #
    # DISCLOSED (R9, cross-tier), what remains after the base row's conversion:
    # nothing in the data.  Both tiers generate from one shared header
    # (refactored/ocr/xs_index_rng.h) — the nuclide grids one task per grid on
    # the grid stream at the flattened (nuclide, gridpoint, field) index, the
    # material concentrations on the concentration stream at the (material,
    # element) index — so the two run the identical instance value for value,
    # neither tier's init is serial where the other's is parallel, and no part
    # of a measured gap between them is a parallel-init advantage.  One
    # difference stands and is deliberate: the tiers vote on different scalars
    # (the grid there, the lookup results here — the parent row discards its
    # lookup results, so it has nothing else to vote on).  The value that is
    # comparable across the two is the grid checksum, which both now print.
    # Anchor at these arguments, one node of 108 workers, INV x WB: 118.3 s,
    # 61 GB resident; target 120 s (restructured).
    expect: '5139514524579690947'
    expect_args: ['-s', 'large', '-g', '96', '-l', '480000000', '-p', '384', '-b', '36']
    # -s large -g 96 track XSBench_intel: the pair runs the identical instance
    # shape and only the decomposition differs (the drawn values differ -- see
    # the R9 disclosure above).
    # -p is this row's parallelism knob and -b its per-place window; offered
    # width is p*b lookup chains.  For class: mw the width check demands a
    # whole multiple of the campaign's 3456 workers, not merely a value above
    # it, so p*b must be an exact multiple (>= 2x preferred): 32x108 = 3456,
    # 64x108 = 6912, 128x108 = 13824 all qualify, while 32x200 = 6400 is above
    # the floor and is refused.  p, not b, is what fills the machine: a place's producer emits a
    # chain every few microseconds, so it keeps only (chain latency /
    # emission cost) chains running and p must be several times the node
    # count.  Memory is the counterweight -- every place holds a full replica,
    # p * n_isotopes * gridpoints * (4*n_isotopes + 56) bytes, i.e. 50.3 MB
    # per place at -s large -g 96, all of it on one node at the 1-node cell
    # (p=128 -> 6.4 GB; the 190 GB budget is reached near p=3700).
    args: ['-s', 'large', '-g', '96', '-l', '480000000', '-p', '384', '-b', '36']
    # width_max: <p * b>   # add once -p and -b are sized; it is exactly the
    # product, since a place's batch is its whole standing offer and places
    # never synchronize with one another.  It must be a whole multiple of the
    # profile's total workers (Selection._check_width refuses anything else
    # for an mw row).
    restructured_from: XSBench_intel

  XSBench_intel_sharedDB:
    binary: XSBench_intel_sharedDB
    class: spmd
    provenance: 'XSBench (ANL); shared-datablock form'
    # Printed by the throughput helper after the checksum line, so a matched
    # marker implies the scalar is present.
    marker: 'Workload\s+\(unit\):'
    # The scalar is now a computed digest of the lookup phase, not the -l echo
    # it used to be.  Every compute task sums |macro_xs[0..4]| over its own
    # lookups in its own order and adds ONE magnitude-quantized contribution
    # to its chain's u64 digest; summaryEdt folds the chains by integer add,
    # which is order-independent, so the value does not depend on completion
    # order, on which worker ran a chain, or on the node count.
    # SENSITIVITY, stated so it is not over-read: the quantum keeps 20 mantissa
    # bits of a whole CHUNK's sum (5*CHUNK_SIZE = 5000 addends at the campaign
    # grain), so the digest moves only on a divergence above roughly 2^-20 of
    # that chunk sum -- order 0.5% of one lookup's contribution -- and is blind
    # below it.  It detects gross corruption, a wrong dataset, a dropped or
    # duplicated range, and any node-count-dependent result; it is NOT a
    # last-bit oracle.  The chunk-sum quantum is what lets three separately
    # built runtimes print the same number; per-lookup quantization would give
    # 2^-20-per-lookup sensitivity for about one frexp per lookup and is
    # recorded as an open choice, not taken.  It covers instance 0 -- all of its chains, all of its lookups,
    # the whole kernel.  Instances 1..31 are not in the printed value: bringing
    # them in needs a second cross-rank collective, and this row's identity is
    # that it has exactly one cross-rank edge.  A stalled instance still cannot
    # hide (the perf-timer ALLREDUCE gates shutdown on every instance).
    scalar_re: '(?m)^\s*(?:\[\d+\]\s*)?XS Checksum:\s*(?:\[\d+\]\s*)?([0-9]+)\s*$'
    scalar_kind: int
    # A digest is exact or it is nothing; the comparator coerces to double, so
    # ask for equality rather than the default 1e-9 relative.
    tolerance: 1e-18
    # <repin>: both the scalar AND the generated dataset changed this cycle
    # (see the disclosures below), so no earlier value transfers, and the
    # anchor must be re-derived as well.  The checksum is a pure function of
    # (-s, -g, -l, -t) and of nothing else -- not of -p, not of the node count
    # -- so the pin is checkable in seconds on one node:
    #     -s small -g 5 -l 4000 -t 4 -p 4      (N_i=68, U=340, G=1)
    # The same number must come back at -p 8, at 1/2/4 nodes, on all eight
    # arms, on nocomb, on xsocr and on ocr-vx.  A difference between node
    # counts is a coherence or placement defect; a difference between runs at
    # one geometry is a race.  `Lookups:` still echoes -l and must NOT equal
    # the checksum.
    # Anchor at these arguments, one node of 108 workers, INV x WB: 98.5 s, 9
    # GB resident; target 100 s (the base tier scales).
    expect: '6347150029948'
    expect_args: ['-s', 'large', '-g', '96', '-l', '176000000', '-t', '216', '-p', '32']
    # Strict sweep invariant: every logical count is literally node-invariant
    # -- 32 SPMD instances, 216 chains each, 176000000 lookups per
    # instance.  The application never names the machine: the fork's block
    # partition maps the 32 instances onto however many policy domains the run
    # has, and every campaign node count divides 32, so the packing is exactly
    # even (load imbalance 1.000 at 2/4/8/16/32 nodes) with one instance per
    # node at the calibration geometry.  The dataset is a pure function of
    # (instance index, position in the array), so the problem instance is
    # identical at every node count and in every run.
    #
    # DISCLOSED conformance adaptations (one program, one argument list -- this
    # row has no hinted tier, see below):
    #  - Data generation no longer uses the process-global rand()/srand().  It
    #    is a counter-based mixer keyed by (instance, stream, array position).
    #    The old code called srand(time(NULL)) once per instance, so EVERY RUN
    #    generated a different nuclide grid -- a strong-scaling sweep of a
    #    problem instance that was never the same twice -- and every draw went
    #    through glibc's one mutex-protected generator shared by all instances
    #    co-resident in a process: 6.5M serialised lock acquisitions at 1 node
    #    against 204K uncontended at 32, inside the measured window, shrinking
    #    with the node count for reasons that are neither the decomposition nor
    #    the protocol.  Both are gone, and the instances are now independent
    #    replicas (the instance index is part of the key).
    #  - The published VERIFICATION arm (fixed seeds, a per-lookup sprintf of
    #    seven doubles plus a string hash into a per-rank datablock held EW by
    #    every generation task) was compiled out of every target.  It is
    #    replaced by an always-on digest that costs 5 fabs and 5 adds per
    #    lookup and accumulates ONLY in each chain's own private scratch
    #    datablock -- no shared accumulator in any mode at any generation.
    #  - The unionized-grid alignment (n_isotopes^2 * g binary searches, the
    #    largest init term) used to run single-threaded inside the one init
    #    EDT: ~0.4-1.0 s per instance, CONSTANT in the node count, i.e. order
    #    15% of a projected 32-node cell, inside the measured window.  It is
    #    independent over rows, so it is now produced by A = min(-t, U) tasks
    #    over disjoint row ranges -- each writing its OWN output block, so no
    #    two tasks write one datablock and the phase is DB-WRF-valid too --
    #    and assembled by one join whose only
    #    serial term is a n_isotopes*U*4-byte copy (order 5 ms).  The join is
    #    what starts the kernel.  This is R9's explicit carve-out for XSBench
    #    grid generation; it adds A+1 EDTs, 2A DBs and 2A events per instance
    #    and doubles the init-phase memory peak (both recorded in the appdoc).
    #  - assignNuclideGridPtrs rebuilt the per-nuclide row pointers once per
    #    compute task (a pointer table cannot live in a shared datablock, so
    #    every acquirer rebuilds it) with an O(n_isotopes*g) loop carrying a
    #    runtime-divisor modulo -- 34,080 integer divisions to store 355
    #    pointers, order 0.3 ms against a task body of order 0.8 ms.  It is now
    #    the O(n_isotopes) form with identical output.
    #    NOTE, escalated rather than assumed: unlike the xs_ptrs repair below
    #    this one is a BASE-TIER PERFORMANCE EDIT to the compute phase, and it
    #    is NOT on R5's allowed list (contract fixes, destroys of leaked
    #    objects, COUNTED output events, loud validation, and what R9 covers).
    #    It is kept here on the argument that the loop is an artifact of the
    #    OCR port rather than published XSBench -- the reference OpenMP program
    #    has no per-task pointer rebuild at all -- and it applies to arts,
    #    xsocr and ocr-vx from the one source.  KEEP-OR-REVERT IS THE
    #    ORCHESTRATOR'S CALL; if reverted, only this hunk of XSutils.c changes
    #    and nothing else in the row depends on it.
    #  - A pointer field (xs_ptrs) inside the shared unionized-grid datablock
    #    was removed earlier (7599dcdb): every generation EDT re-derived it,
    #    which is a write into read-only-acquired memory, and a DB's mapping is
    #    acquire-relative.  Decomposition-identical, worth 12.6x at 108
    #    workers, applied to arts, xsocr and ocr-vx from the one source.
    #  - Loud argument validation.  print_CLI_error used to request shutdown
    #    and then RETURN, so every rejected argument and every unknown token
    #    fell through and the whole graph was built anyway.  read_CLI now
    #    returns a status and mainEdt aborts before the fork; -p is checked
    #    against ocrAffinityCount(AFFINITY_PD) (fewer instances than policy
    #    domains leaves nodes idle while the sweep looks complete); -s is
    #    length-checked before being copied into its 10-byte field.
    #  - The SIZE knob -g deviates far below the published 11303 and the
    #    RUN-LENGTH knob -l far above the published 15,000,000.  -g is capped
    #    by this decomposition, not chosen: at g=11303 one instance holds
    #    355*(355*11303)*4 = 5.70 GB of xs_grid, so 32 replicas need ~195 GB
    #    against a 190 GB per-node budget, and the alignment would be 1.42G
    #    binary searches per instance (12x the work, now spread over A
    #    producers).  g=96 is also what the sibling
    #    row runs (the set convention is that the physics table is identical
    #    and only the decomposition differs).  With the size knob capped, the
    #    window is reached with -l, which is the one deviation this row cannot
    #    avoid; it is stated here rather than argued away.
    #  - -p is the app's own SPMD REPLICATION knob, not a partition: each of
    #    the 32 instances runs the full -l against its own dataset.  Aggregate
    #    work is 32 x 176000000 lookups; it is not a 32x larger problem.
    #
    # ONE MEASUREMENT ARTIFACT AT THE TOP OF THE SWEEP, disclosed rather than
    # removed; 16n/32n must be read with it named:
    #  - LLC residency (flatters the top).  The random-access target is
    #    xs_grid, 48.4 MB per instance, and the per-node footprint is
    #    32/N * 51.7 MB: 1.65 GB / 828 / 414 / 207 / 103 / 52 MB at
    #    1/2/4/8/16/32 nodes.  Against a socket LLC of order 100 MB the
    #    workload becomes cache-resident between 8 and 16 nodes, so the
    #    per-lookup cost falls for a reason that is not the runtime.  Raising
    #    -g would remove it but is blocked by the shared-table convention and
    #    by the sibling's -g-bound init wall.  Confirm Dane's LLC at preflight.
    #    The serial init floor that used to push the other way is gone (the
    #    alignment fan-out above), so nothing now offsets this one.
    #
    # This decomposition SCALES where the Master/Worker sibling XSBench_intel
    # does not; the pair IS the decomposition ablation.  With no cross-rank
    # data traffic beyond a one-shot broadcast of argv and the single
    # one-double ALLREDUCE, the eight coherence arms have nothing to separate
    # on: this row is the plane's negative control by construction, and that is
    # what it is kept for.
    args: ['-s', 'large', '-g', '96', '-l', '176000000', '-t', '216', '-p', '32']
    # Hinted tried on paper and no map beats the base (appdoc, Placement
    # (hinted)): every create and every candidate map were enumerated from
    # the source, and each is either the base's own placement or negative.
    # The program already places every EDT and homes every DB:
    # forkSpmdEdts_Cart1D pins instance i to a policy domain by an index-range
    # block partition, every later EDT of that instance carries the affinity
    # captured in initEdt, and every NULL_HINT DB is creator-homed at its
    # reading rank.  Every freedom a hint could take is inert: the instances
    # share no DB and no event, so the instance->node map is the identity up
    # to relabelling; a per-lane DB affinity is the creator home already; the
    # two rank-0 broadcast blocks have 32 readers; the whole run's cross-node
    # flow is 124 dependence edges (~32 KB).  The base's map is the best static
    # map, so the base stands in for the hinted comparison.
    #
    # Width: P*T concurrently runnable compute EDTs (one per instance per
    # chain; generations pipeline through a COUNTED gate on the previous
    # generation's FINISH scope), with G = ceil(L/(1000*T)) sequential
    # generations per chain.  -t 216 gives P*T = 6912 = 2.0x the 32-node
    # worker count, a full margin over the -t 108 point (3456 = 1.0x, no
    # per-node headroom).  -t also sets the init fan-out A = min(-t,
    # n_isotopes*g), so raising it widens the alignment phase too and adds
    # A+1 EDTs / 2A DBs / 2A events per instance
    # (init objects only, all destroyed before the kernel starts).
    unordered_writes: 'DBK_xs_grid is creator-held into alignJoinEdt (GridInit.c:84, Main.c:770), and launchReductionEdt hands DBK_rankDataH on unreleased (Main.c:820; reduction.c:344, :454)'
