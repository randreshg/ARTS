# Application catalog: what each benchmark structurally is.
#
# Committed values are the ones that describe the application itself —
# its binary, how a completed run announces itself, how its result scalar
# is read, which versions exist, and the structural reasons a cell cannot
# run.  `args` is the calibrated strong-scaling workload and is the only
# field an experiment routinely overrides.
#
# `kind` separates what the program is from whether a campaign runs it. An
# application is one a field cites by name (graph500, HPCG, CoMD, XSBench,
# STREAM); a toy is named after an operation (globalsum, reduction,
# dbcreate) or after nothing, and exercises one runtime mechanism; an attack
# is an adversarial probe written for measurement, its knobs building each
# arm's best and worst case by construction. Upstream's own layout decides
# most of it: apps/kernels/ and apps/examples/ are toys, apps/<name>/ is an
# application.
#
# Versions: every application has `base` (as published, plus the disclosed
# structure-preserving conformance adaptations).  `hinted` exists where the
# source carries a placement hint layer (built as <binary>_hinted), and
# `restructured` where the task/data decomposition was redesigned and
# registered as its own target — the answer to a scaling problem that
# placement hints alone could not fix.

apps:
  basicIO:
    binary: basicIO
    class: task
    provenance: 'OCR file-input fixture'
    kind: toy
    marker: 'BASICIO_CHK'
    scalar_re: 'BASICIO_CHK\s+(\d+)'
    scalar_kind: int
    expect: '1'
    expect_args: ['0', '10', '{repo}/datasets/basicIO/basicIO_test.dat']
    args: ['0', '10', '{repo}/datasets/basicIO/basicIO_test.dat']
    fixtures: ['{repo}/datasets/basicIO/basicIO_test.dat']
    default_enabled: false
    unordered_writes: 'the creating task hands the block on in RW without releasing it (basicIO.c:67, :86)'

  cache_offset:
    binary: cache_offset
    class: task
    provenance: 'OCR datablock cache-offset probe'
    kind: toy
    marker: 'CACHE_OFFSET_CHK'
    scalar_re: 'CACHE_OFFSET_CHK\s+(\d+)'
    scalar_kind: int
    expect: '17592181850112'
    expect_args: []
    args: []
    default_enabled: false
    unordered_writes: 'the creating task hands the block on in RW without releasing it (cacheOffset.c:293, :307)'
  cholesky_blas:
    binary: cholesky_blas
    class: task
    provenance: 'Tiled Cholesky factorization over BLAS'
    marker: 'CHOLESKY trace'
    scalar_re: 'CHOLESKY trace\s*=\s*([0-9.eE+-]+)'
    tolerance: 1e-09
    # The tiled Cholesky, with BLAS3 kernels.  The hand-written-kernel port
    # shares this row's exact decomposition and is not registered: at eight
    # nodes the two are indistinguishable (15.48 s against 15.54 s), and its
    # slower kernels MASK what the campaign is measuring -- on the identical
    # DAG it anti-scales 1.55x where this one shows 4.97x.
    #
    # ts is the tile edge, t = ds/ts the tiles per dimension, so peak width is
    # t(t-1)/2 and the class rule -- four times the largest geometry's 3456
    # workers -- needs only t >= 167; ds = 22400 at ts = 100 gives t = 224,
    # sized past that floor to reach the one-node target below.
    #
    # INPUT: GENERATED, and generated by the tasks that own the data.  The run
    # names no input file.  mainEdt still creates each tile's datablock (that
    # serial construction is the published decomposition and stays), and one
    # generator EDT per tile -- t(t+1)/2 of them, the same tasks in both tiers,
    # differing only in the hint they carry -- takes its tile DB_MODE_RW, fills
    # it and satisfies the tile's generation 0 exactly as a loader did.  The
    # instance is A = D + v*v^T with v_i in [-1,1) and d_i in [1,2), each a
    # splitmix64-style function of the GLOBAL row index: SPD by construction,
    # condition number ~ds/3, no zero entry, deterministic and node-count
    # invariant, with no shared RNG state and no ordering between producers.
    # The entry has one definition in one header both programs include, so
    # cholesky_dist factors the same matrix bit for bit at the same (ds, ts).
    # What this REPLACED was 14,028 serial freads on rank 0 moving 1.122 GB off
    # a shared filesystem inside the measured window -- O(ds^2), node-count
    # invariant, filesystem-state dependent.  DISCLOSED, and disclosed as
    # applying identically to every tier: the construction of the graph stays
    # serial in base (it is the exhibit), the FILL is parallel everywhere.
    # Both published input paths remain accepted and unchanged, so a real
    # matrix can still be supplied: --fib (tile-stream binary, a local
    # adaptation ported from the sibling cholesky/ocr port) and --fi
    # (whitespace text, one fscanf per element).  No fixture is staged for this
    # row any more, so ds is free of any baked-input cost.
    #
    # ORACLE: the scalar is the trace of the factor, summed over the t diagonal
    # tiles in the finisher in slot order, so it is scheduling-independent.
    # With no zero entry in the instance every GEMM, TRSM and SYRK reaches a
    # diagonal tile through the trailing updates of its own column, so the
    # trace is a function of the whole factorisation -- unlike the identity
    # stream this row used to read, under which the factor was the identity and
    # the scalar could not move for an error in over 96% of the tasks.  The
    # value is no longer analytic: expect is a MEASURED pin, taken once at the
    # args below.
    #
    # The program's output level defaults to 6, "emit no solution, only the
    # correctness scalar".  That is a DELIBERATE deviation from the published
    # default of 2 (write the whole lower triangle to a binary file): at these
    # arguments the published default is 139,453,350 single-double fwrite calls
    # and 1.116 GB of filesystem traffic, serially, inside the measured window,
    # with no dependence on the node count and a run-to-run cost that follows
    # the filesystem's state rather than the runtime's.
    #
    # Other disclosed adaptations, all identical in both tiers: MKL replaced by
    # CBLAS/LAPACKE; the read-only kernel operands declared DB_MODE_RO where
    # upstream declared RW (a contract fix, but one that removes a
    # serialisation of the t-1-wide level-0 fan-out); ocrDbRelease sequenced
    # before ocrEventSatisfy everywhere; the tile blocks created without an
    # acquire on the generated path, since the creating task never writes one;
    # loud argument validation (strict decimal parse, unknown option and
    # trailing token rejected, --ol range-checked, an unopenable input file
    # reported); the dead --fo knob removed.
    #
    # The hinted tier adds hints on TWO planes off one key: the 2-D
    # block-cyclic owner map (row%P)*Q + (col%Q) keys each kernel EDT and each
    # tile's generator on the tile it writes, AND each tile datablock's home on
    # the same coordinate.  Without the second plane every tile stays
    # creator-homed on rank 0 in the hinted binary too.  Balance is max/avg
    # 1.009 / 1.036 / 1.091 at 2 / 8 / 32 ranks with no idle rank.  PREAMBLE
    # COST of the DB plane is now the 14,028 remote DB_CREATE_COHERENT messages
    # and nothing else: the creating task holds no tile, so there is no
    # non-home release and no publish on the write-through arms.  The gate must
    # still measure both ends -- that cost against the steady-state saving
    # (~790 k kernel releases no longer publishing ~80 kB to rank 0, plus
    # 14,028 fills that stop crossing the fabric).  Gate table: the one-node
    # anchor below settles it -- a wash (16.8 s base against 17.0 s hinted).
    #
    # Anchor and 1-node residency are measured at these arguments (below),
    # through the generated-fill input path with no whole-factor write live.
    # Re-anchor if ds moves -- shrinking ts for a timing gain is what the
    # width rule forbids.
    args: ['--ds', '22400', '--ts', '100']
    # Anchor at these arguments, one node of 108 workers, INV x WB: base 16.8
    # s / hinted 17.0 s, 12 GB resident; target 20 s (hinted kept, flat).
    expect: '27322.013354'      # the trace at the args above; measured, not analytic
    expect_args: ['--ds', '22400', '--ts', '100']
    hinted: true    # kept: the 2-D block-cyclic owner map is 2.3-2.4x faster than the base at 2-8 ranks

    restructured_as: cholesky_dist

  cholesky_dist:
    binary: cholesky_dist
    class: task
    provenance: 'Tiled Cholesky, place-persistent SPMD rewrite'
    marker: 'CHOLESKY trace'
    scalar_re: 'CHOLESKY trace\s*=\s*([\-+0-9.eE]+)'
    tolerance: 1e-06
    # The same factorisation, the same 2-D block-cyclic ownership and the same
    # BLAS3 kernels as the row it re-implements.  What differs is where the
    # graph comes from: mainEdt creates `places` events, 2*places tasks and
    # places^2 dependences and nothing that scales with t, and each place then
    # creates -- on itself, enumerating only the indices it owns -- the version
    # names, the tile blocks and the tasks for its own tiles.  A place derives
    # any tile's names from the partition alone (contiguous in the owner's
    # block, offset a pure function of (t, places)), so the names are published
    # per place rather than gathered into one grid.
    #
    # INPUT: GENERATED, by the place that owns each tile, from the same header
    # the base row includes -- so the two rows factor the same matrix and the
    # two tiers' windows span the same work.  The run names no input file and
    # the in-window input term is zero bytes; --fib still reads, unchanged, for
    # a run given a real matrix.  What this replaced was ds(ds+ts)/2 * 8 B of
    # filesystem traffic inside the window (32.58 GB at the previous anchor),
    # divided `places` ways and therefore heaviest on the 1-node cell -- the
    # denominator of every speedup this row reports.  No task, name or block
    # count changes with the switch: the fill stays inside placeName, where the
    # read was.
    #
    # ORACLE: the trace of the factor over the t diagonal tiles, in slot order.
    # The instance has no zero entry, so every element of the factor feeds a
    # diagonal tile and the trace is a function of the whole factorisation; it
    # is no longer analytic, so expect is a MEASURED pin at the args below.
    # The factor itself was verified against an independent sequential Cholesky
    # on three non-trivial SPD matrices (all 500,500 elements to 1.5e-15) fed
    # as tile streams; that pinned the arithmetic, which neither the startup
    # split nor the generated instance changes.
    #
    # This is the cycle's one strong scaler, so it is sized against the
    # restructured tier's 120 s target rather than the shorter window a
    # base-tier cell gets.
    #
    # The knobs divide cleanly and none is tuned for speed.  ts is the WIDTH
    # knob: the structure is a right-looking dataflow frontier, peak width is
    # t(t-1)/2 with t = ds/ts, and the rule asks four times the largest
    # geometry's 3456 workers, so t >= 167.  ts = 500 with t = 170 (ds 85000)
    # gives a peak of 14,365, which is 4.16x the workers.  A larger tile runs faster and is
    # not used: it would give 1.16x the workers instead of 4x.  ds is the SIZE
    # knob and the window fixes it -- and with no fixture to bake, any ds the
    # window asks for is one argument away.
    #
    # places is the ownership decomposition and is node-invariant by
    # construction -- the task count, the block count and the order the factor
    # is computed in are the same at every node count, and the machine enters
    # only through the hint that maps a place onto a rank (both grid axes
    # folded).  It is ALSO the startup width now that naming, tile filling and
    # task creation are per place: at 32 the widest geometry gets one preamble
    # task per rank.  A larger node-invariant value (128 -> a 16x8 place grid,
    # four places a rank at 32 nodes) divides the preamble further, at the cost
    # of places^2 dependence registrations in mainEdt.  Held at 32 here because
    # changing it changes the ownership map and needs the same re-anchoring the
    # size knob does.  A places value that was ASKED FOR and cannot be honoured
    # is REJECTED, not clamped, so a mistyped knob fails loudly instead of
    # running a decomposition nobody asked for; the default is clamped to t^2
    # instead (an option nobody passed must not fail a small run) and the
    # configuration line reports the value actually used.
    #
    # ANCHOR AND TREND: the one-node anchor at these arguments is 139.1 s and
    # 68 GB resident under inv_wb, against the restructured tier's 120 s
    # target.  The previously recorded 145.5 s / 89 GB (val_wb), 159.7 s /
    # 83 GB (inv_wb), 151.8 s / 85 GB (excl_retain) and the four-point ferrari
    # trend (32.76 / 22.26 / 16.67 / 13.77 s at ds=40000, 2.38x) predate this
    # anchor and do not carry over: they were all taken before startup was
    # divided across the places and before the input read left the window.
    # The factorisation they measure is the same one; the preamble they include
    # is not.  Memory does not bound
    # this row -- payload is ds(ds+ts)/2 * 8 B (29.07 GB at 85000/500) and
    # neither change touches a payload term -- but per-node residency is the
    # figure that matters: a runner that sums VmRSS over the ranks it started
    # reports a whole-machine total when every rank is on the same host.
    #
    # Shrinking ts rather than ds is what a trend size must not do: arithmetic
    # per byte moved goes with ts, so a fifth the tile is a fifth the intensity
    # and a different program (ds=10000/ts=100 anti-scales where the catalog
    # decomposition scales).  A trend size shrinks ds alone, and must keep
    # AVERAGE available parallelism -- tasks/(3t-2) -- above the geometry's
    # worker count, not merely the peak.
    args: ['--ds', '85000', '--ts', '500', '--places', '32']
    expect: '103597.564309'
    expect_args: ['--ds', '85000', '--ts', '500', '--places', '32']
    restructured_from: cholesky_blas

  CoMD_intel_chandra:
    binary: CoMD_intel_chandra
    class: task
    provenance: 'CoMD (ExMatEx); Intel OCR port'
    # Atom migration mutates two cells through EW dependences, whose
    # exclusive-write guarantee this runtime maps onto per-node RW; the
    # sibling ports cover the same physics (CoMD_sdsc serial-redistribute,
    # CoMD_intel_chandra_tiled message-passing) without needing EW.
    unsupported: 'needs exclusive-write (EW) semantics the runtime does not implement'
    default_enabled: false
    marker: 'Initial energy'
    scalar_re: 'Initial energy\s*:\s*([\-+0-9.eE]+)'
    tolerance: 0.0001
    # The port reaches its wrap-up only through the kinetic-energy reduction,
    # which runs on print-period boundaries — a step count the period does
    # not divide never terminates.  The args keep -n dividing -N for that
    # reason (the row is disabled regardless; see unsupported above).
    args: ['-x', '60', '-y', '60', '-z', '60', '-N', '6', '-n', '6']

  CoMD_intel_chandra_tiled:
    binary: CoMD_intel_chandra_tiled
    hinted: true    # kept: the same rank grid blocked over the halo-face-minimal policy-domain grid instead of the near-cubic one -- identical where the near-cube is already minimal (1/2/16/32 nodes, the trend grid), -33 % / -20 % crossings at 4 / 8 nodes on the campaign grid; 11 % / 16 % faster at 2 / 4 ranks on the local grid whose asymmetry reproduces it
    class: spmd
    provenance: 'CoMD (ExMatEx); Intel OCR port, tiled rank grid'
    marker: 'Final energy'
    scalar_re: 'Final energy\s*:\s*([\-+0-9.eE]+)'
    tolerance: 1e-06
    # A strong scaler: persistent SPMD chains, pairwise face halo over channel
    # events, no per-step global barrier.  WIDTH is the rank grid and nothing
    # else: 24x12x12 = 3456 = one persistent chain per worker at the widest
    # geometry, node-invariant, and the per-rank chain is strictly sequential so
    # the instantaneous frontier is exactly R.  The SPMD class is 1x per worker;
    # the next legal multiple (24x24x12 = 6912) costs ~15% more payload on an
    # already-binding memory budget.  -N 100 / -n 10 are the benchmark's own
    # defaults and every upstream run line, so the BOX is the only knob.
    #
    # SHAPE: the box is proportional to the rank grid (-x 24c -y 12c -z 12c),
    # which is what the app's own run scripts do for this grid.  The code
    # imposes no commensurability requirement at all -- only n_a >= 3.203*proc_a
    # and gs_a >= 2 -- but a proportional box gives cubic subdomains, and all
    # twelve halo buffers are sized by the LARGEST face, so an anisotropic
    # subdomain pays ~37% more halo bytes per unit of local volume for nothing.
    #
    # MEMORY is the binding constraint, not the window.  Every link cell
    # reserves MAXATOMS=64 slots whether or not atoms occupy them and mean
    # occupancy is ~19, so ~70% of the footprint is reserved-and-empty; the
    # resident set is fixed by the box at startup and moves with neither the
    # step count nor the arm.  Payload = R * (5632*T + 4*T + 86016*maxF + ...);
    # see the appdoc's Memory section for the full formula and the candidate
    # table.  The cubic 240 box the row previously carried is 88.9 GB of payload
    # and was measured at 201.6 GB resident -- at or past the budget, and with
    # no host / arm / route_table_size recorded behind that number.  The
    # proportional shape reaches the same window with less memory.
    expect: '-1.166049801465'
    expect_args: ['-x', '360', '-y', '180', '-z', '180', '-N', '100', '-n', '10', '-i', '24', '-j', '12', '-k', '12']
    args: ['-x', '360', '-y', '180', '-z', '180', '-N', '100', '-n', '10', '-i', '24', '-j', '12', '-k', '12']
    unordered_writes: 'FNC_comdMain hands DBK_rankH on in RW without releasing it (CoMD.c:767); haloExchangeEdt/exchangeDataEdt re-wire DBK_sim RW while holding it (haloExchange.c:358, :478, :500, :673, :693); 24 send buffers are creator-held to EDT end (haloExchange.c:210-218, :303-311)'

  CoMD_sdsc:
    binary: CoMD_sdsc
    class: task
    provenance: 'CoMD molecular-dynamics proxy (ExMatEx); OCR port by SDSC'
    marker: 'Final energy'
    scalar_re: 'Final energy\s*:\s*([\-+0-9.eE]+)'
    tolerance: 1e-06
    # Size with the grid, never with -N.  Boxes B = prod floor(0.62462*n_i)
    # is the per-phase fan-out.
    #
    # REQUIREMENT on 39 (hinted-tier load balance, not a preference).  The
    # hinted map gives each rank one compact 3-D block of the g^3 cell grid.
    # A rectangular block partition is exactly balanced only when its cuts
    # land on grid planes: verified exhaustively over the sweep's rank counts,
    # imbalance is exactly 1.0000 at 2/4/8/16/32 ranks for every g divisible
    # by 4 (checked g = 12,16,20,24,28,32,36,40,48 and the non-cubic
    # (24,16,18)), and 1.034/1.070/1.107/1.181/1.181 at g = 29 (today's
    # -x 48), where g^3/32 is not even an integer.  So 39 MUST satisfy
    # g_i = floor(0.62462*n_i) divisible by 4 on all three axes; a size that
    # does not is an R2 violation of the hinted row, not a rounding detail.
    # (Splitting the rank set proportionally to sub-volume instead of in half
    # was evaluated and recovers only 1.181 -> 1.102 at 32 ranks while losing
    # locality 22.6% -> 25.7% remote, so the constraint lives here, not in the
    # map.)
    #
    # Cubic 4x width: -x 39 -y 39 -z 39 -> g=24, B=13824 = 4*3456; g=24 is
    # divisible by 4 (exact balance) and 13824 divides every node count of the
    # sweep and the 108-worker share exactly (-x 40 gives the same B but sits
    # 0.06% under the g=25 truncation edge).  That rung is the width floor
    # (4.0 s at one node); the calibrated rung is the next admissible one
    # that meets the window: -x 52 -> g=32 (divisible by 4), B=32768 =
    # 9.48*3456, a power of two so every node count of the sweep divides it
    # (the 108-worker share is 303.4, a 0.2% quantisation).  Chosen from two
    # measured points, not searched: g=24 4.0 s and g=40 (-x 65) 80.4 s at
    # one node give T ~ B^1.95, which puts 20 s at B ~ 31.5k.
    #
    # Anchor at these arguments, one node of 108 workers, INV x WB: base
    # 18.7 s / hinted 19.5 s, 4.9 GB resident; target 20 s (hinted kept,
    # flat -- the window moved from the both-anti clamp of 5 s when the
    # hinted tier was kept).  Worst-geometry probe at this rung (base, local
    # 15w+1p x 2/8 nodes, INV x WB): 153.4 s / 270.5 s, 2.24x / 2.13x the
    # g = 24 rung's 68.5 / 126.9 s -- the multinode per-step wall grows
    # linearly with B, unlike the one-node compute -- so the 32-node cell
    # projects to ~370-480 s for -N 10 (the g = 24 extrapolation below times
    # 2.2), inside the 1800 s cell budget with room for -N to grow toward the
    # published value once Dane's own per-step wall is measured.
    # Cubic-free 2x width: -x 39 -y 26 -z 29 -> g=(24,16,18), B=6912 = 2*3456
    # (18 is not divisible by 4, but this exact grid was verified 1.0000 at
    # 2/4/8/16/32 -- any OTHER non-cubic candidate must be re-verified).
    #
    # REQUIREMENT on 10: -N is published as 100 and stays argv, but the
    # anti-scaling arithmetic below shows 100 does not fit Dane's 900 s cell at
    # either qualifying width.  The orchestrator must pin 10 and RECORD the
    # shortfall as a disclosed deviation; -n returns to the published 10.  On
    # the current extrapolation -N 30 -n 10 lands 496-645 s at B=13824 and
    # 246-324 s at B=6912.  10 = 100 may be left only if the re-measurement on
    # Dane's fabric shows the per-step wall low enough to fit.
    #
    # Anti-scaling row: the LONGEST cell is the LARGEST geometry, because each
    # step re-wires the whole B-wide five-phase DAG from ONE spawner EDT, so
    # budget from 32n.  Measured per-step wall at B=24389 was 12.1/19.0/23.7 s
    # at 2/4/8 ferrari nodes (increments 6.88 then 4.73), extrapolating to
    # 29-38 s/step at 32n, i.e. 16.5-21.5 s at B=13824 and 8.2-10.8 s at
    # B=6912.  A period that does not divide -N is not a staleness bug (the
    # kinetic term is recomputed at the block end just before the final print)
    # -- it makes the run execute period*ceil(steps/period) steps.
    # Re-check the 32n extrapolation on Dane's fabric before pinning.
    #
    # Initial state generation is index-seeded and parallel (R9).  mainEdt
    # still creates the B box datablocks (with DB_PROP_NO_ACQUIRE: it never
    # writes them, so it takes no hold, performs no release and publishes no
    # payload; under the hinted map the preamble is B remote creates and
    # nothing else).  The FCC fill, the momenta (mk_seed(gid,123)), the
    # displacement (mk_seed(gid,457)) and the occupancy statistic are
    # produced by one task per box, on the rank that owns the box under the
    # hinted map.  The centre-of-mass subtraction and the kinetic-energy
    # rescale are a per-box partial sum -> one reduction -> per-box apply,
    # the same phase structure and closed-form normalisation the restructured
    # row uses; the reduction adds its inputs in dependence-slot order (slot
    # = box index), so the sums do not move with the node count.  The initial
    # whole-grid redistribute is gone: an atom is born in the box that
    # contains its displaced position, so the pass had nothing to do.
    # Correctness adaptation of the compute phase, disclosed: the per-step
    # redistribute now visits every atom once -- the published loop stepped
    # over the atom swapped into a vacated slot, so roughly one migration in
    # twenty was deferred a step and that atom's force came from the wrong
    # 27-cell neighbourhood meanwhile.  Decomposition, granularity, wiring
    # and object counts are unchanged by that fix.  -r/--delta is validated
    # to [0, 0.25*lat) because this program never wraps a position.
    # Object counts (B = boxes, P = period, K = ceil(steps/period)):
    #   EDTs   (4B+10) + K*(P*(3B+8) + 2B+5)
    #   DBs    (4B+6)  + K*(P*(B+1)  + B+1)
    #   events (B+3)   + K*(P*(2B+4) + B+2)
    # Predicted app-side counters (before the runtime's own +1 EDT / +1 DB):
    #   -x4 -y4 -z4 -N1 -n1 (B=8): EDT 95, DB 56, EVT 41;
    #   -x6 -y4 -z4 -N3 -n1 (B=12): EDT 277, DB 132, EVT 141.
    # expect MUST be re-pinned: nothing printed changed, but the value moves
    # -- the whole-system sums are taken per box in box order, the in-box
    # atom order is generation order, and the per-step redistribute no
    # longer defers a migration (that one changes the trajectory, not its
    # rounding, so the old -1.166054974646 is not a bound on the new value).
    # The check that replaces it is CROSS-TIER: at the same -x/-y/-z/-N/-n/-t
    # CoMD_sdsc and CoMD_sdsc_dist step the same instance under the same
    # rules, so their 'Final energy' must agree to round-off (what is left is
    # the summation shape -- linear join here, arity-8 tree there -- and the
    # neighbour enumeration order) and their 'Total atoms' and 'Max Link Cell
    # Occupancy' must be equal exactly.
    expect: '-1.166059660595'
    expect_args: ['-x', '52', '-y', '52', '-z', '52', '-N', '10', '-n', '10']
    args: ['-x', '52', '-y', '52', '-z', '52', '-N', '10', '-n', '10']
    hinted: true    # kept: the block map beats the round-robin base by 9-22 % at 2-8 ranks
    restructured_as: CoMD_sdsc_dist
    unordered_writes: 'the port never calls ocrDbRelease: every spine hand-off of the timer and simulation blocks overlaps the holder''s and the successor''s RW acquisitions (comd.c:75, :112, :130, :148, :173, :191, :212; timestep.c:20, :36, :53, :71, :95; lj.c:307)'

  CoMD_sdsc_dist:
    binary: CoMD_sdsc_dist
    class: task
    provenance: 'CoMD molecular-dynamics proxy (ExMatEx); SDSC OCR port, distributed rewrite'
    marker: 'Final energy'
    scalar_re: 'Final energy\s*:\s*([\-+0-9.eE]+)'
    tolerance: 1e-06
    # The base row's wall is its wiring plane, not its physics: one task emits
    # every fan-out, one join takes a dependence per cell, one redistribute
    # takes every cell for writing each step, and generation and teardown are
    # serial loops over all B cells.  This program keeps the potential, the
    # lattice, the instance and the scalar, and replaces all four: spawn and
    # reduction trees per phase, atom exchange through a per-cell block its
    # owner publishes, in-place generation from an index-seeded generator, and
    # per-owner release.  Cells are blocked over a 3-D rank grid, so a cell's
    # write ownership never leaves its rank.
    #
    # SIZE, not the step count, reaches the window: -N 100 -n 10 are the
    # published defaults and stay there.  The three axes are independent knobs
    # and B = g_x*g_y*g_z with g_i = floor(0.6246*n_i); the restructured tier's
    # 120 s target needs far more work than the base row's 4x/2x-width
    # geometries, so -x 193 -y 193 -z 193 gives g = (120,120,120),
    # B = 1,728,000 = 500 x 3456 -- an integer multiple of the width floor,
    # split exactly over the rank grid at 1/2/4/8/16/32 nodes.  -w is the
    # spawn-tree leaf width: the tree splits on whole leaf widths, so the issue
    # frontier is exactly ceil(B/w); w = 8, the default, puts it at 216,000.
    # Payload is 6816 B per cell (~11.8 GB total), so the row is time-bound,
    # never memory-bound.
    # Across a brick boundary a step reads its neighbours from one packed
    # block per (owner brick, direction, 64-cell run), fetched once per
    # reading rank per step, so the wire cost of the halo is per run rather
    # than per cell; the run count is the brick surface over 64.
    # Anchor at these arguments, one node of 108 workers, INV x WB: 133.1 s,
    # 33 GB resident; target 120 s (restructured).
    args: ['-x', '193', '-y', '193', '-z', '193', '-N', '100', '-n', '10', '-w', '8']
    expect: '-1.166049786183'
    expect_args: ['-x', '193', '-y', '193', '-z', '193', '-N', '100', '-n', '10', '-w', '8']
    restructured_from: CoMD_sdsc
    unordered_writes: 'mainEdt hands timer_i/sim_i/cfg_i on in RW unreleased (comd.c:181-182), and init_leaf publishes with every creator hold open (atoms.c:273)'

