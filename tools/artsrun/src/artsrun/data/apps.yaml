    # EXCL·PURGE 4.5 s; population is fixed at this geometry, so the 32-node
    # cell is its 8-rank cell: ~130 s.
    marker: 'HANDOFF_LATTICE OK '
    scalar_kind: bool
    extra_scalars: &lattice_scalars
      GENS: 'GENS=([0-9]+)'
      FANOUT: 'FANOUT=([0-9]+)'
      GXPUT: 'GXPUT=([-0-9.]+)'
      WREL_P50: 'WREL_P50=([-0-9.]+)'
      WREL_P99: 'WREL_P99=([-0-9.]+)'
