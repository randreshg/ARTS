    # already fixed-work and self-scales with node count.  This is C0, the
    # suite's first convergence control: it is the arm-superadditivity check
    # the kill columns are read against.
    # Crown/grave on one node of 108 workers: crown EXCL·PURGE 0.3 s, grave
    # EXCL·RETAIN 0.5 s; at eight ranks the four arms hold within 1.5-1.7 s,
    # the convergence control's point.
