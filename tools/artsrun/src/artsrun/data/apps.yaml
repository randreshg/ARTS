    provenance: 'attack matrix C3: second convergence control -- race-free producer/consumer handoff at 1 us holds'
    # The same event-ordered handoff lattice as the exclusion column below,
    # at the same geometry (8 lattices, 8 regions, 3 consumers per
    # generation): the control's holds are negligible (1 us) on both sides,
    # so the per-generation cost left is the handoff's own overhead, with no
    # read phase for the next producer to wait out -- the exclusion column's
    # consumer hold is that read phase.  This is C3, the suite's second
    # convergence control: its own e2e wall time under a race-free handoff
    # pattern is a figure with no windowed-throughput averaging.  The
    # printed GENS= is the aggregate over all lattices (lattices times the
