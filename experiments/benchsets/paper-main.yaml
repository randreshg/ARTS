# Paper campaign roster.
#
# Omitted fields fall through to the catalog, so this file only has to
# carry what this campaign changes: which applications run, in which
# versions, and any calibration that differs from the catalog default.
# Set `enabled: false` to drop one without editing the tool.
#
# Version policy: every application runs every version it offers.  base and
# hinted are one program differing by a hint layer, so they share arguments
# and the comparison between them is direct; the calibration window belongs
# to base, the tier that has to survive the whole node sweep, and hinted
# follows it (a hint layer is a no-op at one place, so the two share an
# anchor by construction).  `restructured` is a different program and carries
# its own row and its own window.  An app lists fewer versions only when it
# does not offer them — no hint layer, or no rewrite.

name: paper-main
description: curated roster for the coherence comparison

apps:
  basicIO:
    enabled: false
    versions: [base]
  cache_offset:
    enabled: false
    versions: [base]
  cholesky_blas:
    enabled: true
    versions: [base, hinted, restructured]
  CoMD_intel_chandra:
    enabled: false   # unsupported: needs EW semantics the runtime does not implement
  CoMD_intel_chandra_tiled:
    enabled: true
    versions: [base, hinted]
  CoMD_sdsc:
    enabled: true
    # the block map is 9-22 % faster than the base at 2-8 ranks (kept: a hinted tier is dropped only when it is the base placement)
    versions: [base, hinted, restructured]
  CoMD_sdsc2:
    enabled: false   # unsupported: needs EW semantics the runtime does not implement
  curvefit:
    enabled: false
    versions: [base]
  dbcreate_matrix:
    enabled: false
    versions: [base]
  dbctrl:
    enabled: false
    versions: [base]
  fft:
    enabled: true
    versions: [base, hinted, restructured]
  fibonacci:
    enabled: true
    versions: [base, hinted]
  globalsum_cgNoShim:
    enabled: false
    versions: [base]
  globalsum_cgShim:
    enabled: false
    versions: [base]
  globalsum_pcg:
    enabled: false
    versions: [base]
  graph500:
    enabled: true
    # The hinted layer stays in the source and stays compiled, but on this
    # row's square R x C grid it is the same whole-column partition the
    # shipped map already makes, so the tier is not registered (the catalog
    # carries hinted: false), so base and the rewrite are the two tiers.
    versions: [base, restructured]
  highbw:
    enabled: false
    versions: [base]
  hpcg_intel:
    enabled: true
    versions: [base, restructured]
  hpgmg:
    enabled: true
    versions: [base, hinted, restructured]
  LCS_all_db_distributed:
    enabled: true
    versions: [base, hinted, restructured]
  LCS_distributed_ST:
    enabled: true
    versions: [base, hinted]
  LCS_shared:
    enabled: true
    versions: [base, hinted]
  miniAMR_forkbomb:
    enabled: false
    versions: [base]
  miniAMR_intel:
    enabled: true
    versions: [base, hinted, restructured]
  # Off the roster 2026-08-23: reclassified kind: microbench -- same
  # philosophy as miniAMR_intel and dominated by it, with every EDT pinned to
  # the creating rank so nothing distributes.
  miniAMR_intel_bryan:
    enabled: false
    versions: [base]
  miniAMR_intel_chandra:
    enabled: true
    versions: [base, hinted]
  multigen:
    enabled: false
    versions: [base]
  multigen_2:
    enabled: false
    versions: [base]
  nekbone:
    enabled: true
    # R3: at the campaign grain the hint layer turns the verdict (base anti, hinted scales); a smaller trend lattice once read it as immaterial
    versions: [base, hinted, restructured]
  npb_cg:
    enabled: true
    versions: [base, restructured]
  nqueens:
    enabled: true
    # the subtree map is 19 % faster at 8 ranks (kept)
    versions: [base, hinted]
  p2p:
    enabled: true
    # The source gained an OCR_APP_OPTIMIZED_PLACEMENT map this cycle (the
    # rank -> policy-domain chunking, argv[6]); the tier is registered in the
    # catalog and its keep/drop verdict is the campaign's.
    # R3 (local trend 2026-09-04): the chunk map ran 3-11x SLOWER than base at 2-8 ranks, so the tier is not registered (catalog hinted: false)
    versions: [base]
  printf:
    enabled: false
    versions: [base]
  prodcon:
    enabled: false
    versions: [base]
  quicksort:
    enabled: true
    versions: [base, hinted, restructured]
  reduction_intel:
    enabled: false
    versions: [base]
  reduction_intel_chandra:
    enabled: false
    versions: [base]
  RSBench_intel:
    enabled: true
    versions: [base, hinted, restructured]
  RSBench_intel_sharedDB:
    enabled: true
    # R3 (local trend 2026-09-04): hinted == base at 1-8 ranks; the tier is not registered
    versions: [base]
  sar_pss:
    enabled: true
    versions: [base, restructured]
  smithwaterman:
    enabled: true
    # the band map is 1.3-2x faster than the base at 2-8 ranks (kept)
    versions: [base, hinted, restructured]
  stencil1D_channel:
    enabled: false
    versions: [base]
  stencil1D_guid:
    enabled: false
    versions: [base]
  stencil1D_guidPI:
    enabled: false
    versions: [base]
  Stencil1D_intel_chandra:
    enabled: false   # same source as Stencil2D_intel_chandra (PROBLEM_TYPE=1) — 2-neighbor degenerate
    versions: [base]
  stencil1D_once:
    enabled: false
    versions: [base]
  stencil1D_oncePI:
    enabled: false
    versions: [base]
  stencil1D_sticky:
    enabled: false
    versions: [base]
  stencil1D_stickyLG:
    enabled: false
    versions: [base]
  Stencil2D_intel_chandra:
    enabled: false   # same kernel as channelEVTs, per-round sticky churn — channelEVTs represents the family
    versions: [base]
  Stencil2D_intel_channelEVTs:
    enabled: true
    versions: [base]
  stream:
    enabled: true
    versions: [base, hinted, restructured]
  task_priorities:
    enabled: false
    versions: [base]
  tempest:
    enabled: true
    versions: [base, hinted, restructured]
  testlibs:
    enabled: false
    versions: [base]
  triangle:
    enabled: true
    versions: [base, hinted]
  xeonNumaSize:
    enabled: false
    versions: [base]
  XSBench_intel:
    enabled: true
    versions: [base, hinted, restructured]
  XSBench_intel_sharedDB:
    enabled: true
    versions: [base]   # SPMD self-placed (fork pins ranks, chains carry rank hints) — no hint layer to add

  # --- HPX-origin section (hpx_apps.yaml): one program on four runtimes ---
  # Every row runs the catalog's calibrated arguments, like every other row
  # here; the one-node anchor window and the width floor that chose them are in
  # each row's appdoc.  A row is in the comparison only if its origin never
  # suspends a parallel task (its waits are continuations, or a bounded number
  # of driver-thread phase joins -- the same discipline an OCR program has by
  # construction) AND its parallel width is set by the problem, not fixed by
  # the origin below the machine's width; the seven rows that fail either test
  # are excluded from it (`comparison_excluded` in the catalog names the
  # reason) and stay runnable through the gate rosters.
  fib_hpx:
    enabled: true
    versions: [base]
  stencil1d_hpx:
    enabled: true
    versions: [base]
  network_storage_hpx:
    enabled: true
    versions: [base]
  fft_hpx:
    enabled: true
    versions: [base]
