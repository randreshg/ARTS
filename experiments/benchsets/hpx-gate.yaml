# Gate roster for the HPX-origin section: consensus at small arguments, so a
# gate run takes minutes.  Timing from this roster is never reported; the
# calibrated paper-main arguments remain the measurement.
name: hpx-gate
description: small-size consensus gate for the HPX-origin section
apps:
  fib_hpx:
    enabled: true
    versions: [base]
    args: ['--n-value=30', '--threshold=12', '--distribute-at=25', '--n-runs=1', '--test=1']
  stencil1d_hpx:
    enabled: true
    versions: [base]
    args: ['--nx=64', '--nt=16', '--np=64', '--nd=10']
  network_storage_hpx:
    enabled: true
    versions: [base]
    # --globalMB is divided among the nodes by the program itself, so one
    # argument list keeps the total storage -- and both transfer counts --
    # the same job at every node count the gate sweeps.
    args: ['--globalMB=16', '--transferKB=64', '--iterations=2', '--semaphore=16', '--all-to-all=true', '--no-local=false', '--distribution=1']
  fft_hpx:
    enabled: true
    versions: [base]
    # One argument list at every geometry: the program divides both
    # dimensions by the node count itself, and 256 x (254/2 + 1) = 256 x 128
    # divides every rung the gate sweeps.  A non-dividing pair would silently
    # drop the trailing rows rather than fail.
    args: ['--nx=256', '--ny=254', '--plan=estimate', '--run=scatter']
