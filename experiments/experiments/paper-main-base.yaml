    versions: [base]
  stencil1D_guid:
    enabled: false
    versions: [base]
  stencil1D_guidPI:
    enabled: false
    versions: [base]
  Stencil1D_intel_chandra:
    enabled: false   # same source as Stencil2D_intel_chandra (PROBLEM_TYPE=1) — 2-neighbor degenerate
    versions: [base]
  stencil1D_once:
