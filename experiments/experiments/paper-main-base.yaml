# Experiment paper-main-base: paper-main's roster at the base tier only, so the paper
# campaign can be submitted in halves; entries as paper-main.  Any other plane
# entry is turned on for one run with -e.
#
# Omitted fields fall through to the catalog, so this file only has to
# carry what this campaign changes: which applications run, in which
# versions, and any calibration that differs from the catalog default.
# Set `enabled: false` to drop one without editing the tool.
#
# Version policy: the base tier of every row paper-main runs -- the program
# as published plus the disclosed conformance adaptations, with its own
# calibration window.  The hinted tier of the same rows is paper-main-hinted:
# one program differing by a hint layer, so the two campaigns share arguments
# and their comparison is read across them.  The restructured tier is not
# part of the paper campaign.

name: paper-main-base
description: paper-main at the base tier only
# The coherence entries this experiment runs unless -e names others.
entries: [arts_excl_purge, arts_excl_retain, arts_inv_wt_purge, arts_inv_wt,
          arts_inv_wb, arts_val_wt_purge, arts_val_wt, arts_val_wb, xsocr, ocrvx]

apps:
  basicIO:
    enabled: false
    versions: [base]
  cache_offset:
    enabled: false
    versions: [base]
  cholesky_blas:
    enabled: true
    versions: [base]
  CoMD_intel_chandra_tiled:
    enabled: true
    versions: [base]
  CoMD_sdsc:
    enabled: true
    # the block map is 9-22 % faster than the base at 2-8 ranks (kept: a hinted tier is dropped only when it is the base placement)
    versions: [base]
  curvefit:
    enabled: false
    versions: [base]
  dbcreate_matrix:
    enabled: false
    versions: [base]
  dbctrl:
    enabled: false
    versions: [base]
  fft:
    enabled: true
    versions: [base]
  fibonacci:
    enabled: true
    versions: [base]
  globalsum_cgNoShim:
    enabled: false
    versions: [base]
  globalsum_cgShim:
    enabled: false
    versions: [base]
  globalsum_pcg:
    enabled: false
    versions: [base]
  graph500:
    enabled: true
    # The hinted layer stays in the source and stays compiled, but on this
    # row's square R x C grid it is the same whole-column partition the
    # shipped map already makes, so the tier is not registered (the catalog
    # carries hinted: false), so base and the rewrite are the two tiers.
    versions: [base]
  highbw:
    enabled: false
    versions: [base]
  hpcg_intel:
    enabled: true
    versions: [base]
  hpgmg:
    enabled: true
    versions: [base]
  LCS_all_db_distributed:
    enabled: true
    versions: [base]
  LCS_distributed_ST:
    enabled: true
    versions: [base]
  LCS_shared:
    enabled: true
    versions: [base]
  miniAMR_forkbomb:
    enabled: false
    versions: [base]
  miniAMR_intel:
    enabled: true
    versions: [base]
  # Off the roster 2026-08-23: reclassified kind: microbench -- same
  # philosophy as miniAMR_intel and dominated by it, with every EDT pinned to
  # the creating rank so nothing distributes.
  miniAMR_intel_bryan:
    enabled: false
    versions: [base]
  miniAMR_intel_chandra:
    enabled: true
    versions: [base]
  multigen:
    enabled: false
    versions: [base]
  multigen_2:
    enabled: false
    versions: [base]
  nekbone:
    enabled: true
    # R3: at the campaign grain the hint layer turns the verdict (base anti, hinted scales); a smaller trend lattice once read it as immaterial
    versions: [base]
  npb_cg:
    enabled: true
    versions: [base]
  nqueens:
    enabled: true
    # the subtree map is 19 % faster at 8 ranks (kept)
    versions: [base]
  p2p:
    enabled: true
    # The source gained an OCR_APP_OPTIMIZED_PLACEMENT map this cycle (the
    # rank -> policy-domain chunking, argv[6]); the tier is registered in the
    # catalog and its keep/drop verdict is the campaign's.
    # R3 (local trend 2026-09-04): the chunk map ran 3-11x SLOWER than base at 2-8 ranks, so the tier is not registered (catalog hinted: false)
    versions: [base]
  printf:
    enabled: false
    versions: [base]
  prodcon:
    enabled: false
    versions: [base]
  quicksort:
    enabled: true
    versions: [base]
  reduction_intel:
    enabled: false
    versions: [base]
  reduction_intel_chandra:
    enabled: false
    versions: [base]
  RSBench_intel:
    enabled: true
    versions: [base]
