# Experiment control-gate: the consensus gate for control-main -- its
# adversarial columns and its HPX-origin rows at arguments small enough that
# the whole experiment runs in minutes on a development host.  Timing from it
# is never reported; the catalog's calibrated arguments remain the
# measurement.  The cross-runtime consensus vote is the gate:
#
#   artsrun run -p <profile> -x control-gate -n 1,2,4,8 --repeats 1
#
# A control experiment runs the ARTS entries and HPX by default: the
# adversarial rows are ARTS-only by design (they compare the plane's own arms
# against each other), and the HPX-origin rows are what HPX runs.  Any other
# plane entry is turned on for one run with -e.
#
# Every adversarial row's op count is the catalog vector's cut to a tenth (a
# coupled row's two counts keep their ratio), so an arm that the row is built
# to bury takes about a minute here and every other cell a few seconds; the
# exact-count and monotone-read oracles still decide the marker.  Every other
# argument -- size, spread, hold and think times, lattice geometry -- is the
# catalog's own.  Population is the program's, derived from the rank count,
# not a roster concern.
name: control-gate
description: small-size consensus gate for the adversarial columns and the HPX-origin rows
# The coherence entries this experiment runs unless -e names others.
entries: [arts_excl_purge, arts_excl_retain, arts_inv_wt_purge, arts_inv_wt,
          arts_inv_wb, arts_val_wt_purge, arts_val_wt, arts_val_wb, hpx]
apps:
  own_reread_64k:
    enabled: true
    versions: [base]
    args: ['65536', '74000']
  own_reread_16m:
    enabled: true
    versions: [base]
    args: ['16777216', '640']
  own_rewrite_64k:
    enabled: true
    versions: [base]
    args: ['65536', '48000']
  own_rewrite_16m:
    enabled: true
    versions: [base]
    args: ['16777216', '256']
  one_home_funnel_4m:
    enabled: true
    versions: [base]
    args: ['4194304', '16', '1', '60']
  spread_home_funnel_4m:
    enabled: true
    versions: [base]
    args: ['4194304', '16', '16', '60']
  audienceless_publish_16m:
    enabled: true
    versions: [base]
    args: ['16777216', '3500']
  freerun_read_heavy_64k:
    enabled: true
    versions: [base]
    args: ['65536', '1', '20', '7000', '875']
  freerun_grain_200us_64k:
    enabled: true
    versions: [base]
    args: ['65536', '20', '180', '8400', '1050']
  freerun_grain_2ms_64k:
    enabled: true
    versions: [base]
    args: ['65536', '200', '1800', '1440', '180']
  pipeline_converge_1m:
    enabled: true
    versions: [base]
    args: ['1048576', '550', '275']
  alternating_bomb_64k:
    enabled: true
    versions: [base]
    args: ['65536', '0', '20000', '2000']
  bomb_narrow_sharers_64k:
    enabled: true
    versions: [base]
    args: ['65536', '8', '20000', '2000']
  resident_mill_1m:
    enabled: true
    versions: [base]
    args: ['1048576', '15', '5', '0', '17500', '700']
  sparse_mill_1m:
    enabled: true
    versions: [base]
    args: ['1048576', '1', '5', '0', '1500', '60']
  migration_gauntlet_64k:
    enabled: true
    versions: [base]
    args: ['65536', '7500', '200', '2']
  migration_gauntlet_16m:
    enabled: true
    versions: [base]
    args: ['16777216', '80', '10', '2']
  slow_churn_dial_16m:
    enabled: true
    versions: [base]
    args: ['16777216', '15', '20', '20000', '3400', '68']
  handoff_long_read_64k:
    enabled: true
    versions: [base]
    args: ['65536', '20', '2000', '3', '13000', '8', '8']
  serial_rounds:
    enabled: true
    versions: [base]
    args: ['16', '50', '65536']
  handoff_control_64k:
    enabled: true
    versions: [base]
    args: ['65536', '1', '1', '3', '11500', '8', '8']

  # --- HPX-origin rows: the origin's own program beside the mirror ---
  fib_hpx:
    enabled: true
    versions: [base]
    args: ['--n-value=30', '--threshold=12', '--distribute-at=25', '--n-runs=1', '--test=1']
  stencil1d_hpx:
    enabled: true
    versions: [base]
    args: ['--nx=64', '--nt=16', '--np=64', '--nd=10']
  network_storage_hpx:
    enabled: true
    versions: [base]
    # --globalMB is divided among the nodes by the program itself, so one
    # argument list keeps the total storage -- and both transfer counts --
    # the same job at every node count the gate sweeps.
    args: ['--globalMB=16', '--transferKB=64', '--iterations=2', '--semaphore=16', '--all-to-all=true', '--no-local=false', '--distribution=1']
  fft_hpx:
    enabled: true
    versions: [base]
    # One argument list at every geometry: the program divides both
    # dimensions by the node count itself, and 256 x (254/2 + 1) = 256 x 128
    # divides every rung the gate sweeps.  A non-dividing pair would silently
    # drop the trailing rows rather than fail.
    args: ['--nx=256', '--ny=254', '--plan=estimate', '--run=scatter']
