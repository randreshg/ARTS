# Local correctness smoke for the fabric-attached-memory entries, on the
# vendored fake library (fam_device: fake, i.e. ARTS_FAM_BACKEND=SHM), with
# the strict oracle on by default.  A reference entry's colocated
# local ranks are each pinned to one physical core, so the geometry a
# campaign requests here must fit the machine's physical core count, not
# its logical CPU count (an SMT sibling is not a second core to pin a rank
# to):
# 2 nodes x (2 workers + 1 progress) = 6 physical cores.  Timings from
# this host are never evidence of anything.  The entries are named per run,
# since no experiment lists a FAM entry by default:
#
#   artsrun run -p local-fam -x paper-gate -n 1 \
#       -e arts_excl_purge,arts_excl_purge_fam_staged,arts_excl_purge_fam_direct,xsocr
name: local-fam
launcher: local

nodes: [1, 2]
workers: 2
progress: 1

pin: true
provider: tcp
route_table_size: 14
core_dump: false
# The whole pool, split into one slice per rank: a capacity cap, not a
# reservation (the store commits only the pages a run touches), sized so a
# two-rank smoke never runs a slice dry.
fam_pool_mb: 4096
# The library the FAM entries link; the build tree is reconfigured to it
# (fake = ARTS_FAM_BACKEND=SHM) or the campaign does not start.  launcher:
# local implies fake and refuses real (one host, no fabric), so this line only
# states what the launcher forces.  The library's region is sized from
# fam_pool_mb for every FAM cell, and it has one name per host, so one
# campaign runs on this host at a time.
fam_device: fake

# Sized for correctness runs on a laptop at this narrow width, never for timing.
cell_timeout_s: 600
repeats: 1
