# Local correctness smoke for the CXL entries on the vendored fake library
# (no cxl_* paths ⇒ fake).  A reference entry's colocated local ranks are
# each pinned to one physical core, so the geometry a campaign requests here
# must fit the machine's physical core count: 2 nodes x (2 workers + 1
# progress) = 6 physical cores.  Timings from this host are never evidence of
# anything.  The entries are named per run, since no experiment lists a CXL
# entry by default:
#
#   artsrun run -p local-cxl -x paper-gate -n 1 \
#       -e arts_excl_purge,arts_excl_purge_cxl_staged,arts_excl_purge_cxl_direct,xsocr
#
# The fake library is one host's shared memory with one name, so one campaign
# runs on this host at a time.
name: local-cxl
launcher: local

nodes: [1, 2]
workers: 2
progress: 1

pin: true
provider: tcp
route_table_size: 14
core_dump: false

# Sized for correctness runs on a laptop at this narrow width, never for timing.
cell_timeout_s: 600
repeats: 1
