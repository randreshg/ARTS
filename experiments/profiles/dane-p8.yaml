# Dane with the progress threads doubled: 104 workers + 8 progress fills the
# same 112-core node, so the node sweep and every argument stay the machine's
# and only the split between compute and message progress moves.  It answers
# how much of a column's cost is progress-thread capacity rather than
# protocol -- read against the 108+4 profile at the same geometry, never
# mixed into its trend.
#
# 104 = 2**3 * 13 does NOT factor into a near-cubic grid the way 108 does, so
# the SPMD rows whose grid must equal the worker count do not belong in a
# sweep run here; the adversarial columns, whose width is a chain count, do.
name: dane-p8
launcher: slurm

nodes: [1, 2, 4, 8, 16, 32]
workers: 104
progress: 8

pin: true
provider: verbs;ofi_rxm
route_table_size: 16
# A failing rank at 32 nodes would drop one core file per rank onto the
# shared filesystem; the campaign's evidence is its logs and markers.
core_dump: false
port_count: 1
ports: [25000]

slurm:
  poll_interval_s: 10
  # The site refuses new jobs once a user has 10 000 submitted; a full
  # roster is several thousand cells, and other work shares the limit.
  max_queued: 5000

cell_timeout_s: 1800
# Five measurements per cell: the scaling reading is the median with a
# min/max band, so a cell that lands next to a noisy neighbour is bounded
# rather than silently averaged away.
repeats: 5
# The entries this study measures: the OCR plane with its two references, and
# HPX.  The DB-WRF section is another study's and is never part of a campaign
# here unless it is named with -e.
entries: [arts_excl_purge, xsocr, arts_excl_retain, arts_inv_wt_purge,
          arts_inv_wt, arts_inv_wb, ocrvx, arts_val_wt_purge, arts_val_wt,
          arts_val_wb, hpx]
