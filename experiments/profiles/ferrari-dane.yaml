# One Dane node, mirrored on ferrari: the same 108 workers + 4 progress threads
# on one rank, so a cell here has the thread geometry a 1-node Dane cell will
# have.  112 threads land on NUMA nodes 0-6 (ferrari is 16 cores per NUMA
# node), leaving node 7 idle rather than straddling a rank across a boundary.
#
# This profile sets the SIZE anchor: a cell's time here, scaled by the
# per-core speed ratio between EPYC 7763 and Sapphire Rapids, is what the
# 1-node Dane cell will cost, and the resident set here is what one Dane
# node's 256 GB has to hold.
name: ferrari-dane
launcher: local

nodes: [1]
workers: 108
progress: 4

pin: true
provider: tcp
# Every thread owns a full-size route table, so this field is a PER-THREAD
# preallocation: at 112 threads a value of 18 costs 134 MB x 112 = 15 GB before
# the program allocates anything; 16 is the floor that still holds about ten
# million live objects.
#
#   18 -> 111.5 s, 192.6 GB     16 -> 118.0 s, 174.0 GB     14 -> 131.7 s, 176.8 GB
#
# 14 is worse than 16 on BOTH axes: shrink past the working set and the segment
# chain grows, which costs the lookup time back and the memory with it.  16 buys
# 18.6 GB -- 7% of a Dane node -- for 5.8% time, and the slowdown is uniform
# across every arm, so it moves no comparison.  Memory is the binding constraint
# for sizing here; raise this back to 18 if a campaign is time-critical and fits.
route_table_size: 16
core_dump: true
port_count: 1

# The same per-cell budget as the Dane profile, so a reference runtime that
# needs most of it at the anchor size (the HPX jacobi origin runs close to
# 600 s there) is measured rather than cut off.
cell_timeout_s: 1800
# Five measurements per cell, as on Dane; a gate or probe passes --repeats 1.
repeats: 5

# Peak resident set and minor-fault counts alongside the runtime's own stamp:
# a size is chosen against a memory ceiling as much as against a time window,
# and neither number is observable without the witness.
rusage_witness: true

# Fabric-attached memory is off here: every plane entry but the two FAM ones.
entries: [arts_excl_purge, xsocr, arts_excl_retain, arts_inv_wt_purge,
          arts_inv_wt, arts_inv_wb, ocrvx, arts_val_wt_purge, arts_val_wt,
          arts_val_wb, arts_wrf_flush, hpx]
