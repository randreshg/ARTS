name: papi_memstall_skx
description: memory-bound stalls and where L3 misses were served (local DRAM, remote DRAM, remote cache HITM); Skylake-SP native names, so confirm with papi_native_avail and copy this set for another CPU
capture_interval: 250
papi_events:
- PAPI_TOT_CYC
- PAPI_TOT_INS
- CYCLE_ACTIVITY:STALLS_L3_MISS
- MEM_LOAD_L3_MISS_RETIRED:LOCAL_DRAM
- MEM_LOAD_L3_MISS_RETIRED:REMOTE_DRAM
- MEM_LOAD_L3_MISS_RETIRED:REMOTE_HITM
counters:
  NUM_EDT_FINISH:
    mode: ONCE
    level: NODE
    reduce: SUM
  TIME_EDT_EXEC:
    mode: ONCE
    level: NODE
    reduce: SUM
  NUM_DB_ACQUIRE_LOCAL_HIT:
    mode: ONCE
    level: NODE
    reduce: SUM
  NUM_DB_ACQUIRE_REMOTE:
    mode: ONCE
    level: NODE
    reduce: SUM
  NUM_CXL_FLUSH_PRODUCER:
    mode: ONCE
    level: NODE
    reduce: SUM
  NUM_CXL_FLUSH_CONSUMER:
    mode: ONCE
    level: NODE
    reduce: SUM
  NUM_REMOTE_SEND:
    mode: ONCE
    level: NODE
    reduce: SUM
  NUM_REMOTE_RECEIVE:
    mode: ONCE
    level: NODE
    reduce: SUM
