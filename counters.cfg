# ARTS Framework Counter Configuration — Full Timing
# ====================================================
# All counters enabled with ONCE,CLUSTER to capture cumulative totals
# reduced across all nodes at shutdown. Switch any counter to PERIODIC
# if you need time-series snapshots during execution.
#
# Format: COUNTER_NAME=counterMode[,counterLevel[,reduceMethod]]
#
# counterMode:   OFF | ONCE | PERIODIC
# counterLevel:  THREAD | NODE | CLUSTER   (default: NODE)
# reduceMethod:  SUM | MAX | MIN | MASTER  (default: SUM)

# =============================================================================
# EDT Lifecycle — Time
# =============================================================================

# Wall-clock time executing EDT user functions (paused during yield/wait)
TIME_EDT_EXEC=ONCE,CLUSTER,SUM

# Time spent in arts_edt_create() — GUID allocation, metadata setup, route table
TIME_EDT_CREATE=ONCE,CLUSTER,SUM

# Time spent in EDT dependency signaling (internal_signal_edt)
TIME_EDT_SIGNAL=ONCE,CLUSTER,SUM

# Time saving/restoring EDT thread-local context during preemption
TIME_CONTEXT_SWITCH=ONCE,CLUSTER,SUM

# =============================================================================
# EDT Lifecycle — Count
# =============================================================================

NUM_EDT_CREATE=ONCE,CLUSTER,SUM
NUM_EDT_ACQUIRE=ONCE,CLUSTER,SUM
NUM_EDT_FINISH=ONCE,CLUSTER,SUM
NUM_EDT_SIGNAL=ONCE,CLUSTER,SUM
NUM_YIELD=ONCE,CLUSTER,SUM

# =============================================================================
# DB Lifecycle — Time
# =============================================================================

# Time spent in arts_db_create() — allocation, route table insertion, data copy
TIME_DB_CREATE=ONCE,CLUSTER,SUM

# Time spent in arts_get_from_db() — remote DataBlock read operations
TIME_DB_GET=ONCE,CLUSTER,SUM

# Time spent in arts_put_in_db() — remote DataBlock write operations
TIME_DB_PUT=ONCE,CLUSTER,SUM

# =============================================================================
# DB Lifecycle — Count
# =============================================================================

NUM_DB_CREATE=ONCE,CLUSTER,SUM
NUM_DB_GET=ONCE,CLUSTER,SUM
NUM_DB_PUT=ONCE,CLUSTER,SUM
NUM_DB_DESTROY=ONCE,CLUSTER,SUM
NUM_DB_ACQUIRE_READ=ONCE,CLUSTER,SUM
NUM_DB_ACQUIRE_WRITE=ONCE,CLUSTER,SUM
NUM_OWNER_UPDATE_SAVED=ONCE,CLUSTER,SUM
NUM_OWNER_UPDATE_PERFORMED=ONCE,CLUSTER,SUM

# =============================================================================
# DB Lifecycle — Bytes
# =============================================================================

BYTES_DB_CREATE=ONCE,CLUSTER,SUM
BYTES_DB_PUT=ONCE,CLUSTER,SUM

# =============================================================================
# Memory — Bytes
# =============================================================================

# Final heap footprint (allocated minus freed bytes)
BYTES_MEMORY_FOOTPRINT=ONCE,CLUSTER,MAX

# =============================================================================
# Network — Bytes
# =============================================================================

BYTES_REMOTE_SENT=ONCE,CLUSTER,SUM
BYTES_REMOTE_RECEIVED=ONCE,CLUSTER,SUM

# =============================================================================
# Network — Count
# =============================================================================

NUM_REMOTE_SEND=ONCE,CLUSTER,SUM
NUM_REMOTE_RECEIVE=ONCE,CLUSTER,SUM

# =============================================================================
# Network — Time
# =============================================================================

# Time spent in arts_remote_memory_move() — sending local DB data to remote node
TIME_REMOTE_MOVE=ONCE,CLUSTER,SUM

# =============================================================================
# Event — Time
# =============================================================================

TIME_EVENT_CREATE=ONCE,CLUSTER,SUM
TIME_EVENT_SIGNAL=ONCE,CLUSTER,SUM

# =============================================================================
# Event — Count
# =============================================================================

NUM_EVENT_CREATE=ONCE,CLUSTER,SUM
NUM_EVENT_SIGNAL=ONCE,CLUSTER,SUM

# =============================================================================
# Scheduling
# =============================================================================

NUM_STEAL_ATTEMPT=ONCE,CLUSTER,SUM
NUM_STEAL_SUCCESS=ONCE,CLUSTER,SUM

# Time spent inside the scheduler during arts_yield / arts_wait_on_handle
TIME_YIELD=ONCE,CLUSTER,SUM

# =============================================================================
# Epoch
# =============================================================================

NUM_EPOCH_CREATE=ONCE,CLUSTER,SUM

# =============================================================================
# Out-of-Order
# =============================================================================

NUM_OO_ENQUEUE=ONCE,CLUSTER,SUM

# =============================================================================
# Object Counters — Per arts_id Tracking
# =============================================================================
# Track per-object (per arts_id) performance metrics written to
# object_n{id}.json / object.json at shutdown.
# Enabling any EDT counter activates the per-thread EDT hash table.
# Enabling any DB counter activates the per-thread DB hash table.

OBJ_NUM_EDT=ONCE,THREAD
OBJ_TIME_EDT_EXEC=ONCE,THREAD
OBJ_TIME_EDT_STALL=ONCE,THREAD

OBJ_NUM_DB=ONCE,THREAD
OBJ_BYTES_DB_LOCAL=ONCE,THREAD
OBJ_BYTES_DB_REMOTE=ONCE,THREAD
OBJ_NUM_DB_CACHE_MISS=ONCE,THREAD

# Per-invocation trace records (one entry per EDT/DB call — can be large)
OBJ_TRACE_EDT=ONCE,THREAD
OBJ_TRACE_DB=ONCE,THREAD

# =============================================================================
# Runtime Phases — Time
# =============================================================================

# Time spent in ARTS initialization (config, network, threads, barriers)
TIME_INIT=ONCE,CLUSTER,MASTER

# Total end-to-end execution time (from init complete to shutdown)
TIME_TOTAL=ONCE,CLUSTER,MASTER
