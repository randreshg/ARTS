# ARTS Framework Counter Configuration

# ============================================================================
# EDT time
# ============================================================================

# Wall time inside EDT bodies, summed over a rank's threads and paused while a
# body blocks in arts_event_wait; includes every runtime call the body makes,
# not the acquires before it or the releases after
TIME_EDT_EXEC=PERIODIC,CLUSTER

# Wall time of arts_edt_create on the creating thread: placement, allocation,
# GUID, finish-scope join, and the ship to a remote home or the local install
# (readying the EDT and starting its DB acquires when its dependences are
# already met)
TIME_EDT_CREATE=OFF

# Wall time of arts_edt_satisfy_slot on the satisfying thread, including
# readying the EDT and starting its DB acquires when the satisfy is its last; a
# satisfy of a remote EDT is only the send
TIME_EDT_SIGNAL=OFF

# ============================================================================
# EDT counts
# ============================================================================

# EDT creates issued on this rank, whatever the EDT's home; includes the
# runtime's main EDT and, under the OCR shim, the trampoline EDT that runs
# mainEdt
NUM_EDT_CREATE=PERIODIC,CLUSTER

# EDTs whose dependences and DB acquires all completed and that were queued to
# run, on the EDT's rank
NUM_EDT_ACQUIRE=PERIODIC,CLUSTER

# EDTs whose body returned, on the executing rank; includes the main EDT and
# the shim's trampoline, not EDTs destroyed before running or abandoned at
# shutdown
NUM_EDT_FINISH=PERIODIC,CLUSTER

# EDT dependence-slot satisfactions (arts_edt_satisfy_slot calls), counted on
# the rank that issues them
NUM_EDT_SIGNAL=OFF

# Calls to arts_event_wait
NUM_YIELD=OFF

# ============================================================================
# DB time
# ============================================================================

# Wall time of arts_db_create on the creating thread: placement, descriptor and
# payload allocation, GUID mint, and the local install or the announce to a
# remote home (no payload copy)
TIME_DB_CREATE=OFF

# ============================================================================
# DB counts
# ============================================================================

# arts_db_create calls that returned a block, counted on the creating rank
# whatever the block's home, with or without a hold
NUM_DB_CREATE=PERIODIC,CLUSTER

# The creates NUM_DB_CREATE counts that passed ARTS_DB_PROP_NO_ACQUIRE (no
# creator hold)
NUM_DB_CREATE_NO_ACQUIRE=OFF

# arts_db_destroy calls on a DataBlock GUID, on the calling rank
NUM_DB_DESTROY=OFF

# EDT read acquisitions: one per (EDT, block) whose strongest slot names it RO,
# on the EDT's rank when the slot reaches the block's arm (several slots naming
# one block are one acquisition, in the strongest mode)
NUM_DB_ACQUIRE_READ=OFF

# EDT write acquisitions: one per (EDT, block) whose strongest slot names it
# RW, plus one per create that takes the creator's hold, on the creating rank
NUM_DB_ACQUIRE_WRITE=OFF

# ============================================================================
# Coherence: acquires
# ============================================================================

# Acquisitions (READ + WRITE) whose rank held what they need at their decision,
# whatever they then waited behind (a write right installed but not yet
# confirmed included): the write right for a write; for a read a valid copy it
# may read, a read turn, the write right or, under validation, the block's home
# answering itself (a create's hold, a zero-size block and a serve from what
# the rank holds included: a phase change on the rank, a create's claim of its
# first-touch cache); under the voluntary-return policy every acquisition on
# the block's home rank; every acquisition of a one-rank run
NUM_DB_ACQUIRE_LOCAL_HIT=OFF

# Acquisitions (READ + WRITE) whose permission or copy had to come from another
# rank: a grant or migration of the write right, a read turn, read reply or
# first publish another rank sent, and a validation read off the block's home
# that its rank's write right does not cover; never decided by the messages an
# acquisition caused, what it waited behind or which path ended the wait (a
# first publish counts from its publisher's rank); LOCAL_HIT + REMOTE = READ +
# WRITE when the shutdown is quiescent (an acquisition a non-quiescent shutdown
# leaves parked is in neither)
NUM_DB_ACQUIRE_REMOTE=OFF

# ============================================================================
# DB bytes
# ============================================================================

# Declared bytes of the blocks NUM_DB_CREATE counts
BYTES_DB_CREATE=OFF

# ============================================================================
# Coherence: payload
# ============================================================================

# Datablock bytes this rank put on the fabric one-sided (a CXL store's
# transfers are the CXL counters)
BYTES_DB_PAYLOAD_SENT=OFF

# Datablock payloads this rank put on the fabric one-sided, one per payload
# however many pieces the provider cut it into
NUM_DB_PAYLOAD_SENT=OFF

# Time from a payload PUT's post to its last piece's local completion (time on
# the sender's retry ring included), added by the thread that reaps that
# completion
TIME_DB_PAYLOAD_PUT=OFF

# ============================================================================
# Memory
# ============================================================================

# Usable bytes held through the runtime's arts_malloc family (control
# structures, not DB payloads or the registered pool); a thread's value wraps
# when another thread frees what it allocated, so read it as a node or cluster
# SUM
BYTES_MEMORY_FOOTPRINT=PERIODIC,CLUSTER

# ============================================================================
# Network bytes
# ============================================================================

# Bytes this rank put on the fabric: each two-sided message's header and tail
# plus each one-sided datablock payload (no provider framing, no retries)
BYTES_REMOTE_SENT=PERIODIC,CLUSTER

# Bytes this rank took in from the fabric: each dispatched two-sided message's
# header and tail plus each landed datablock payload's whole length
BYTES_REMOTE_RECEIVED=PERIODIC,CLUSTER

# ============================================================================
# Network counts
# ============================================================================

# Two-sided messages this rank sent (one-sided payloads are
# NUM_DB_PAYLOAD_SENT)
NUM_REMOTE_SEND=PERIODIC,CLUSTER

# Two-sided messages this rank dispatched
NUM_REMOTE_RECEIVE=PERIODIC,CLUSTER

# ============================================================================
# CXL flush
# ============================================================================

# Producer flushes of the CXL store (a purge publishing a turn's writes)
NUM_CXL_FLUSH_PRODUCER=OFF

# Consumer flushes of the CXL store (a fetch dropping stale private lines
# before a grant is read)
NUM_CXL_FLUSH_CONSUMER=OFF

# Declared bytes of the blocks producer flushes swept
BYTES_CXL_FLUSH_PRODUCER=OFF

# Declared bytes of the blocks consumer flushes swept
BYTES_CXL_FLUSH_CONSUMER=OFF

# Time in producer flushes, the cache-line sweep and its sfence
TIME_CXL_FLUSH_PRODUCER=OFF

# Time in consumer flushes, the cache-line sweep and its mfence
TIME_CXL_FLUSH_CONSUMER=OFF

# ============================================================================
# Event counts
# ============================================================================

# Event creates issued on this rank, including the finish-scope proxies the
# runtime makes on an EDT's home when its scope is homed elsewhere
NUM_EVENT_CREATE=OFF

# Events retired on their home (explicit destroy, auto-destroy after firing, a
# counted event's last bind); summed over the cluster, creates minus this is
# what remains
NUM_EVENT_DESTROY=OFF

# ============================================================================
# Scheduling
# ============================================================================

# EDTs a worker took from another thread's deque (a worker's or a progress
# thread's) and ran, counted on the thief
NUM_STEAL_SUCCESS=OFF

# ============================================================================
# Out-of-order
# ============================================================================

# Pushes onto a route slot's OoO list, one per park or re-park (a non-create
# operation whose target is not installed, or a create whose GUID is still
# occupied)
NUM_OO_ENQUEUE=OFF

# ============================================================================
# Validation arm
# ============================================================================

# VAL read requests this rank sent, one per message: re-sends after a size
# round, a dismiss or a write give-back and the home's request to itself
# included
NUM_SNAPSHOT_REQUEST=OFF

# VAL read replies with no payload because the requester's ledger already held
# that version, counted at the replying rank
NUM_SNAPSHOT_HEADER_ONLY=OFF

# VAL read size rounds (the size alone, to a request that could not size a
# landing), counted at the replying rank; dismisses excluded
NUM_SNAPSHOT_SIZE_CTS=OFF

# VAL read windows opened: every read request that is not a re-send (a first
# reader's, the next window an answer opens, a write give-back's)
NUM_RO_COMBINE_WINDOW=OFF

# VAL readers that sent no request of their own: parked for the next window or
# riding the rank's write request
NUM_RO_COMBINE_JOINED=OFF

# ============================================================================
# Size rounds
# ============================================================================

# Size rounds on the grant plane (VAL, INV), counted at the home; with the GUID
# size hint only reserved or labeled GUIDs take one
NUM_GRANT_SIZE_CTS=OFF

# Size rounds on the EXCL plane, counted at the home; dismisses excluded
NUM_EXCL_SIZE_CTS=OFF

# Size rounds on the INV read plane, counted at the home; dismisses excluded
NUM_INV_SIZE_CTS=OFF

# Size rounds on the FLUSH fetch plane, counted at the home
NUM_FLUSH_SIZE_CTS=OFF

# ============================================================================
# Invalidation arm
# ============================================================================

# INV invalidation rounds at the home that retired at least one release (a
# round batches every release queued when it starts)
NUM_INVALIDATE_ROUND=OFF

# Sharer copies the home's rounds targeted, one ack each (a target that held no
# valid copy and the WB home's own copy included)
NUM_INVALIDATE_ACK=OFF

# Time an INV RW release blocks on its round (under WT the payload
# write-through included; a joined release waits for the flight it joined)
TIME_INVALIDATE_ROUND=OFF

# ============================================================================
# Write grant
# ============================================================================

# Write requests this rank committed on the grant plane, one per round asked
# for (the home's request to itself included)
NUM_GRANT_MIGRATE=OFF

# Write turns taken on a grant this rank already held
NUM_GRANT_LOCAL_REUSE=OFF

# ============================================================================
# Exclusion arm
# ============================================================================

# EXCL requests, read or write, the home could not grant at its decision and
# queued
NUM_EXCL_QUEUE_WAIT=OFF

# ============================================================================
# Retention arm
# ============================================================================

# Read grants the home asked back so a writer could proceed, one per retaining
# rank (itself included)
NUM_EXCL_RECALL_SENT=OFF

# Recalls that overtook their grant and had to be remembered, once per recall
NUM_EXCL_RECALL_EARLY=OFF

# ============================================================================
# Publish flight
# ============================================================================

# Publish flights launched (payload or control)
NUM_PUB_FLIGHT=ONCE,NODE

# Releases coalesced into an already-open flight
NUM_PUB_FLIGHT_JOIN=ONCE,NODE

# Trailing relaunches for waiters an ACK left uncovered
NUM_PUB_FLIGHT_TRAILING=ONCE,NODE

# Credit-less announce legs (credit teachers not covering)
NUM_PUB_CTS_FALLBACK=ONCE,NODE

# Parked publish waiters woken by destroy/teardown, not an ACK
NUM_PUB_FLIGHT_ABANDON=ONCE,NODE

# ============================================================================
# Write grant
# ============================================================================

# Post-release re-check found queued work and re-claimed the baton
NUM_GRANT_BATON_RECLAIM=ONCE,NODE

# Ownership grants into the WT home (permission only, no payload)
NUM_GRANT_HOME_DATALESS=ONCE,NODE

# Write rights handed back at a holder's own idle edge, standalone
NUM_GRANT_PURGE_RETURN=ONCE,NODE

# Hand-backs that rode a release's own publish instead of a standalone return
NUM_GRANT_PURGE_FLAG=ONCE,NODE

# Purge hand-backs the home accepted; RETURN+FLAG minus ACCEPT is still in
# flight
NUM_GRANT_PURGE_ACCEPT=ONCE,NODE

# Hand-backs parked because another thread was inside the home's serving tail
NUM_GRANT_PURGE_LATCHED=ONCE,NODE

# Settles that found the hand-back token armed under a later grant generation
# and left it alone
NUM_GRANT_PURGE_STALE_SETTLE=ONCE,NODE

# Grants served with permission alone because the requester already held the
# current copy
NUM_GRANT_REGRANT_DEDUP=ONCE,NODE

# ============================================================================
# Voluntary return
# ============================================================================

# Hand-backs of a permission (with its bytes, if any) a rank sent the block's
# home under the voluntary-return release policy, counted on the returning
# rank; the home's own idle edge sends nothing. Grant plane:
# NUM_GRANT_PURGE_RETURN + NUM_GRANT_PURGE_FLAG; exclusion: every read and
# write turn a rank other than the home gave back
NUM_PURGE_RETURN=ONCE,NODE
