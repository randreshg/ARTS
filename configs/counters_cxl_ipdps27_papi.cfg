# ARTS counter configuration for the IPDPS'27 CXL-vs-network comparison, with
# PAPI hardware events.  counters_cxl_ipdps27.cfg plus every PAPI scope; build
# a separate tree with it and -DARTS_USE_PAPI=ON (README "PAPI hardware
# counters").  Counters not named here are OFF.  A PAPI tree is a counter
# build: take wall times from the uninstrumented tree, not this one.
#
# End-to-end time is not a counter: run with ARTS_E2E_MARKER=1 and rank 0
# prints "[E2E] <ns>" (application start to shutdown recognition).
#
# Bandwidths are derived, not counted: BYTES_* / TIME_* is the throughput of
# one operation (operations on different threads overlap), BYTES_* / E2E the
# aggregate rate.

# ============================================================================
# EDT timings: TIME_* / NUM_* is the mean per EDT
# ============================================================================

TIME_EDT_EXEC=ONCE,NODE,SUM
NUM_EDT_FINISH=ONCE,NODE,SUM
TIME_EDT_CREATE=ONCE,NODE,SUM
NUM_EDT_CREATE=ONCE,NODE,SUM
TIME_EDT_SIGNAL=ONCE,NODE,SUM
NUM_EDT_SIGNAL=ONCE,NODE,SUM

# ============================================================================
# DB creates: TIME_* / NUM_* is the mean per create, BYTES_* / NUM_* the mean
# size.  NUM/BYTES count home-local creates only (db_create_in_place); TIME
# covers every arts_db_create call.
# ============================================================================

TIME_DB_CREATE=ONCE,NODE,SUM
NUM_DB_CREATE=ONCE,NODE,SUM
BYTES_DB_CREATE=ONCE,NODE,SUM

# ============================================================================
# CXL producer (purge) and consumer (fetch) flushes: zero in a network build
# ============================================================================

TIME_CXL_FLUSH_PRODUCER=ONCE,NODE,SUM
BYTES_CXL_FLUSH_PRODUCER=ONCE,NODE,SUM
NUM_CXL_FLUSH_PRODUCER=ONCE,NODE,SUM
TIME_CXL_FLUSH_CONSUMER=ONCE,NODE,SUM
BYTES_CXL_FLUSH_CONSUMER=ONCE,NODE,SUM
NUM_CXL_FLUSH_CONSUMER=ONCE,NODE,SUM

# ============================================================================
# Datablock payloads moved over the network: near zero in a CXL build
# ============================================================================

TIME_DB_PAYLOAD_PUT=ONCE,NODE,SUM
BYTES_DB_PAYLOAD_SENT=ONCE,NODE,SUM
NUM_DB_PAYLOAD_SENT=ONCE,NODE,SUM

# ============================================================================
# Message counts: normalise PAPI_NET_SEND and PAPI_MSG_HANDLER per message
# ============================================================================

NUM_REMOTE_SEND=ONCE,NODE,SUM
NUM_REMOTE_RECEIVE=ONCE,NODE,SUM

# ============================================================================
# PAPI scopes: a bare scope name enables all six of its E0..E5 slots, which
# count the run's papi_events in order.  Scopes are inclusive and overlap
# (DB_RELEASE includes the flushes it causes), so compare them, never add them.
# ============================================================================

PAPI_TOTAL_WORKER=ONCE,NODE,SUM
PAPI_TOTAL_PROGRESS=ONCE,NODE,SUM
PAPI_EDT=ONCE,NODE,SUM
PAPI_DB_ACQUIRE=ONCE,NODE,SUM
PAPI_DB_RELEASE=ONCE,NODE,SUM
PAPI_CXL_FLUSH_PRODUCER=ONCE,NODE,SUM
PAPI_CXL_FLUSH_CONSUMER=ONCE,NODE,SUM
PAPI_NET_SEND=ONCE,NODE,SUM
PAPI_MSG_HANDLER=ONCE,NODE,SUM
