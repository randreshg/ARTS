# ARTS counter configuration for the IPDPS'27 CXL-vs-network comparison.
# Build network and CXL-DIRECT ARTS against this same file so both arms
# carry the same instrumentation.  Counters not named here are OFF.
#
# End-to-end time is not a counter: run with ARTS_E2E_MARKER=1 and rank 0
# prints "[E2E] <ns>" (application start to shutdown recognition).
#
# Bandwidths are derived, not counted: BYTES_* / TIME_* is the throughput of
# one operation (operations on different threads overlap), BYTES_* / E2E the
# aggregate rate.

# ============================================================================
# EDT timings: TIME_* / NUM_* is the mean per EDT
# ============================================================================

TIME_EDT_EXEC=ONCE,NODE,SUM
NUM_EDT_FINISH=ONCE,NODE,SUM
TIME_EDT_CREATE=ONCE,NODE,SUM
NUM_EDT_CREATE=ONCE,NODE,SUM
TIME_EDT_SIGNAL=ONCE,NODE,SUM
NUM_EDT_SIGNAL=ONCE,NODE,SUM

# ============================================================================
# CXL producer (purge) and consumer (fetch) flushes: zero in a network build
# ============================================================================

TIME_CXL_FLUSH_PRODUCER=ONCE,NODE,SUM
BYTES_CXL_FLUSH_PRODUCER=ONCE,NODE,SUM
NUM_CXL_FLUSH_PRODUCER=ONCE,NODE,SUM
TIME_CXL_FLUSH_CONSUMER=ONCE,NODE,SUM
BYTES_CXL_FLUSH_CONSUMER=ONCE,NODE,SUM
NUM_CXL_FLUSH_CONSUMER=ONCE,NODE,SUM

# ============================================================================
# Datablock payloads moved over the network: near zero in a CXL build
# ============================================================================

TIME_DB_PAYLOAD_PUT=ONCE,NODE,SUM
BYTES_DB_PAYLOAD_SENT=ONCE,NODE,SUM
NUM_DB_PAYLOAD_SENT=ONCE,NODE,SUM
