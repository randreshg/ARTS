[ARTS]
################################################################################
# crete: 4 nodes, EXCL x PURGE, CXL datablocks
#
# Generated by script/test_excl_purge_crete.py -- edit the settings at the top
# of that script and re-run it with --write-configs-only to regenerate.
################################################################################

# --- threading ---
worker_threads=16
progress_threads=1
pin=1

# --- scheduling ---
worker_init_deque_size=4096
route_table_size=16

# --- networking ---
provider=tcp
port_count=1

# --- launcher ---
launcher=ssh
master_node=ca-fcp0
node_count=4
nodes=ca-fcp0,ca-fcp1,ca-fcp2,ca-fcp3
ports=25000

# --- debug ---
core_dump=0
kill_mode=0

# --- CXL (read only by an ARTS_USE_CXL build) ---
# static pins every datablock to one device; the sweep
# wants them spread.
cxl_db_allocation_strategy=round_robin
